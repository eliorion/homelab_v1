# Public relay. Runs on the VPS, not in the cluster.
#
#   docker compose up -d --build
#
# Reads .env (copy .env.example). The master is never exposed to the internet:
# this pulls one copy over the tailnet and fans it out.
services:
  relay:
    build: .
    restart: unless-stopped
    # Bind only the listener port. Icecast's admin console lives on the same
    # port and is password-protected; if this host faces the internet directly,
    # restrict /admin at the firewall as well — see README.
    ports:
      - "8000:8000"
    environment:
      MASTER_HOST: ${MASTER_HOST}
      MASTER_PORT: ${MASTER_PORT:-8000}
      MOUNT: ${MOUNT:-/radio.mp3}
      RELAY_PUBLIC_HOST: ${RELAY_PUBLIC_HOST}
      MAX_CLIENTS: ${MAX_CLIENTS:-50}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SOURCE_PASSWORD: ${SOURCE_PASSWORD}
      RELAY_PASSWORD: ${RELAY_PASSWORD}
    healthcheck:
      # Icecast answers /status-json.xsl even with no source connected, so this
      # checks the server rather than the presence of listeners.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/status-json.xsl"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
