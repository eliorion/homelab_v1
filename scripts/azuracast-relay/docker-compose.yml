# Public relay: runs on the VPS, reads .env (copy .env.example). See README.md.
services:
  relay:
    build: .
    restart: unless-stopped
    # Icecast's admin console shares this port — restrict /admin at the firewall too.
    ports:
      - "8000:8000"
    environment:
      MASTER_HOST: ${MASTER_HOST}
      MASTER_PORT: ${MASTER_PORT:-8000}
      MOUNT: ${MOUNT:-/radio.mp3}
      RELAY_PUBLIC_HOST: ${RELAY_PUBLIC_HOST}
      MAX_CLIENTS: ${MAX_CLIENTS:-50}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SOURCE_PASSWORD: ${SOURCE_PASSWORD}
      RELAY_PASSWORD: ${RELAY_PASSWORD}
    healthcheck:
      # /status-json.xsl answers even with no source connected; the mount does not.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/status-json.xsl"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
