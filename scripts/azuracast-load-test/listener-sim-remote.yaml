# Listeners that reach the stream through the off-site tailnet proxies, so the
# audio crosses the real home uplink. Two sites, ramped together. See README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listener-sim-site-b
  namespace: azuracast-loadtest
  labels: { app: listener-sim-remote, site: b }
spec:
  replicas: 0
  selector:
    matchLabels: { app: listener-sim-remote, site: b }
  template:
    metadata:
      labels: { app: listener-sim-remote, site: b }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: azuracast }
              namespaces: ["azuracast"]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: listener
          image: curlimages/curl:8.19.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          env:
            - name: LISTENERS
              value: "1"
            - name: PROXY
              value: http://tailscale-proxy-00.tailscale.svc.cluster.local:8888
            - name: STREAM_URL
              value: http://azuracast-stream.tail45b0ca.ts.net:8000/radio.mp3
            # Long enough that Icecast's connect burst (64 KiB) is a rounding
            # error on the average rather than a few percent of it.
            - name: WINDOW
              value: "120"
          command:
            - sh
            - -c
            - |
              set -u
              echo "site=$SITE listeners=$LISTENERS via $PROXY"
              i=1
              while [ "$i" -le "$LISTENERS" ]; do
                (
                  while true; do
                    # No "|| echo 0" fallback. --max-time makes curl exit 28 on
                    # every completed window, but -w has already printed the real
                    # rate — a fallback fires alongside it and puts a phantom
                    # zero after every reading, halving the median and reporting
                    # saturation at one listener.
                    curl -sS -x "$PROXY" -o /dev/null --max-time "$WINDOW" \
                      -w "rate %{speed_download}\n" "$STREAM_URL" 2>/dev/null || true
                  done
                ) &
                i=$((i + 1))
                sleep 0.05
              done
              wait
          envFrom:
            - configMapRef:
                name: listener-sim-site-b
          resources:
            requests: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: listener-sim-site-b
  namespace: azuracast-loadtest
data:
  SITE: "b"
---
