apiVersion: apps/v1
kind: Deployment
metadata:
  name: listener-sim
  namespace: azuracast-loadtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: listener-sim
  template:
    metadata:
      labels:
        app: listener-sim
    spec:
      affinity:
        podAntiAffinity:
          # Must stay required: on the AzuraCast node the stream crosses a veth
          # instead of a NIC and the generator's CPU competes with the subject.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: azuracast
              namespaces: ["azuracast"]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: listener
          image: curlimages/curl:8.19.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: LISTENERS
              value: "1"
            - name: STREAM_URL
              value: http://azuracast.azuracast.svc.cluster.local:8000/radio.mp3
          # One curl per simulated listener, staggered so they do not all arrive
          # in one burst.
          command:
            - sh
            - -c
            - |
              set -eu
              echo "opening $LISTENERS listener(s) against $STREAM_URL"
              i=1
              while [ "$i" -le "$LISTENERS" ]; do
                curl -sS -o /dev/null --no-buffer "$STREAM_URL" &
                i=$((i + 1))
                sleep 0.05
              done
              echo "all $LISTENERS connected"
              wait
          # Requests only: a CPU limit throttles the readers and under-reports
          # egress. Do not add limits.
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
