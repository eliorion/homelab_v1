apiVersion: v1
kind: Namespace
metadata:
  name: hdd-burnin
  labels:
    # enforce: privileged is required, not a preference — the fio pod mounts a
    # hostPath, which the cluster default (baseline) forbids.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
