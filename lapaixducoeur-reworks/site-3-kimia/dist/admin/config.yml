# Sveltia CMS — generated by scripts/cms-config.mjs (edit that script, not this file).
# Before go-live: set backend.repo, and an OAuth endpoint (Sveltia CMS Authenticator on Cloudflare Workers).
backend:
  name: github
  repo: OWNER/REPO
  branch: main
  base_url: "https://sveltia-cms-auth.EXAMPLE.workers.dev"
publish_mode: editorial_workflow
media_folder: static/assets/uploads
public_folder: /assets/uploads
site_url: "https://lapaixducoeur.ca"
display_url: "https://lapaixducoeur.ca"
locale: fr
i18n:
  structure: single_file
  locales: [fr, en]
  default_locale: fr
collections:
  - name: news
    label: "Nouvelles / News"
    label_singular: Nouvelle
    folder: content/news
    format: json
    extension: json
    create: true
    i18n: true
    identifier_field: title
    slug: "{{year}}-{{slug}}"
    summary: "{{date}} — {{title}}"
    sortable_fields: [date, title]
    fields:
      - name: title
        label: "Titre / Title"
        widget: string
        i18n: true
      - name: slug
        label: "Adresse (slug) — minuscules et tirets"
        widget: string
        i18n: true
        pattern: ["^[a-z0-9-]+$", "minuscules, chiffres et tirets"]
      - name: date
        label: Date
        widget: datetime
        time_format: false
        date_format: YYYY-MM-DD
        format: YYYY-MM-DD
        i18n: duplicate
      - name: category
        label: "Catégorie"
        widget: string
        i18n: true
      - name: sample
        label: "Contenu d’exemple (badge « à confirmer »)"
        widget: boolean
        default: false
        i18n: duplicate
      - name: image
        label: Image
        widget: image
        i18n: duplicate
      - name: imageAlt
        label: "Texte alternatif de l’image (obligatoire)"
        widget: string
        i18n: true
      - name: summary
        label: "Résumé"
        widget: text
        i18n: true
      - name: body
        label: Texte
        widget: markdown
        i18n: true
  - name: events
    label: "Événements / Events"
    label_singular: "Événement"
    folder: content/events
    format: json
    extension: json
    create: true
    i18n: true
    identifier_field: title
    slug: "{{fields.start}}-{{slug}}"
    summary: "{{start}} — {{title}}"
    sortable_fields: [start, title]
    fields:
      - name: title
        label: "Titre / Title"
        widget: string
        i18n: true
      - name: slug
        label: "Adresse (slug)"
        widget: string
        i18n: true
        pattern: ["^[a-z0-9-]+$", "minuscules, chiffres et tirets"]
      - name: start
        label: "Début (heure de Montréal)"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm"
        i18n: duplicate
      - name: end
        label: "Fin (heure de Montréal)"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm"
        i18n: duplicate
      - name: category
        label: Type
        widget: select
        options: [collecte, maraude, atelier, priere, communaute]
        i18n: duplicate
      - name: venue
        label: "Lieu (ville ou « communiqué aux inscrits » — jamais d’adresse sensible)"
        widget: string
        i18n: true
      - name: summary
        label: "Résumé"
        widget: text
        i18n: true
      - name: body
        label: "Détails"
        widget: markdown
        i18n: true
      - name: image
        label: Illustration
        widget: image
        required: false
        i18n: duplicate
      - name: ticketUrl
        label: "Lien Zeffy (billets / inscription)"
        widget: string
        required: false
        i18n: duplicate
      - name: sample
        label: "Contenu d’exemple"
        widget: boolean
        default: false
        i18n: duplicate
  - name: media
    label: "Médiathèque / Media"
    label_singular: "Média"
    folder: content/media
    format: json
    extension: json
    create: true
    i18n: true
    identifier_field: title
    summary: "{{type}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - name: type
        label: Type
        widget: select
        options: [photo, illustration, video, audio]
        i18n: duplicate
      - name: category
        label: "Catégorie (galerie)"
        widget: select
        options: [alimentaire, vestimentaire, academique, communaute, foi, maraude, video, audio]
        i18n: duplicate
      - name: title
        label: Titre
        widget: string
        i18n: true
      - name: src
        label: "Image (photo, illustration ou affiche vidéo)"
        widget: image
        required: false
        i18n: duplicate
        hint: "Photo d’enfant : seulement avec consentement écrit du parent ou tuteur."
