        file: content/pages/letters.json
        i18n: true
        fields:
          - { name: meta_title, label: "Titre SEO", widget: string, i18n: true }
          - { name: meta_description, label: "Description SEO", widget: text, i18n: true }
          - { name: kicker, label: Surtitre, widget: string, i18n: true }
          - { name: title, label: "Titre (H1)", widget: string, i18n: true }
          - { name: intro, label: Intro, widget: text, i18n: true }
          - { name: rules_title, label: "Règles — titre", widget: string, i18n: true }
          - { name: rules, label: Règles, widget: list, i18n: true }
          - { name: ideas_title, label: "Idées — titre", widget: string, i18n: true }
          - { name: ideas, label: Idées, widget: list, i18n: true }
      - name: charter
        label: "Charte du récit éthique"
        file: content/pages/charter.json
        i18n: true
        fields:
          - { name: meta_title, label: "Titre SEO", widget: string, i18n: true }
          - { name: meta_description, label: "Description SEO", widget: text, i18n: true }
          - { name: kicker, label: Surtitre, widget: string, i18n: true }
          - { name: title, label: "Titre (H1)", widget: string, i18n: true }
          - { name: intro, label: Intro, widget: text, i18n: true }
          - { name: commitments, label: Engagements, widget: list, i18n: true, fields: [{ name: title, label: Titre, widget: string }, { name: text, label: Texte, widget: text }] }
          - { name: contact, label: "Phrase de contact", widget: text, i18n: true }
      - name: news
        label: "Nouvelles — page"
        file: content/pages/news.json
        i18n: true
        fields: *intro_fields
      - name: events
        label: "Événements — page"
        file: content/pages/events.json
        i18n: true
        fields:
          - { name: meta_title, label: "Titre SEO", widget: string, i18n: true }
          - { name: meta_description, label: "Description SEO", widget: text, i18n: true }
          - { name: kicker, label: Surtitre, widget: string, i18n: true }
          - { name: title, label: "Titre (H1)", widget: string, i18n: true }
          - { name: intro, label: Intro, widget: text, i18n: true }
          - { name: empty, label: "Message si aucun événement", widget: string, i18n: true }
      - name: media
        label: "Médiathèque — page"
        file: content/pages/media.json
        i18n: true
        fields:
          - { name: meta_title, label: "Titre SEO", widget: string, i18n: true }
          - { name: meta_description, label: "Description SEO", widget: text, i18n: true }
          - { name: kicker, label: Surtitre, widget: string, i18n: true }
          - { name: title, label: "Titre (H1)", widget: string, i18n: true }
          - { name: intro, label: Intro, widget: text, i18n: true }
          - { name: photos_title, label: "Photos — titre", widget: string, i18n: true }
          - { name: videos_title, label: "Vidéos — titre", widget: string, i18n: true }
          - { name: audio_title, label: "Audio — titre", widget: string, i18n: true }
      - name: give
        label: "Soutenir / Give"
        file: content/pages/give.json
        i18n: true
        fields:
          - { name: meta_title, label: "Titre SEO", widget: string, i18n: true }
          - { name: meta_description, label: "Description SEO", widget: text, i18n: true }
          - { name: kicker, label: Surtitre, widget: string, i18n: true }
          - { name: title, label: "Titre (H1)", widget: string, i18n: true }
          - { name: intro, label: Intro, widget: text, i18n: true }
          - { name: amounts, label: "Montants suggérés", widget: list, i18n: true, fields: [{ name: amount, label: "Montant ($)", widget: number, value_type: int }, { name: text, label: "Ce que ça permet", widget: string }] }
          - { name: amounts_note, label: "Note sur les montants", widget: string, i18n: true }
          - { name: zeffy_note, label: "Note Zeffy", widget: string, i18n: true }
          - { name: receipt_note, label: "Note reçus fiscaux", widget: string, i18n: true }
          - { name: interac_title, label: "Interac — titre", widget: string, i18n: true }
          - { name: interac_text, label: "Interac — texte", widget: text, i18n: true }
          - { name: bank_title, label: "Banque — titre", widget: string, i18n: true }
          - { name: bank_text, label: "Banque — texte (ne jamais publier de numéro de compte)", widget: text, i18n: true }
          - { name: other_title, label: "Autres façons — titre", widget: string, i18n: true }
          - { name: other, label: "Autres façons", widget: list, i18n: true, fields: [{ name: title, label: Titre, widget: string }, { name: text, label: Texte, widget: text }, { name: link, label: "Lien vers", widget: select, options: [prayer, letters, contact, events, give] }] }
      - name: contact
        label: Contact
        file: content/pages/contact.json
        i18n: true
        fields:
          - { name: meta_title, label: "Titre SEO", widget: string, i18n: true }
          - { name: meta_description, label: "Description SEO", widget: text, i18n: true }
          - { name: kicker, label: Surtitre, widget: string, i18n: true }
          - { name: title, label: "Titre (H1)", widget: string, i18n: true }
          - { name: intro, label: Intro, widget: text, i18n: true }
          - { name: email_label, label: "Libellé courriel", widget: string, i18n: true }
          - { name: address_label, label: "Libellé adresse", widget: string, i18n: true }
          - { name: address, label: Adresse, widget: string, i18n: true }
          - { name: phone_label, label: "Libellé téléphone", widget: string, i18n: true }
          - { name: phone, label: Téléphone, widget: string, i18n: true }
      - name: privacy
        label: "Confidentialité (Loi 25)"
        file: content/pages/privacy.json
        i18n: true
        fields:
