apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: seaweedfs
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: seaweedfs.rules
      rules:
        # UNVERIFIED AGAINST A LIVE ENDPOINT -- confirm every metric name against
        # the master, volume and filer /metrics before trusting these to page.
        # The chart's own ServiceMonitors provide the scrape; these are the
        # alerts it does not ship.
        - alert: SeaweedFSVolumeServerDown
          expr: up{job=~".*seaweedfs.*volume.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: SeaweedFS volume server on {{ $labels.node }} is down
            description: >-
              With volume servers on only two nodes and replication 010, losing
              one leaves a single rack. Existing data stays READABLE from its
              surviving copy, but every volume with a replica here is now
              read-only and NO new volume can be grown until it returns.

        - alert: SeaweedFSMasterQuorumAtRisk
          expr: count(up{job=~".*seaweedfs.*master.*"} == 1) < 2
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Fewer than 2 SeaweedFS masters are up
            description: >-
              Raft needs a majority of 3. Without a leader, file-id assignment
              fails and no write succeeds anywhere in the tier.

        - alert: SeaweedFSFilerDown
          expr: count(up{job=~".*seaweedfs.*filer.*"} == 1) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No SeaweedFS filer is up
            description: >-
              The filer is the metadata path for both the hdd StorageClass and
              the S3 gateway. Every hdd PVC mount and every S3 request fails.
              Check seaweedfs-db first -- the filer store is Postgres.

        - alert: SeaweedFSVolumeSlotsExhausted
          # The silent failure mode of this topology. When a rack runs out of
          # free slots the master DROPS it from placement with no error, and
          # every new volume lands on the remaining rack pair. Nothing else
          # tells you new data has stopped being replicated the way you think.
          expr: >-
            (SeaweedFS_volumeServer_max_volumes - SeaweedFS_volumeServer_volumes) <= 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: SeaweedFS volume server {{ $labels.instance }} is nearly out of volume slots
            description: >-
              Placement is weighted by free SLOTS, not bytes. Once this reaches
              zero the master stops choosing this rack and new volumes quietly
              lose their copy here.
