apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The metrics these rules read do not exist by default -- they come from the
# CNPG customQueriesConfigMap patches in apps/staging/databases/{asp,scraper}.
# Both halves must ship together or every rule here is silently inert.
resources:
  - prometheusrule.yaml
