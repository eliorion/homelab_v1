apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-alerts
  namespace: monitoring
  labels:
    # Matches Prometheus ruleSelector.
    release: kube-prometheus-stack
spec:
  groups:
    - name: cnpg-wal-archiving.rules
      rules:
        - alert: CNPGWALArchivingFailing
          expr: |
            increase(cnpg_pg_stat_archiver_failed_count[15m]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving is failing on {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "pg_stat_archiver.failed_count is climbing. Until this clears, pg_wal grows without bound and the volume will fill. Run: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c plugin-barman-cloud | grep -i error. See documentations/12-garage-object-storage.md."
        # NOT seconds_since_last_archival: a quiet database legitimately
        # archives nothing for days. `for: 15m` rides out a segment switch.
        - alert: CNPGWALArchiveBacklog
          expr: |
            cnpg_collector_pg_wal_archive_status{value="ready"} > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $value }} WAL segments waiting to be archived on {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Segments are finished but not shipped, so Postgres cannot recycle them and pg_wal only grows -- this ends with CNPG shutting the instance down on low disk and every client losing the -rw Service. Check the ObjectStore (region, endpoint, credentials) and the plugin-barman-cloud sidecar logs. See documentations/12-garage-object-storage.md."
        - alert: CNPGWALGenerationHigh
          expr: |
            increase(cnpg_collector_wal_bytes[1h]) > 3 * 1024 * 1024 * 1024
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} wrote {{ $value | humanize1024 }}B of WAL in the last hour"
            description: "Sustained WAL above 3GiB/h fills the volume within days if archiving stalls (fbref-db did on 2026-10-15). Check the full-page-image share (pg_stat_wal.wal_fpi), checkpoint frequency (pg_stat_checkpointer.num_requested) and no-op upserts. See apps/base/databases/fbref/README.md, WAL volume."
    - name: cnpg-backup.rules
      rules:
        # The plugin's own catalog timestamp, not cnpg_collector_last_available_backup_timestamp:
        # that one is 0 on every cluster backed up with method: plugin. Covers both a
        # ScheduledBackup that stops creating Backups (asp/fbref/ai-gateway/keycloak froze
        # 2026-10-21 for 6 days, CNPG #10562) and backups that run but fail.
        - alert: CNPGBaseBackupStale
          expr: |
            time() - max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
              > 30 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "No base backup of {{ $labels.namespace }} for {{ $value | humanizeDuration }}"
            description: "Daily backups should keep this under 24h. Check the ScheduledBackup first: kubectl -n {{ $labels.namespace }} get scheduledbackup -o wide -- a stale LAST BACKUP with BackupCreation 'already exists' events is the CNPG 1.29.1 deadlock (fix: change the schedule's time of day). Otherwise check the latest Backup's status.error and the plugin-barman-cloud sidecar logs."
    - name: cnpg-replication.rules
      rules:
        # Streaming replicas seen by each primary vs. instance pods minus one; the
        # cluster name is the pod name minus its `-<n>` serial. See monitoring/configs/README.md.
        - alert: CNPGReplicaNotStreaming
          expr: |
            label_replace(
              cnpg_pg_replication_streaming_replicas
                and on (namespace, pod) (cnpg_pg_replication_in_recovery == 0),
              "cluster", "$1", "pod", "(.+)-[0-9]+")
            < on (namespace, cluster)
            (count by (namespace, cluster) (
              label_replace(kube_pod_info{pod=~".+-db-[0-9]+"}, "cluster", "$1", "pod", "(.+)-[0-9]+")) - 1)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.cluster }} runs without a streaming replica"
            description: "The primary sees {{ $value }} streaming replica(s) for 30m, so the cluster has a single working copy. A replica stuck on `pg_rewind: error: could not find common ancestor` or `read 0 of 8192` cannot heal itself: re-clone it (infrastructure/services/base/databases/README.md, When it breaks)."
    - name: cnpg-storage.rules
      rules:
        # The regex is CNPG's PVC naming (`<cluster>-<n>`) -- every CNPG Cluster
        # here is named `*-db`. Anything else gets no volume alerting.
        - alert: CNPGVolumeFillingUp
          expr: |
            kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".+-db-[0-9]+"}
              / kubelet_volume_stats_capacity_bytes > 0.80
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "CNPG volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
            description: "Growing steadily is normal; growing because WAL cannot be archived is not -- check the archiving alerts first. Resizing means bumping storage.size on the Cluster (Longhorn expands online)."
        - alert: CNPGVolumeAlmostFull
          expr: |
            kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".+-db-[0-9]+"}
              / kubelet_volume_stats_capacity_bytes > 0.90
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "CNPG volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
            description: "CNPG shuts the instance down on low disk, which takes the -rw Service's only endpoint with it and every client fails to connect. Bump storage.size now. See documentations/12-garage-object-storage.md."
