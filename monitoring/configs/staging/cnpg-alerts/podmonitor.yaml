apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
  namespace: monitoring
  labels:
    # Matches Prometheus podMonitorSelector.
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    # Named port on the postgres container; plain HTTP, no auth.
    - port: metrics
