apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-grafana-dashboard
  namespace: monitoring
  labels:
    # Picked up by the kube-prometheus-stack grafana dashboards sidecar.
    grafana_dashboard: "1"
data:
  garage-overview.json: |
    {
      "uid": "garage-overview",
      "title": "Garage object storage",
      "tags": [
        "garage",
        "storage",
        "backups"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(garage_local_disk_total, garage_node)",
              "refId": "node"
            },
            "definition": "label_values(garage_local_disk_total, garage_node)",
            "multi": true,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Cluster",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Nodes reachable",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{job=\"scrapeConfig/monitoring/garage\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {},
          "description": "Garage nodes whose /metrics Prometheus can read. Fewer than 3 with replication factor 2 means writes fail for part of every bucket."
        },
        {
          "type": "stat",
          "title": "Replication factor",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(garage_replication_factor)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "stat",
          "title": "Gateway: healthy nodes (S3)",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(haproxy_backend_active_servers{proxy=\"garage_s3\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {},
          "description": "Nodes garage-gateway's HTTP health check considers alive, so receives traffic."
        },
        {
          "type": "stat",
          "title": "Garage version",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by (version) (garage_build_info)",
              "legendFormat": "{{version}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "textMode": "name",
            "colorMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Total stored (data disks)",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(garage_local_disk_total{volume=\"data\"} - garage_local_disk_avail{volume=\"data\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {},
          "description": "Raw bytes used on the three data disks: every object counts once per replica."
        },
        {
          "type": "row",
          "title": "Per node",
          "id": 7,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "Data disk used",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - garage_local_disk_avail{volume=\"data\",garage_node=~\"$node\"} / garage_local_disk_total{volume=\"data\",garage_node=~\"$node\"})",
              "legendFormat": "node {{garage_node}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient"
          }
        },
        {
          "type": "bargauge",
          "title": "Metadata disk used",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - garage_local_disk_avail{volume=\"metadata\",garage_node=~\"$node\"} / garage_local_disk_total{volume=\"metadata\",garage_node=~\"$node\"})",
              "legendFormat": "node {{garage_node}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient"
          },
          "description": "LMDB metadata. A full metadata disk refuses every write (2026-10-15)."
        },
        {
          "type": "table",
          "title": "Free space",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "garage_local_disk_avail{garage_node=~\"$node\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "garage_local_disk_total{garage_node=~\"$node\"}",
              "legendFormat": "",
              "refId": "B",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {},
          "transformations": [
            {
              "id": "merge"
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "instance": true,
                  "job": true
                },
                "renameByName": {
                  "garage_node": "node",
                  "volume": "volume",
                  "Value #A": "free",
                  "Value #B": "size"
                }
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Disk used over time",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - garage_local_disk_avail{garage_node=~\"$node\"} / garage_local_disk_total{garage_node=~\"$node\"})",
              "legendFormat": "node {{garage_node}} {{volume}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Free space trend (24h forecast)",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "garage_local_disk_avail{garage_node=~\"$node\"}",
              "legendFormat": "node {{garage_node}} {{volume}} free",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "predict_linear(garage_local_disk_avail{garage_node=~\"$node\"}[6h], 24 * 3600)",
              "legendFormat": "node {{garage_node}} {{volume}} in 24h",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {},
          "description": "Free bytes now, and where the last 6 hours' trend puts them in 24 hours. Below zero = GarageDiskFullIn24h."
        },
        {
          "type": "state-timeline",
          "title": "Node reachable (Prometheus)",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "up{job=\"scrapeConfig/monitoring/garage\",garage_node=~\"$node\"}",
              "legendFormat": "node {{garage_node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "down",
                      "color": "red"
                    },
                    "1": {
                      "text": "up",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Node response time (/metrics)",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "scrape_duration_seconds{job=\"scrapeConfig/monitoring/garage\",garage_node=~\"$node\"}",
              "legendFormat": "node {{garage_node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {},
          "description": "A healthy node answers in well under a second; 10 s is the scrape timeout (node unreachable)."
        },
        {
          "type": "state-timeline",
          "title": "Gateway health check per node",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (proxy, server) (haproxy_server_status{proxy=~\"garage_.*\",state=\"UP\"})",
              "legendFormat": "{{proxy}} {{server}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "not UP",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {},
          "description": "garage-gateway's HTTP health check (haproxy.cfg). A node not UP receives no traffic from the cluster."
        },
        {
          "type": "row",
          "title": "Backups stored on Garage",
          "id": 16,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 33
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "WAL waiting to upload",
          "id": 17,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 34
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (namespace) (cnpg_collector_pg_wal_archive_status{value=\"ready\",namespace=~\"fbref|ai-gateway|nextcloud|seaweedfs|scraper|advisor|n8n|registry\"})",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 50
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {},
          "description": "WAL segments finished but not yet in Garage. Growing = archiving cannot keep up or fails; pg_wal grows on the database volume."
        },
        {
          "type": "timeseries",
          "title": "WAL archive failures (15m)",
          "id": 18,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 34
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace) (increase(cnpg_pg_stat_archiver_failed_count{namespace=~\"fbref|ai-gateway|nextcloud|seaweedfs|scraper|advisor|n8n|registry\"}[15m]))",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "bargauge",
          "title": "Hours since last base backup",
          "id": 19,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 34
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(time() - max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace=~\"fbref|ai-gateway|nextcloud|seaweedfs|scraper|advisor|n8n|registry\"})) / 3600",
              "legendFormat": "{{namespace}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 26
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient"
          },
          "description": "Daily base backups: above 26 h one was missed."
        },
        {
          "type": "row",
          "title": "Cluster capacity",
          "id": 20,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 42
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Cluster can still accept",
          "id": 21,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 43
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(garage_local_disk_avail{volume=\"data\"} / ((garage_local_disk_total{volume=\"data\"} - garage_local_disk_avail{volume=\"data\"}) / scalar((sum(garage_bucket_bytes) + sum(garage_bucket_unfinished_multipart_bytes)))))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 100000000000.0
                  },
                  {
                    "color": "green",
                    "value": 250000000000.0
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {},
          "description": "How much more data the cluster can store before its first node runs out of space. With replication, every file is written to several nodes, so once one node is full Garage refuses new writes for its share of every bucket, even if the other nodes still have room. Per node: free space divided by the raw bytes that node takes for each byte stored (measured from what is on the disks now, so it includes replication and overhead). The smallest value over the nodes. An estimate: it assumes new data spreads like the existing data."
        },
        {
          "type": "stat",
          "title": "Node that fills first",
          "id": 23,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 8,
            "y": 43
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
