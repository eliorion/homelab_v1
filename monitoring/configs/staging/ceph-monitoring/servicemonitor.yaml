apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ceph-mgr
  namespace: monitoring
  labels:
    # Matches Prometheus serviceMonitorSelector.
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - rook-ceph
  selector:
    matchLabels:
      app: rook-ceph-mgr
  endpoints:
    # Only the ACTIVE mgr serves metrics; the standby answers nothing. The
    # rook-ceph-mgr Service already selects mgr_role: active, so this follows a
    # failover on its own.
    - port: http-metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ceph-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - rook-ceph
  selector:
    matchLabels:
      app: rook-ceph-exporter
  endpoints:
    # Per-node daemon metrics (OSD latencies), separate from the mgr's
    # cluster-wide view. One exporter per node, so pod identity matters and the
    # default relabeling is left alone.
    - port: ceph-exporter-http-metrics
      path: /metrics
      interval: 30s
