apiVersion: v1
kind: ConfigMap
metadata:
  name: dagger-ci-grafana-dashboard
  namespace: monitoring
  labels:
    # Picked up by the kube-prometheus-stack grafana dashboards sidecar.
    grafana_dashboard: "1"
data:
  dagger-ci.json: |
    {
      "uid": "dagger-ci",
      "title": "Dagger CI",
      "tags": [
        "ci",
        "dagger"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "editable": true,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "trace_id",
            "label": "Trace ID",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Runs",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "table",
          "title": "Recent dagger runs",
          "description": "Root spans of every `dagger` CLI invocation. Click a trace ID to load its output below.",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{resource.service.name=\"dagger-cli\" && nestedSetParent < 0}",
              "limit": 100,
              "tableType": "traces"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "traceID"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Show run output",
                        "url": "/d/dagger-ci/dagger-ci?var-trace_id=${__value.raw}&${__url_time_range}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Runs by status",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 11
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "metricsQueryType": "range",
              "query": "{resource.service.name=\"dagger-cli\" && nestedSetParent < 0} | count_over_time() by (status)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Run duration (p50 / p90)",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 11
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "metricsQueryType": "range",
              "query": "{resource.service.name=\"dagger-cli\" && nestedSetParent < 0} | quantile_over_time(duration, .5, .9)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "row",
          "title": "Selected run",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "panels": []
        },
        {
          "id": 6,
          "type": "traces",
          "title": "Trace ${trace_id}",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "h": 14,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "${trace_id}"
            }
          ]
        },
        {
          "id": 7,
          "type": "logs",
          "title": "Step output",
          "description": "stdout/stderr of every step in the selected run, from Loki.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 16,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Ascending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{service_name=~\"dagger-.+\"} | trace_id=\"${trace_id}\"",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 8,
          "type": "row",
          "title": "Engines",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 50
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Connected clients",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 51
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (dagger_connected_clients)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Local cache size",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 51
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (dagger_local_cache_total_disk_size_bytes)",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Local cache entries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 51
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (dagger_local_cache_entries)",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
