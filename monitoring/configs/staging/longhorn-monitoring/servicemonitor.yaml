apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  namespace: monitoring
  labels:
    # Matches Prometheus serviceMonitorSelector.
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - longhorn-system
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    # The manager's `manager` port (9500) serves /metrics for the WHOLE
    # Longhorn control plane -- volumes, replicas, disks, nodes. Named rather
    # than numbered so a chart upgrade that renumbers the port cannot silently
    # break the scrape.
    - port: manager
      path: /metrics
      interval: 30s
      # longhorn-manager is a DaemonSet: all three pods answer, each reporting
      # the full cluster view plus its own node's disks. Dropping the pod/
      # instance identity would collapse three identical volume series into
      # one and make `count()` over volumes wrong, so the default relabeling
      # (which keeps pod + instance) is left alone.
