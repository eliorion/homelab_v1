apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-helm-grafana-dashboard
  namespace: monitoring
  labels:
    # Picked up by the kube-prometheus-stack grafana dashboards sidecar.
    grafana_dashboard: "1"
data:
  flux-helmreleases.json: |
    {
      "uid": "flux-helmreleases",
      "title": "Flux HelmReleases",
      "tags": [
        "flux",
        "helm",
        "gitops"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(gotk_reconcile_condition{kind=\"HelmRelease\"}, exported_namespace)",
              "qryType": 1,
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(gotk_reconcile_condition{kind=\"HelmRelease\"}, exported_namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "allValue": ".*"
          },
          {
            "name": "release",
            "label": "Release",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(gotk_reconcile_condition{kind=\"HelmRelease\", exported_namespace=~\"$namespace\"}, name)",
              "qryType": 1,
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(gotk_reconcile_condition{kind=\"HelmRelease\", exported_namespace=~\"$namespace\"}, name)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "allValue": ".*"
          },
          {
            "name": "search",
            "label": "Contains (regex)",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": [
              {
                "selected": true,
                "text": "",
                "value": ""
              }
            ]
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Right now",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "HelmReleases",
          "description": "HelmReleases within the current filters.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"True\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}))",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Ready",
          "description": "Ready=True: the last install or upgrade succeeded and tests/health checks passed.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"True\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}) == 1) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "NOT Ready",
          "description": "Ready=False: install, upgrade, rollback or remediation failed. Same condition the FluxHelmReleaseFailed alert uses, without its 5 minute delay.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"False\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}) == 1) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Reconciling",
          "description": "Ready=Unknown: helm-controller is running an install or upgrade. Stuck above zero for long means a hung upgrade (timeout) or a hook that never completes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"Unknown\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}) == 1) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Suspended",
          "description": "spec.suspend=true: Flux will not upgrade or alert on these.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (exported_namespace, name) (gotk_suspend_status{kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}) == 1) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "purple",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "helm-controller down",
          "description": "1 when Prometheus cannot scrape helm-controller. Every other panel is stale while it is.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up{namespace=\"flux-system\", pod=~\"helm-controller-.+\"} == 0) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Releases",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "table",
          "title": "All HelmReleases",
          "description": "One row per HelmRelease, worst first. Reconcile history is in the timeline below; the error text is in the logs at the bottom.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"False\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}) * 2 + max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"Unknown\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"})) + (max by (exported_namespace, name) (gotk_suspend_status{kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}) * 4 or (max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"False\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}) * 2 + max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"Unknown\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"})) * 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "exported_namespace": 0,
                  "name": 1,
                  "Value": 2
                },
                "renameByName": {
                  "exported_namespace": "Namespace",
                  "name": "Release",
                  "Value": "State"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "State",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "State"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "Ready",
                            "color": "green",
                            "index": 0
                          },
                          "1": {
                            "text": "Reconciling",
                            "color": "yellow",
                            "index": 1
                          },
                          "2": {
                            "text": "NOT READY",
                            "color": "red",
                            "index": 2
                          },
                          "4": {
                            "text": "Suspended",
                            "color": "purple",
                            "index": 3
                          },
                          "5": {
                            "text": "Suspended, reconciling",
                            "color": "purple",
                            "index": 4
                          },
                          "6": {
                            "text": "Suspended, NOT READY",
                            "color": "red",
                            "index": 5
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Chart versions",
          "description": "Attempted is the chart version Flux last tried; Deployed is what Helm actually has installed (the newest entry in the release history). They differ while an upgrade is failing or rolled back. Helm status is that history entry's status.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (exported_namespace, name, chart, attempted_version, deployed_version, app_version, release_status, release_revision, last_action, last_deployed, ready, source_name) (gotk_resource_info{customresource_kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "exported_namespace",
                    "name",
                    "chart",
                    "attempted_version",
                    "deployed_version",
                    "app_version",
                    "release_status",
                    "release_revision",
                    "last_action",
                    "last_deployed",
                    "ready",
                    "source_name"
                  ]
                }
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "last_deployed",
                    "destinationType": "time"
                  }
                ],
                "fields": {}
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "indexByName": {
                  "exported_namespace": 0,
                  "name": 1,
                  "chart": 2,
                  "attempted_version": 3,
                  "deployed_version": 4,
                  "app_version": 5,
                  "release_status": 6,
                  "release_revision": 7,
                  "last_action": 8,
                  "last_deployed": 9,
                  "ready": 10,
                  "source_name": 11
                },
                "renameByName": {
                  "exported_namespace": "Namespace",
                  "name": "Release",
                  "chart": "Chart",
                  "attempted_version": "Attempted",
                  "deployed_version": "Deployed",
                  "app_version": "App version",
                  "release_status": "Helm status",
                  "release_revision": "Helm revision",
                  "last_action": "Last action",
                  "last_deployed": "Last deployed",
                  "ready": "Ready",
                  "source_name": "Source"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Release",
                    "desc": false
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last deployed"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ready"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "True": {
                            "text": "True",
                            "color": "green",
                            "index": 0
                          },
                          "False": {
                            "text": "False",
                            "color": "red",
                            "index": 1
                          },
                          "Unknown": {
                            "text": "Unknown",
                            "color": "yellow",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 11,
          "type": "table",
          "title": "Why: Ready condition of failing releases",
          "description": "The message helm-controller wrote on each release that is not Ready (the Helm error text), and when it last changed state.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (exported_namespace, name, ready, last_transition, message) (gotk_resource_info{customresource_kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\", ready=~\"False|Unknown\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "exported_namespace",
                    "name",
                    "ready",
                    "last_transition",
                    "message"
                  ]
                }
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "last_transition",
                    "destinationType": "time"
                  }
                ],
                "fields": {}
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "indexByName": {
                  "exported_namespace": 0,
                  "name": 1,
                  "ready": 2,
                  "last_transition": 3,
                  "message": 4
                },
                "renameByName": {
                  "exported_namespace": "Namespace",
                  "name": "Release",
                  "ready": "Ready",
                  "last_transition": "Since",
                  "message": "Message"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Since",
                    "desc": false
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Since"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ready"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "True": {
                            "text": "True",
                            "color": "green",
                            "index": 0
                          },
                          "False": {
                            "text": "False",
                            "color": "red",
                            "index": 1
                          },
                          "Unknown": {
                            "text": "Unknown",
                            "color": "yellow",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Message"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 560
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto",
                      "wrapText": true
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 12,
          "type": "state-timeline",
          "title": "Ready state over time",
          "description": "Green Ready, yellow reconciling, red NOT READY, purple suspended. A release that flips red then green is retrying or remediating.",
          "datasource": {
            "type": "prometheus",
