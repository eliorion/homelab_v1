        {
          "id": 24,
          "type": "table",
          "title": "Sources not Ready",
          "description": "HelmRepository, HelmChart, OCIRepository, GitRepository and Bucket objects that are failing, reconciling or suspended. A HelmRelease cannot upgrade while its chart source is down. Includes flux-system.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 76,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "label_replace(max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"False\", kind=~\"HelmRepository|HelmChart|OCIRepository|GitRepository|Bucket\", exported_namespace=~\"$namespace|flux-system\"}) == 1, \"state\", \"NOT READY\", \"\", \"\")\n or \nlabel_replace(max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"Unknown\", kind=~\"HelmRepository|HelmChart|OCIRepository|GitRepository|Bucket\", exported_namespace=~\"$namespace|flux-system\"}) == 1, \"state\", \"reconciling\", \"\", \"\")\n or \nlabel_replace(max by (kind, exported_namespace, name) (gotk_suspend_status{kind=~\"HelmRepository|HelmChart|OCIRepository|GitRepository|Bucket\", exported_namespace=~\"$namespace|flux-system\"}) == 1, \"state\", \"suspended\", \"\", \"\")",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true
                },
                "indexByName": {
                  "state": 0,
                  "kind": 1,
                  "exported_namespace": 2,
                  "name": 3
                },
                "renameByName": {
                  "kind": "Kind",
                  "exported_namespace": "Namespace",
                  "name": "Name",
                  "state": "State"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "State",
                    "desc": false
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "State"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "NOT READY": {
                            "text": "NOT READY",
                            "color": "red",
                            "index": 0
                          },
                          "reconciling": {
                            "text": "reconciling",
                            "color": "yellow",
                            "index": 1
                          },
                          "suspended": {
                            "text": "suspended",
                            "color": "purple",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
