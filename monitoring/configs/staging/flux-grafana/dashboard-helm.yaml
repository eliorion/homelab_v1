                      "text": "Reconciling",
                      "color": "yellow",
                      "index": 1
                    },
                    "2": {
                      "text": "NOT READY",
                      "color": "red",
                      "index": 2
                    },
                    "4": {
                      "text": "Suspended",
                      "color": "purple",
                      "index": 3
                    },
                    "5": {
                      "text": "Suspended, reconciling",
                      "color": "purple",
                      "index": 4
                    },
                    "6": {
                      "text": "Suspended, NOT READY",
                      "color": "red",
                      "index": 5
