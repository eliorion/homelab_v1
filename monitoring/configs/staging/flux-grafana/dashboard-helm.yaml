              },
              "expr": "(max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"False\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}) * 2 + max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"Unknown\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"})) + (max by (exported_namespace, name) (gotk_suspend_status{kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}) * 4 or (max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"False\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"}) * 2 + max by (exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"Unknown\", kind=\"HelmRelease\", exported_namespace=~\"$namespace\", name=~\"$release\"})) * 0)",
