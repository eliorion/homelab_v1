apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-grafana-dashboard
  namespace: monitoring
  labels:
    # Picked up by the kube-prometheus-stack grafana dashboards sidecar.
    grafana_dashboard: "1"
data:
  flux-reconciliation.json: |
    {
      "uid": "flux-reconciliation",
      "title": "Flux reconciliation",
      "tags": [
        "flux",
        "gitops"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "kind",
            "label": "Kind",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(gotk_reconcile_condition, kind)",
              "qryType": 1,
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(gotk_reconcile_condition, kind)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "allValue": ".*"
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(gotk_reconcile_condition{kind=~\"$kind\"}, exported_namespace)",
              "qryType": 1,
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(gotk_reconcile_condition{kind=~\"$kind\"}, exported_namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "allValue": ".*"
          },
          {
            "name": "search",
            "label": "Contains (regex)",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": [
              {
                "selected": true,
                "text": "",
                "value": ""
              }
            ]
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Right now",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Ready",
          "description": "Flux objects whose Ready condition is True.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"True\", kind=~\"$kind\", exported_namespace=~\"$namespace\"}) == 1) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "NOT Ready",
          "description": "Ready=False: the last reconcile failed. Same condition as the FluxHelmReleaseFailed / FluxKustomizationFailed alerts, without their 5 minute delay.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"False\", kind=~\"$kind\", exported_namespace=~\"$namespace\"}) == 1) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Reconciling",
          "description": "Ready=Unknown: a reconcile is in progress. Stuck above zero for long means a hung Helm upgrade or a health check that never passes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"Unknown\", kind=~\"$kind\", exported_namespace=~\"$namespace\"}) == 1) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Suspended",
          "description": "Objects with spec.suspend=true. Flux ignores them, so they do not reconcile and do not alert.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (kind, exported_namespace, name) (gotk_suspend_status{kind=~\"$kind\", exported_namespace=~\"$namespace\"}) == 1) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "purple",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Controllers down",
          "description": "Flux controller pods Prometheus cannot scrape. While this is above zero every other panel on the board is stale.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up{namespace=\"flux-system\", pod=~\".+-controller-.+\"} == 0) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Objects tracked",
          "description": "Every Flux object exporting a Ready condition within the current filters.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"True\", kind=~\"$kind\", exported_namespace=~\"$namespace\"}))",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "What needs attention",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "table",
          "title": "Not Ready, reconciling or suspended",
          "description": "One row per object that is not plainly healthy. Empty means every filtered object is Ready and not suspended. The error text is in the panels at the bottom.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "label_replace(max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"False\", kind=~\"$kind\", exported_namespace=~\"$namespace\"}) == 1, \"state\", \"NOT READY\", \"\", \"\")\n or \nlabel_replace(max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"Unknown\", kind=~\"$kind\", exported_namespace=~\"$namespace\"}) == 1, \"state\", \"reconciling\", \"\", \"\")\n or \nlabel_replace(max by (kind, exported_namespace, name) (gotk_suspend_status{kind=~\"$kind\", exported_namespace=~\"$namespace\"}) == 1, \"state\", \"suspended\", \"\", \"\")",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true
                },
                "indexByName": {
                  "state": 0,
                  "kind": 1,
                  "exported_namespace": 2,
                  "name": 3
                },
                "renameByName": {
                  "kind": "Kind",
                  "exported_namespace": "Namespace",
                  "name": "Name",
                  "state": "State"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "State",
                    "desc": false
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "State"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "NOT READY": {
                            "text": "NOT READY",
                            "color": "red",
                            "index": 0
                          },
                          "reconciling": {
                            "text": "reconciling",
                            "color": "yellow",
                            "index": 1
                          },
                          "suspended": {
                            "text": "suspended",
                            "color": "purple",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Why: Ready condition of failing objects",
          "description": "The message Flux wrote on each object that is not Ready, and when it last changed state. From kube-state-metrics (gotk_resource_info), so it is empty if that scrape is down even when the table above is not.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (customresource_kind, exported_namespace, name, ready, last_transition, message) (gotk_resource_info{ready=~\"False|Unknown\", customresource_kind=~\"$kind\", exported_namespace=~\"$namespace\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "customresource_kind",
                    "exported_namespace",
                    "name",
                    "ready",
                    "last_transition",
                    "message"
                  ]
                }
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "last_transition",
                    "destinationType": "time"
                  }
                ],
                "fields": {}
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "indexByName": {
                  "customresource_kind": 0,
                  "exported_namespace": 1,
                  "name": 2,
                  "ready": 3,
                  "last_transition": 4,
                  "message": 5
                },
                "renameByName": {
                  "customresource_kind": "Kind",
                  "exported_namespace": "Namespace",
                  "name": "Name",
                  "ready": "Ready",
                  "last_transition": "Since",
                  "message": "Message"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Since",
                    "desc": false
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Since"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ready"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "True": {
                            "text": "True",
                            "color": "green",
                            "index": 0
                          },
                          "False": {
                            "text": "False",
                            "color": "red",
                            "index": 1
                          },
                          "Unknown": {
                            "text": "Unknown",
                            "color": "yellow",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Message"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 560
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto",
                      "wrapText": true
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 11,
          "type": "row",
          "title": "Reconciliation history",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "panels": []
        },
        {
          "id": 12,
          "type": "state-timeline",
          "title": "Ready state per object",
          "description": "Green Ready, yellow reconciling, red NOT READY, purple suspended. Read left to right to see when an object broke and whether it recovered.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"False\", kind=~\"$kind\", exported_namespace=~\"$namespace\"}) * 2 + max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"Unknown\", kind=~\"$kind\", exported_namespace=~\"$namespace\"})) + (max by (kind, exported_namespace, name) (gotk_suspend_status{kind=~\"$kind\", exported_namespace=~\"$namespace\"}) * 4 or (max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"False\", kind=~\"$kind\", exported_namespace=~\"$namespace\"}) * 2 + max by (kind, exported_namespace, name) (gotk_reconcile_condition{type=\"Ready\", status=\"Unknown\", kind=~\"$kind\", exported_namespace=~\"$namespace\"})) * 0)",
              "legendFormat": "{{kind}} {{exported_namespace}}/{{name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Ready",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "Reconciling",
                      "color": "yellow",
                      "index": 1
                    },
                    "2": {
                      "text": "NOT READY",
                      "color": "red",
                      "index": 2
                    },
                    "4": {
                      "text": "Suspended",
                      "color": "purple",
                      "index": 3
                    },
                    "5": {
                      "text": "Suspended, reconciling",
                      "color": "purple",
                      "index": 4
                    },
                    "6": {
                      "text": "Suspended, NOT READY",
                      "color": "red",
                      "index": 5
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.85,
            "alignValue": "left",
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        },
        {
          "id": 13,
          "type": "row",
          "title": "What is deployed",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "panels": []
        },
        {
          "id": 14,
          "type": "table",
          "title": "Revisions applied by Kustomizations and fetched by sources",
          "description": "Kustomization: Revision is what is applied, Attempted is the newest one Flux tried; they differ while a new commit is failing or still rolling out. Sources: Revision is the artifact currently stored. HelmReleases are on their own dashboard.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 37,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (customresource_kind, exported_namespace, name, ready, revision, attempted_revision, source_name, url, path, last_transition) (gotk_resource_info{customresource_kind=~\"$kind\", customresource_kind!=\"HelmRelease\", exported_namespace=~\"$namespace\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "customresource_kind",
                    "exported_namespace",
                    "name",
                    "ready",
                    "revision",
                    "attempted_revision",
                    "source_name",
                    "path",
                    "url",
                    "last_transition"
                  ]
                }
              }
            },
            {
