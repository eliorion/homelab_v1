apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.2.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  # retries defaults to 0, which latches the release Stalled after ONE failed
  # upgrade and leaves it unremediated. Keep it set (documentations/14).
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # The operator adds this annotation post-admission; without the ignore, Flux fights it forever.
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    defaultRules:
      disabled:
        # Replaced, not dropped: hpa-maxedout-rule.yaml re-adds it. The two move together.
        KubeHpaMaxedOut: true
    # Cilium replaces kube-proxy: there is nothing to scrape, and the job would only fire KubeProxyDown.
    kubeProxy:
      enabled: false
    # Talos runs etcd as a host service, not a pod: the staging overlay supplies the node IPs.
    kubeEtcd:
      enabled: false
    grafana:
      # From each overlay; that overlay's Flux Kustomization MUST carry `decryption`.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: tailscale
        # MUST stay empty: a host here never matches the Host the tailscale proxy sends, and every request 404s.
        hosts: []
        # No secretName: the tailscale proxy holds the MagicDNS certificate.
        tls:
          - hosts:
              - grafana
      # admin.existingSecret is only read on first init of an empty grafana.db. Rotation: see README.
      persistence:
        enabled: true
        type: pvc
        storageClassName: ssd
        accessModes: ["ReadWriteOnce"]
        size: 10Gi
      # RWO volume: RollingUpdate deadlocks on the volume the old pod still holds.
      deploymentStrategy:
        type: Recreate
      sidecar:
        datasources:
          exemplarTraceIdDestinations:
            datasourceUid: tempo
            traceIdLabelName: trace_id
      # uids are referenced across datasources and by the dagger-ci dashboard; do not rename them.
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          jsonData:
            derivedFields:
              - name: trace_id
                matcherType: label
                matcherRegex: trace_id
                datasourceUid: tempo
                # $$ escapes Grafana's provisioning env-var expansion.
                url: "$${__value.raw}"
                urlDisplayLabel: View trace
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              filterByTraceID: true
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              tags:
                - key: service.name
                  value: service_name
            tracesToMetrics:
              datasourceUid: prometheus
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
            lokiSearch:
              datasourceUid: loki
    prometheus:
      prometheusSpec:
        # Tempo's metrics-generator remote-writes span metrics and service graphs here.
        enableRemoteWriteReceiver: true
        # alloy-receiver forwards OTLP metrics here.
        enableOTLPReceiver: true
        enableFeatures:
          - exemplar-storage
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ssd
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 30Gi
    alertmanager:
      alertmanagerSpec:
        # Mount path below is derived from this name; it must match `bot_token_file`.
        secrets:
          - alertmanager-telegram
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["namespace", "alertname"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: telegram
          routes:
            # Drop the always-firing Watchdog heartbeat.
            - matchers:
                - alertname = "Watchdog"
              receiver: blackhole
        receivers:
          - name: blackhole
          - name: telegram
            telegram_configs:
              - api_url: https://api.telegram.org
                bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/token
                chat_id: -5295319950 # numeric, no quotes
                parse_mode: HTML
                send_resolved: true
                message: |-
                  {{ range .Alerts }}<b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }})
                  {{ .Annotations.summary }}
                  {{ .Annotations.description }}
                  {{ end }}
    kube-state-metrics:
      # Requests only, deliberately no memory limit: usage scales with cluster object count. See README.
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
    prometheus-node-exporter:
      # Do NOT harden further: hostPID + host mounts are required for node metrics.
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
