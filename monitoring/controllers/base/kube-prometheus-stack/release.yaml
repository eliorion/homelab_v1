apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.2.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  # retries defaults to 0, which latches the release Stalled after ONE failed
  # upgrade and leaves it unremediated. Keep it set (documentations/14).
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # The operator adds this annotation post-admission; without the ignore, Flux fights it forever.
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    defaultRules:
      disabled:
        # Replaced, not dropped: hpa-maxedout-rule.yaml re-adds it. The two move together.
        KubeHpaMaxedOut: true
    # Talos binds these to 127.0.0.1 and Cilium replaces kube-proxy: enabled, they only fire *Down. See README.
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    # Deliberate, documented blind spot. See README before enabling.
    kubeEtcd:
      enabled: false
    grafana:
      # From each overlay; that overlay's Flux Kustomization MUST carry `decryption`.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: tailscale
        # MUST stay empty: a host here never matches the Host the tailscale proxy sends, and every request 404s.
        hosts: []
        # No secretName: the tailscale proxy holds the MagicDNS certificate.
        tls:
          - hosts:
              - grafana
      # admin.existingSecret is only read on first init of an empty grafana.db. Rotation: see README.
      persistence:
        enabled: true
        type: pvc
        storageClassName: ssd
        accessModes: ["ReadWriteOnce"]
        size: 10Gi
      # RWO volume: RollingUpdate deadlocks on the volume the old pod still holds.
      deploymentStrategy:
        type: Recreate
    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ssd
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 30Gi
    alertmanager:
      alertmanagerSpec:
        # Mount path below is derived from this name; it must match `bot_token_file`.
        secrets:
          - alertmanager-telegram
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["namespace", "alertname"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: telegram
          routes:
            # Drop the always-firing Watchdog heartbeat.
            - matchers:
                - alertname = "Watchdog"
              receiver: blackhole
        receivers:
          - name: blackhole
          - name: telegram
            telegram_configs:
              - api_url: https://api.telegram.org
                bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/token
                chat_id: -5295319950 # numeric, no quotes
                parse_mode: HTML
                send_resolved: true
                message: |-
                  {{ range .Alerts }}<b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }})
                  {{ .Annotations.summary }}
                  {{ .Annotations.description }}
                  {{ end }}
    kube-state-metrics:
      # Requests only, deliberately no memory limit: usage scales with cluster object count. See README.
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
    prometheus-node-exporter:
      # Do NOT harden further: hostPID + host mounts are required for node metrics.
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
