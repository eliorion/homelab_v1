apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-monitoring
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  # TWO replicas, not the cluster default of three. This is the whole reason
  # the class exists.
  #
  # Longhorn schedules against PROVISIONED size, and
  # storageOverProvisioningPercentage is deliberately pinned at 100 after two
  # past outages, so a node can be unable to accept a replica while its
  # filesystem still looks half empty. Re-measured 2026-08-21, GB, after node-3
  # gave 250 GB of its install disk to a Ceph OSD (max - reserved - scheduled):
  #
  #   staging-controlplane-1  default-disk   497 -  74 - 253 = FREE 169
  #   staging-controlplane-1  hdd-sata-640   639 -  96 - 386 = FREE 157
  #   staging-controlplane-2  default-disk   997 - 149 - 693 = FREE 154
  #   staging-controlplane-3  default-disk   739 - 149 - 435 = FREE 154
  #
  # No disk can accept a 214 GB replica any more, which is why both fbref
  # volumes are stranded on node-2 with no second copy.
  #
  # Node 1 is the smallest disk in the cluster (463 GiB against 929 GiB on the
  # other two) yet carries an equal one-in-three replica share of every volume.
  # A 30Gi volume on the default 3-replica class therefore CANNOT place its
  # node-1 replica -- and Longhorn does not fail that loudly, it brings the
  # volume up DEGRADED, which until the ServiceMonitor lands nothing reports.
  #
  # At two replicas Longhorn simply skips the node with no room. The data this
  # class carries -- Prometheus TSDB, grafana.db -- is telemetry about the
  # cluster, reconstructible by definition and already bounded by a 10d
  # retention. Spending the scarcest resource in the cluster on a third copy of
  # it, at the cost of degrading it instead, is the wrong trade.
  #
  # Do NOT use this class for application or database data.
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: ext4
