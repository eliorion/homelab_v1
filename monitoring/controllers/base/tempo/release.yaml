apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 30m
  # The chart renders a ServiceMonitor; its CRD comes from this release.
  dependsOn:
    - name: kube-prometheus-stack
  chart:
    spec:
      chart: tempo
      version: "3.0.0"
      sourceRef:
        kind: HelmRepository
        name: tempo
        namespace: monitoring
      interval: 12h
  install:
    remediation:
      retries: 3
  # retries defaults to 0, which latches the release Stalled after ONE failed
  # upgrade and leaves it unremediated. Keep it set (documentations/14).
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    tempo:
      retention: 168h
      extraEnv:
        - name: GOMEMLIMIT
          value: 1800MiB
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      metricsGenerator:
        enabled: true
        storage:
          path: /var/tempo/generator
          remote_write:
            - url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
              send_exemplars: true
        processor:
          span_metrics:
            # Dagger span names embed commands and arguments: unbounded span_name cardinality. See README.
            filter_policies:
              - exclude:
                  match_type: regex
                  attributes:
                    - key: resource.service.name
                      value: "dagger-.*"
      overrides:
        defaults:
          global:
            # One Dagger CI run is a single trace of thousands of spans; the 5MB default drops them.
            max_bytes_per_trace: 52428800
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
    persistence:
      enabled: true
      storageClassName: ssd
      size: 30Gi
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
