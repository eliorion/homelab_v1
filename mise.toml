[tools]
kubectl = "latest"
k9s = "latest"
kubens = "latest"
cloudflared = "latest"
flux2  = "latest"
sops = "latest"
age = "latest"
helm = "latest"
shellcheck = "latest"
talosctl = "latest"
aws = { version = "latest", symlink_bins = "true" }
gh = "latest"
"github:nklmilojevic/sofka" = "latest"
popeye = "latest"
trivy = "latest"
"github:openbao/openbao" = "latest"

[tasks.sops-updatekeys]
description = "Rewrap *.enc.yaml secrets to recipients in .sops.yaml (pass -- -k FILE [--check])"
run = "scripts/sops-updatekeys"

[tasks.lint]
description = "shellcheck all scripts"
run = "shellcheck scripts/bao scripts/sops-updatekeys scripts/fetch-keycloak-operator scripts/etcd-restore-drill scripts/setup bootstraping/render.sh"

[tasks.etcd-drill]
description = "Read-only etcd restore drill (doc 09): fetch newest Garage snapshot, decrypt with the offline age key, restore + verify. Pass -- --offline-key PATH [--keep]"
run = "scripts/etcd-restore-drill"

[tasks.bao]
description = "bao against the cluster's OpenBao: port-forward, CA and admin login done for you. Usage: mise bao kv get kv/mlops/dagster-db"
run = "scripts/bao"
# Never echo the command line: it carries the secret values being written.
quiet = true

[tasks.mlflow-user]
description = "Create an MLflow user from its OpenBao password, as the MLflow admin. Usage: mise mlflow-user pipelines kv/fbref/mlflow-pipelines"
run = "scripts/mlflow-user"
quiet = true
