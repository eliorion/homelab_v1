apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: infra-cnpg-plugin
    - name: infra-reflector
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging/databases
  prune: true
  # NOT wait: true. That health-checks everything applied here, ExternalSecrets included, so a sealed OpenBao stopped
  # every app rollout for 24 h on 2026-11-04. The gate is for the schema, so it names the CNPG Clusters. A new Cluster
  # under apps/staging/databases must be added to this list to gate.
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: advisor-db
      namespace: advisor
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: asp-db
      namespace: asp
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: fbref-db
      namespace: fbref
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: scout-customer
      namespace: fbref
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: n8n-db
      namespace: n8n
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: nextcloud-db
      namespace: nextcloud
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: quackback-db
      namespace: quackback
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: scraper-db
      namespace: scraper
  # Healthy once the primary serves, or when deliberately hibernated; a missing replica alerts instead of gating apps. See apps/README.md.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: >-
        (has(metadata.annotations) && 'cnpg.io/hibernation' in metadata.annotations && metadata.annotations['cnpg.io/hibernation'] == 'on') ||
        (has(status.currentPrimary) && has(status.instancesStatus.healthy) && status.currentPrimary in status.instancesStatus.healthy)
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Runs the Flyway Job and gates the `apps` Kustomization on its success.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: db-migrations
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: databases
  retryInterval: 1m
  timeout: 5m # > backoffLimit(3) x migration runtime
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging/databases/db-migrations
  prune: true
  force: true # Job is immutable — image-tag bump must delete+recreate
  wait: true # Ready only when the Job COMPLETES; failed Job = NotReady gates `apps`
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: db-migrations
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging
  prune: true

  decryption:
    provider: sops
    secretRef:
      name: sops-age
