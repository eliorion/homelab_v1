# Vendored Keycloak operator manifests (CRDs + RBAC + Deployment) + the `identity` namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-keycloak-operator
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/keycloak-operator
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: keycloak-operator
      namespace: identity
---
# The realm, applied by a keycloak-config-cli Job.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-keycloak-realm
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  # Must stay above the Job's KEYCLOAK_AVAILABILITYCHECK_TIMEOUT (300s) in
  # infrastructure/services/base/keycloak/realm/job.yaml.
  timeout: 10m
  dependsOn:
    - name: infrastructure-services
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/services/staging/keycloak/realm
  prune: true
  force: true # Job is immutable — a realm edit must delete+recreate
  wait: true
  # REQUIRED: that path carries a sops Secret (cloudflare-access-client.enc.yaml).
  # Remove this and Flux applies the ENC[AES256_GCM,...] ciphertext verbatim with
  # no error at apply time. See clusters/README.md.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
