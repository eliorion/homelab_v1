apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-certmanager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/cert-manager
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-webhook
      namespace: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cnpg-plugin
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: infra-certmanager
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/cnpg/plugin
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: plugin-barman-cloud
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-arc-controller
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/arc
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: arc-controller-gha-rs-controller
      namespace: arc-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: infra-cnpg-plugin
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-services
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    # CNPG operator (keycloak DB) comes from infrastructure-controllers;
    # arc-runner-set needs the ARC CRDs.
    - name: infrastructure-controllers
    - name: infra-arc-controller
    # The Keycloak CR needs its CRD registered and the `identity` namespace to
    # exist — both ship with the operator.
    - name: infra-keycloak-operator
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/services/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-longhorn
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  # First install pulls all Longhorn images on a cold node.
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/longhorn
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: longhorn
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cilium
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  # First install pulls cilium agent/operator/hubble images on a cold node.
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/cilium
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cilium
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cilium-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  # Needs the CiliumLoadBalancerIPPool / Gateway CRDs the chart installs.
  dependsOn:
    - name: infra-cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/cilium/config
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-reflector
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Staging overlay = the operator (../base/reflector) + the ONE central
  # ghcr-pull-secret it mirrors into asp/fbref/lab. Needs sops decryption.
  path: ./infrastructure/controllers/staging/reflector
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: reflector
      namespace: reflector
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-keda
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  # First install pulls the KEDA operator/metrics-apiserver images.
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/keda
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: keda-operator
      namespace: keda
---
# The Keycloak operator: vendored release manifests (CRDs + RBAC + Deployment)
# and the `identity` namespace it runs in. Separate from infrastructure-services
# so the CRDs are registered and the operator is Ready BEFORE the Keycloak CR is
# applied — a CR against an unregistered CRD is a reconcile error, not a wait.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-keycloak-operator
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/keycloak-operator
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: keycloak-operator
      namespace: identity
---
# The realm, applied by a keycloak-config-cli Job.
#
# force: true because a Job is immutable — a realm edit changes the generated
# ConfigMap's hash, which changes the Job spec, and only a delete+recreate can
# apply that. Same recipe as the db-migrations Flyway Job.
# wait: true so a failed import surfaces as NotReady rather than as a realm that
# quietly does not match git.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-keycloak-realm
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  # > the Job's own availability wait for Keycloak to come up (300s).
  timeout: 10m
  dependsOn:
    # Keycloak itself, plus the operator-generated keycloak-initial-admin Secret
    # the Job authenticates with.
    - name: infrastructure-services
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/services/staging/keycloak/realm
  prune: true
  force: true
  wait: true
  # REQUIRED since that path gained its first sops Secret
  # (cloudflare-access-client.enc.yaml). Without it Flux applies the manifest
  # verbatim, so the Secret's values are the literal `ENC[AES256_GCM,...]`
  # ciphertext — and nothing fails at apply time. The Job then substitutes that
  # string into the realm's redirect URI and Keycloak rejects the client with
  #   400 {"error":"invalid_input","error_description":"A redirect URI is not a valid URI"}
  # which reads as a bad realm file rather than as a missing decryption block.
  # Every other Kustomization carrying an .enc.yaml has this; this one had no
  # secret to decrypt until now.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
