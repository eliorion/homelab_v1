apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-seaweedfs
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  dependsOn:
    # The CSI driver's StorageClass consumers and the masters both need the
    # `ssd` class LINSTOR provides.
    - name: infra-linstor
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/seaweedfs
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: seaweedfs-csi-driver
      namespace: flux-system
