# The asp-deploy-key Secret is NOT in git — the flux-system Kustomization has no
# sops decryption, so it is created out-of-band. Recipe in clusters/README.md.

# Source for the asp app Helm chart (k8s/charts/asp in the asp repo).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: asp
  namespace: flux-system
spec:
  interval: 1m0s
  url: ssh://git@github.com/eliorion/asp
  ref:
    branch: main
  secretRef:
    name: asp-deploy-key
  # Keep scoped to the chart path: the HelmRelease uses reconcileStrategy: Revision,
  # so widening this makes unrelated asp commits trigger Helm upgrades.
  ignore: |
    /*
    !/k8s/charts/asp/
---
# Source for the fbref app Helm chart (k8s/charts/fbref in the asp repo).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fbref
  namespace: flux-system
spec:
  interval: 1m0s
  url: ssh://git@github.com/Eliorion/asp
  ref:
    branch: main
  secretRef:
    name: asp-deploy-key
  # Keep scoped to the chart path: reconcileStrategy: Revision re-reconciles on
  # every new artifact revision.
  ignore: |
    /*
    !/k8s/
    /k8s/*
    !/k8s/charts/
    /k8s/charts/*
    !/k8s/charts/fbref/
---
