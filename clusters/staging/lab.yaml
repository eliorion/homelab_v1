# Central analysis-sandbox tier — the `lab` namespace + one lab HelmRelease per
# project (lab-asp, lab-fbref), each reading its project's read-only DB replica.
# Depends on the DB tiers (the CNPG `<db>-app` secrets to mirror + the permit
# annotation from cluster-reflector-patch.yaml) and on reflector being installed
# (to fill the `reflects` stubs). Off by default (replicas: 0) — scale a lab up
# from the project's release-*.yaml header commands when you want to work.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    # `databases` brings up BOTH CNPG clusters (apps/staging/databases lists
    # asp/ + fbref/) with their -app secrets + the reflector permit annotation.
    - name: databases
    - name: infra-reflector # the reflector controller fills the lab-ns stubs
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging/lab
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: lab-asp
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: lab-fbref
      namespace: flux-system
