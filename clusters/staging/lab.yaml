# Central analysis-sandbox tier — the `lab` namespace + the single lab HelmRelease.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: databases
    - name: infra-reflector
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging/lab
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: lab
      namespace: flux-system
