apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  interval: 1m0s
  # dependsOn:
  #   - name: infra-configs
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/controllers/staging
  prune: true

  # REQUIRED since this path gained its first sops Secret
  # (kube-prometheus-stack/grafana-admin.enc.yaml). Without it Flux applies the
  # manifest verbatim, so the Secret's values are the literal
  # ENC[AES256_GCM,...] ciphertext and NOTHING fails at apply time -- Grafana
  # simply refuses the admin login with no error anywhere in the chain.
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
spec:
  interval: 1m0s
  # dependsOn:
  #   - name: infra-configs
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/configs/staging
  prune: true

  decryption:
    provider: sops
    secretRef:
      name: sops-age
