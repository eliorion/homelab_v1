# The dev platform: one long-lived vcluster (infrastructure/services/dev/dev-platform/README.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # vcluster, then KEDA + CNPG inside it, then dev-platform-virtual; all health-checked.
  timeout: 20m
  dependsOn:
    - name: infrastructure-controllers
    - name: infra-kyverno
    - name: infra-cilium-config
    - name: infra-keda
    - name: infra-reflector
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/services/dev/dev-platform
  prune: true
  wait: true
  # No sops file here yet. Keep this block: without it a future *.enc.yaml is applied as ciphertext, silently.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
