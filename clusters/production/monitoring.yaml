apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  interval: 1m0s
  # dependsOn:
  #   - name: infra-configs
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/controllers/production
  prune: true

  # REQUIRED since this path gained its first sops Secret
  # (kube-prometheus-stack/grafana-admin.enc.yaml). See the same note in
  # clusters/staging/monitoring.yaml: without this, the ciphertext is applied
  # verbatim and nothing errors.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
