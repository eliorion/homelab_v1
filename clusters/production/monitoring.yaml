apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/controllers/production
  prune: true

  # REQUIRED: this path holds kube-prometheus-stack/grafana-admin.enc.yaml.
  # Without this block the ENC[...] ciphertext is applied verbatim and nothing errors.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
