apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: flux-system
spec:
  targetNamespace: arc-systems
  # Pin the release name so the controller Deployment is predictably named
  # arc-controller-gha-rs-controller (matches the Flux healthCheck).
  releaseName: arc-controller
  interval: 30m
  chart:
    spec:
      # Must stay in lockstep with the gha-runner-scale-set chart version
      # in infrastructure/services/staging/arc-runner-set/release.yaml.
      # Renovate keeps this pinned version current.
      chart: gha-runner-scale-set-controller
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  values:
    # Chart ships securityContext: {} -> manager container allowed privilege
    # escalation (Radar audit privilegeEscalation danger). Drop it + caps.
    # Kept minimal (no runAsNonRoot/readOnlyRootFilesystem) to avoid changing
    # the controller's runtime assumptions.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        memory: 512Mi
