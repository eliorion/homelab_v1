apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: flux-system
spec:
  targetNamespace: arc-systems
  # Fixes the Deployment name arc-controller-gha-rs-controller, which the
  # infra-arc-controller Flux healthCheck waits on. Do not rename.
  releaseName: arc-controller
  interval: 30m
  chart:
    spec:
      # Must stay in lockstep with the gha-runner-scale-set chart version in
      # infrastructure/services/staging/arc-runner-set/release.yaml + release-xl.yaml.
      chart: gha-runner-scale-set-controller
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  values:
    # Chart default is securityContext: {} — do not drop this block.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        memory: 512Mi
