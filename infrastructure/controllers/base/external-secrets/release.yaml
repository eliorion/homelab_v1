apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  targetNamespace: external-secrets
  releaseName: external-secrets
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "2.12.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    installCRDs: true
    # Namespaced SecretStores only: no store, generator or push that can cross namespaces. See README.
    crds:
      createClusterSecretStore: false
      createClusterExternalSecret: false
      createClusterGenerator: false
      createClusterPushSecret: false
    processClusterStore: false
    processClusterExternalSecret: false
    processClusterGenerator: false
    processClusterPushSecret: false
    processPushSecret: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
