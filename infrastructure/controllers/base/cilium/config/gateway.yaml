# L7 ingress; the Gateway takes its own LoadBalancer IP from ./pool.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gw
  namespace: kube-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
# nexus UI/API only; the docker connector ports 5000-5002 stay L4 on the nexus-lb Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus
  namespace: nexus
spec:
  parentRefs:
    - name: cilium-gw
      namespace: kube-system
  hostnames:
    - nexus.staging.lan # placeholder -- set the real hostname and point LAN DNS at the Gateway IP
  rules:
    - backendRefs:
        - name: nexus-lb
          port: 8081
