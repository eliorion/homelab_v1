apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  targetNamespace: kube-system
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.19.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false # kube-system already exists
  values:
    ipam:
      mode: kubernetes # reuse the per-node podCIDR Talos allocates (10.244.0.0/16)
    # 7445 must match machine.features.kubePrism.port in bootstraping/talconfig.yaml.
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445
    # Talos requires these capabilities explicitly (Sidero docs).
    securityContext:
      capabilities:
        ciliumAgent:
          [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    # Talos manages cgroup mounts itself.
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # DO NOT enable: breaks CoreDNS while machine.features.hostDNS.forwardKubeDNSToHost is true.
    bpf:
      masquerade: false
    routingMode: tunnel
    tunnelProtocol: vxlan
    # Needs the gateway-api v1.4.1 CRDs from extraManifests in bootstraping/talconfig.yaml.
    gatewayAPI:
      enabled: true
    # Bare-metal LoadBalancer; the IP pool and L2 policy are CRs in ./config.
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
    hubble:
      enabled: true
      tls:
        auto:
          enabled: true
          # Not the helm default; the default rotates the Hubble certs on every Flux reconcile.
          method: cronJob
      relay:
        enabled: true
      ui:
        enabled: true
    operator:
      replicas: 2
      rollOutPods: true
    rollOutCiliumPods: true
    # apiserver headroom for the l2announcements leases.
    k8sClientRateLimit:
      qps: 25
      burst: 50
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
