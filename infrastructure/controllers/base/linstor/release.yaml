apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piraeus-operator
  namespace: flux-system
spec:
  targetNamespace: piraeus-datastore
  interval: 30m
  chart:
    spec:
      chart: piraeus
      version: "2.11.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus
        namespace: flux-system
      interval: 12h
  install:
    # Helm must NOT create it: namespace.yaml carries the privileged PSA labels.
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Chart default is false; without it the four piraeus.io CRDs never land.
    installCRDs: true
