# kubernetes-reflector — mirrors annotated Secrets/ConfigMaps across namespaces.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: flux-system
spec:
  targetNamespace: reflector
  interval: 30m
  chart:
    spec:
      chart: reflector
      version: "10.0.49"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  values:
    # Whole-value override — trimming a field drops the chart's own hardening.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
