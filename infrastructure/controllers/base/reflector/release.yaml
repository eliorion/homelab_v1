# kubernetes-reflector — mirrors annotated Secrets/ConfigMaps across namespaces.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: flux-system
spec:
  targetNamespace: reflector
  interval: 30m
  chart:
    spec:
      chart: reflector
      version: "10.0.49"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  # retries defaults to 0, which latches the release Stalled after ONE failed
  # upgrade and leaves it unremediated. Keep it set (documentations/14).
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Whole-value override — trimming a field drops the chart's own hardening.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
