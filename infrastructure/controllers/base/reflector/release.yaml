# kubernetes-reflector — mirrors annotated Secrets/ConfigMaps across namespaces.
# Used to copy each project's CNPG `<db>-app` connection Secret into the central
# `lab` namespace so the per-project lab pods can authenticate to their DB
# (the lab lives in its own ns, the DB + its generated Secret live in the
# project ns). See apps/staging/lab/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: flux-system
spec:
  targetNamespace: reflector
  interval: 30m
  chart:
    spec:
      chart: reflector
      # Renovate keeps this pinned version current after the first install.
      version: "10.0.49"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  # NOT the default. `retries` defaults to 0, and 0 does not mean "retry on the
  # next reconcile" -- it means helm-controller marks this release Stalled after
  # ONE failed upgrade and never attempts it again, while the Kustomization above
  # it stays Ready. It also leaves the failed upgrade UNREMEDIATED, so a chart
  # that half-applied stays half-applied. Nexus sat Ready=False for 16 days on
  # exactly this. See documentations/14-design-decisions.md, "Every HelmRelease
  # sets upgrade.remediation.retries".
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Chart already drops ALL caps + runs non-root; only allowPrivilegeEscalation
    # was unset (Radar audit privilegeEscalation danger). Full block so the
    # override doesn't drop the chart's existing hardening.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
