# kubernetes-reflector — mirrors annotated Secrets/ConfigMaps across namespaces.
# Used to copy each project's CNPG `<db>-app` connection Secret into the central
# `lab` namespace so the per-project lab pods can authenticate to their DB
# (the lab lives in its own ns, the DB + its generated Secret live in the
# project ns). See apps/staging/lab/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: flux-system
spec:
  targetNamespace: reflector
  interval: 30m
  chart:
    spec:
      chart: reflector
      # Renovate keeps this pinned version current after the first install.
      version: "10.0.49"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
