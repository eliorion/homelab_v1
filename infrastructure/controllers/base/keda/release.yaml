apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  targetNamespace: keda
  interval: 30m
  chart:
    spec:
      chart: keda
      version: "2.17.2"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
    # Helm owns the chart's crds/ dir; upgrade.crds must stay CreateReplace or CRDs go stale.
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    resources:
      operator:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
