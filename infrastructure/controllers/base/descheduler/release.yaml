apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: flux-system
spec:
  targetNamespace: descheduler
  interval: 30m
  chart:
    spec:
      chart: descheduler
      # Must track the Kubernetes minor (0.36 for 1.36). See README.
      version: "0.36.0"
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    kind: CronJob
    schedule: "*/20 * * * *"
    cmdOptions:
      v: 3
      # First rollout only logs what it would evict. See README before removing.
      dry-run: true
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: null
        memory: 256Mi
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    deschedulerPolicy:
      profiles:
        - name: rebalance
          pluginConfig:
            - name: DefaultEvictor
              args:
                # Only evict when the pod fits on another node.
                nodeFit: true
                minPodAge: 30m
                podProtections:
                  # emptyDir pods are evictable; anything with a PVC never is.
                  defaultDisabled:
                    - PodsWithLocalStorage
                  extraEnabled:
                    - PodsWithPVC
            - name: LowNodeUtilization
              args:
                # Requested resources, not live usage. Under = below ALL, over = above ANY.
                thresholds:
                  cpu: 50
                  memory: 50
                targetThresholds:
                  cpu: 80
                  memory: 80
                evictableNamespaces:
                  exclude:
                    - kube-system
                    - flux-system
                    - piraeus-datastore
                    - seaweedfs
                    - cnpg-system
                    - cert-manager
                    - tailscale
                    - arc-systems
                    - arc-runners
                    - dagger
                    - nexus
                    - registry
                    - dev-platform
                    - renovate
                    - identity
                    - cloudflare
                    - azuracast
                    - fbref
                    - asp
                    - advisor
                    - descheduler
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
