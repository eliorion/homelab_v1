apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  targetNamespace: longhorn-system
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.12.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 12h
  install:
    # Helm must NOT create it: namespace.yaml carries the privileged PSA labels.
    createNamespace: false
  values:
    defaultSettings:
      # Must match the Talos kubelet extraMounts bind destination.
      defaultDataPath: /var/lib/longhorn
      defaultReplicaCount: 3
      # Do NOT raise storageOverProvisioningPercentage instead; 100% stays.
      # Applies only to disks Longhorn adds AFTER this lands — existing node
      # disks keep their storageReserved and must be patched on the Node CRs
      # (documentations/07-talos-ha-expansion.md, "Growing a volume").
      storageReservedPercentageForDefaultDisk: 15
    persistence:
      defaultClassReplicaCount: 3
    service:
      ui:
        # UI on the tailnet: L3 expose, http://longhorn.<tailnet>.ts.net (:80, not 443).
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: longhorn
