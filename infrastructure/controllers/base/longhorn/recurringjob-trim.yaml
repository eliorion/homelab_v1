# Auto-trim; the `default` group covers every volume without recurring-job labels.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: trim
  namespace: longhorn-system
spec:
  cron: "0 4 * * *" # must stay after the 03:00 CNPG backups
  task: filesystem-trim
  groups:
    - default
  concurrency: 2
  retain: 0 # trim takes no snapshot
