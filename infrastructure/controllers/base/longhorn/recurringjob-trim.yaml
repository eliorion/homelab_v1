# Auto-trim: reclaim blocks freed inside the filesystem (WAL recycling, bloat,
# deleted files) that Longhorn otherwise keeps counted in actualSize. Assigned to
# the `default` group, which Longhorn applies to every volume that has no explicit
# recurring-job labels -- i.e. all of them here.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: trim
  namespace: longhorn-system
spec:
  cron: "0 4 * * *" # daily 04:00, after the 03:00 CNPG backups
  task: filesystem-trim
  groups:
    - default
  concurrency: 2
  retain: 0 # trim takes no snapshot
