apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Vendored release manifests. Bump ONLY with `scripts/fetch-keycloak-operator
# <version>`, which also rewrites the version line below. See README.md.
# renovate: datasource=github-releases depName=keycloak/keycloak-k8s-resources
# keycloakOperatorVersion: 26.7.0

# Upstream publishes these as `.yml`; the fetch script normalises the extension
# and writes them as `.yaml`. This list must name the files it writes.
resources:
  - namespace.yaml
  - upstream/keycloakoidcclients.k8s.keycloak.org-v1.yaml
  - upstream/keycloakrealmimports.k8s.keycloak.org-v1.yaml
  - upstream/keycloaks.k8s.keycloak.org-v1.yaml
  - upstream/keycloaksamlclients.k8s.keycloak.org-v1.yaml
  - upstream/kubernetes.yaml

# Retargets upstream's `keycloak` namespace to `identity`.
# setRoleBindingSubjects is load-bearing: without it the ClusterRoleBinding keeps
# pointing at system:serviceaccount:keycloak:keycloak-operator and the operator
# runs with no permissions while looking healthy.
namespace: identity
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: keycloak-operator-namespace
      namespace: identity
    setRoleBindingSubjects: allServiceAccounts
    fieldSpecs:
      - path: metadata/namespace
        create: true
