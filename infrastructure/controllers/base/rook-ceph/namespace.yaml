apiVersion: v1
kind: Namespace
metadata:
  name: rook-ceph
  labels:
    # OSDs open raw block devices and the CSI plugin bind-mounts host paths;
    # both are forbidden at the cluster default (baseline).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
