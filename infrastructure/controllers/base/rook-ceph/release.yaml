apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
  namespace: flux-system
spec:
  targetNamespace: rook-ceph
  interval: 30m
  chart:
    spec:
      chart: rook-ceph
      # Must match rook-ceph-cluster in infrastructure/controllers/staging/rook-ceph-cluster.
      version: "v1.20.4"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      interval: 12h
  install:
    # Helm must NOT create it: namespace.yaml carries the privileged PSA labels.
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    crds:
      # Only meaningful on first install. Turning this off later and deleting the
      # CRDs destroys the cluster.
      enabled: true
    enableDiscoveryDaemon: false
