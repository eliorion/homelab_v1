apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
  namespace: flux-system
spec:
  targetNamespace: rook-ceph
  interval: 30m
  dependsOn:
    - name: rook-ceph-operator
      namespace: flux-system
  chart:
    spec:
      chart: ceph-csi-drivers
      version: "1.0.4"
      sourceRef:
        kind: HelmRepository
        name: ceph-csi
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Rook already creates these two from the CephCluster; creating them here
    # would fight it.
    cephConnections:
      - name: ""
    clientProfiles:
      - name: ""
    operatorConfig:
      create: false
    drivers:
      rbd:
        # Must equal the StorageClass provisioner in
        # staging/rook-ceph-cluster. It also derives the ServiceAccount names.
        name: "rook-ceph.rbd.csi.ceph.com"
        enabled: true
      nvmeof:
        enabled: false
      cephfs:
        enabled: false
      nfs:
        enabled: false
