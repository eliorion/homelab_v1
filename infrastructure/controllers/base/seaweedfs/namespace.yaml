apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
  labels:
    # The CSI node plugin and its mount service run privileged with SYS_ADMIN
    # and Bidirectional mount propagation, which Kubernetes permits only to
    # privileged containers. Neither chart templates a Namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
