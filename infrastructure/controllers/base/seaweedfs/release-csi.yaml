apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-csi-driver
  namespace: flux-system
spec:
  targetNamespace: seaweedfs
  interval: 30m
  chart:
    spec:
      chart: seaweedfs-csi-driver
      version: "0.2.35"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-csi
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
  upgrade:
    # Required: both DaemonSets are OnDelete, so a waiting upgrade times out and rolls back.
    disableWait: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # The -client Service, with the doubled seaweedfs-seaweedfs- prefix. See README.
    seaweedfsFiler: "seaweedfs-seaweedfs-filer-client.seaweedfs.svc.cluster.local:8888"
    # Empty: the `hdd` class ships from the overlay. A name here makes the chart create one.
    storageClassName: ""
    node:
      # RollingUpdate would break every pod using a SeaweedFS PVC on the node.
      updateStrategy:
        type: OnDelete
    # OnDelete in the chart too: a new limit applies only once the pod is deleted by hand.
    mountService:
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 2Gi
