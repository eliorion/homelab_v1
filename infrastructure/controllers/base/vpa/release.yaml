apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: flux-system
spec:
  targetNamespace: vpa
  releaseName: vpa
  interval: 30m
  chart:
    spec:
      chart: vpa
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    fullnameOverride: vpa
    # RECOMMENDER ONLY. Without the updater and the admission controller nothing can
    # evict a pod or rewrite its requests: VPA recommends, Git controls, Flux applies.
    updater:
      enabled: false
    admissionController:
      enabled: false
    # metrics-server already runs in kube-system.
    metrics-server:
      enabled: false
    recommender:
      enabled: true
      replicaCount: 1
      image:
        pullPolicy: IfNotPresent
      extraArgs:
        v: "2"
        pod-recommendation-min-cpu-millicores: 15
        pod-recommendation-min-memory-mb: 100
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
