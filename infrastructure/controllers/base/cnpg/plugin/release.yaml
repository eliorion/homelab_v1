apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  targetNamespace: cnpg-system
  interval: 30m
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.6.0"
      sourceRef:
        kind: HelmRepository
        name: cnpg-plugin
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  # retries defaults to 0, which latches the release Stalled after ONE failed
  # upgrade and leaves it unremediated. Keep it set (documentations/14).
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
