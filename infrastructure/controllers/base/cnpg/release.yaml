apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  targetNamespace: cnpg-system
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.28.2"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
      interval: 12h
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # Enable prometheus monitoring
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
        namespace: monitoring
  install:
    createNamespace: true
  # NOT the default. `retries` defaults to 0, and 0 does not mean "retry on the
  # next reconcile" -- it means helm-controller marks this release Stalled after
  # ONE failed upgrade and never attempts it again, while the Kustomization above
  # it stays Ready. It also leaves the failed upgrade UNREMEDIATED, so a chart
  # that half-applied stays half-applied. Nexus sat Ready=False for 16 days on
  # exactly this. See documentations/14-design-decisions.md, "Every HelmRelease
  # sets upgrade.remediation.retries".
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
