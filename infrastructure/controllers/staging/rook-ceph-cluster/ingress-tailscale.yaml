# The Ceph dashboard on the tailnet over HTTPS and NOWHERE ELSE:
# https://ceph.tail45b0ca.ts.net
#
# The Service must carry NO tailscale annotations: both mechanisms at once
# register two devices contending for one hostname, and the loser is silently
# suffixed (`ceph-1`).
#
# PRECONDITION: HTTPS Certificates enabled in the Tailscale admin console
# (DNS -> HTTPS Certificates), or the proxy comes up with no certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
  labels:
    app: rook-ceph-mgr
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: rook-ceph-dashboard-tailnet
      port:
        # The dashboard speaks plain HTTP on 7000; the tailscale proxy
        # terminates TLS in front of it. CephCluster dashboard.ssl is false --
        # turning it on moves this to 8443.
        number: 7000
  tls:
    # The device name. MagicDNS serves it at https://ceph.<tailnet>.ts.net.
    - hosts:
        - ceph
