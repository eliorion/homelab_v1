apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: flux-system
spec:
  targetNamespace: rook-ceph
  # Live. The disks are Ceph's now: re-suspending does NOT hand them back,
  # and deleting the CephCluster is what would destroy the data on them.
  suspend: false
  interval: 30m
  dependsOn:
    # The CephCluster CR does not exist until the operator's CRDs land.
    - name: rook-ceph-operator
      namespace: flux-system
  chart:
    spec:
      chart: rook-ceph-cluster
      # Must match the operator in infrastructure/controllers/base/rook-ceph.
      version: "v1.20.4"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    operatorNamespace: rook-ceph
    toolbox:
      enabled: true
    cephClusterSpec:
      dataDirHostPath: /var/lib/rook
      cephConfig:
        global:
          # Ceph auto-creates the .mgr pool at size 3 on the default host-domain
          # CRUSH rule, which two hosts can never satisfy -- one PG stays
          # undersized and the cluster sits at HEALTH_WARN forever, masking real
          # warnings. These defaults apply to pools created AFTER they land, so a
          # rebuilt cluster is covered; an existing .mgr needs a one-time
          # `ceph osd pool set .mgr size 2`. documentations/16.
          osd_pool_default_size: "2"
          osd_pool_default_min_size: "1"
        mgr:
          # Upstream telemetry opt-in. Turning `enabled` on WITHOUT also running
          # `ceph telemetry on --license sharing-1-0` once leaves the cluster at
          # HEALTH_WARN (TELEMETRY_CHANGED) and uploads an almost empty report:
          # the collection opt-in lives in the mon config-KEY store, which
          # `ceph config` — and so this block — cannot reach. documentations/16.
          mgr/telemetry/enabled: "true"
          mgr/telemetry/channel_basic: "true"
          mgr/telemetry/channel_crash: "true"
          mgr/telemetry/channel_device: "true"
          # ident carries contact/organization/description and de-anonymises the
          # report; perf ships per-daemon counters. Pinned off on purpose.
          mgr/telemetry/channel_ident: "false"
          mgr/telemetry/channel_perf: "false"
          # The alerts panel reads Alertmanager directly. Rook does not manage
          # this key, so cephConfig owns it -- unlike PROMETHEUS_API_HOST, which
          # belongs under dashboard.prometheusEndpoint below and must NOT be set
          # here. In-cluster DNS on purpose, not the tailnet name: this call is
          # mgr-to-Alertmanager, and routing it over the tailnet would make the
          # dashboard depend on the Tailscale proxy.
          mgr/dashboard/ALERTMANAGER_API_HOST: "http://kube-prometheus-stack-alertmanager.monitoring.svc:9093"
          # Selects the backend that mgr.modules below makes available. Rook does
          # NOT set this -- its binary carries no `orch set backend`. Both halves
          # are needed; either alone leaves the dashboard's 503.
          mgr/orchestrator/orchestrator: "rook"
      mon:
        # 3 mons across 3 nodes. node-3 carries a mon but no OSD — mons live on
        # dataDirHostPath, not on a Ceph disk.
        count: 3
        allowMultiplePerNode: false
      mgr:
        count: 2
        modules:
          # Clears the dashboard's `503 Orchestrator is unavailable` and the mgr
          # prometheus module's 15s `Failed to collect cephadm daemon status`.
          # Pairs with mgr/orchestrator/orchestrator above.
          - name: rook
            enabled: true
      dashboard:
        enabled: true
        ssl: false
        # Rook OWNS mgr/dashboard/PROMETHEUS_API_HOST: every dashboard reconcile
        # deletes it and rewrites it from this field, so setting it through
        # cephConfig is silently reverted ~7s later and every graph panel fails
        # with "Invalid URL '/api/v1/query': No schema supplied".
        prometheusEndpoint: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
        prometheusEndpointSSLVerify: false
      storage:
        useAllNodes: false
        useAllDevices: false
        config:
          # The 2 TB disk reports rotational=0 through its USB bridge and is a
          # 7200 rpm HDD (documentations/16). Without this, ceph-volume classes
          # it as ssd and CRUSH splits the pool across two device classes.
          deviceClass: hdd
        nodes:
          # devicePathFilter, not device names: a USB bridge that re-enumerates
          # renames sdl -> sdb and Rook would then adopt the wrong disk or none.
          # These paths encode the physical port; moving a dock breaks them on
          # purpose, visibly, instead of silently claiming something else.
          - name: staging-controlplane-1
            devicePathFilter: "^/dev/disk/by-path/pci-0000:04:00\\.4-usb-0:2:1\\.0-scsi-0:0:0:[01]$"
          - name: staging-controlplane-2
            # Excludes the 250 GB disk on pci-0000:00:1d.0 — its bridge fakes
            # cache flushes and it must never become an OSD.
            devicePathFilter: "^/dev/disk/by-path/pci-0000:00:14\\.0-usb-0:6:1\\.0-scsi-0:0:0:[01]$"
          # A Talos RawVolumeConfig partition of the install disk, not a whole
          # disk — node-3 has no second disk. bootstraping/talconfig.yaml owns
          # its size; the name there must never contain "ceph".
          # deviceClass ssd overrides the cluster-wide hdd pin. ceph-blockpool
          # selects hdd, so this OSD stays unused until an ssd pool exists.
          - name: staging-controlplane-3
            devices:
              - name: /dev/disk/by-partlabel/r-fastpool
            config:
              deviceClass: ssd
      resources:
        osd:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
        mon:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
        mgr:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: osd
          deviceClass: hdd
          replicated:
            # Two copies on two different DISKS, which may share a node. Disk
            # redundancy without node redundancy, chosen deliberately: see the
            # README. failureDomain host would cap the pool at node-1's 1.5 TB
            # and strand 800 GB on node-2.
            size: 2
            # Rook treats anything under 3 as unsafe and refuses without this.
            requireSafeReplicaSize: false
          parameters:
            # At min_size 1 a PG with one surviving copy keeps serving. With
            # failureDomain osd a PG can have BOTH copies on one node, so a node
            # reboot drops those to zero copies and their I/O blocks until it
            # returns — min_size does not save you there. documentations/16.
            min_size: "1"
        storageClass:
          enabled: true
          name: ceph-block
          # Longhorn stays the default class; nothing moves to Ceph implicitly.
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          parameters:
            # This map REPLACES the chart's default parameters, it does not merge
            # with them. The chart ships these four secret pairs; without them every
            # provision fails with "provided secret is empty".
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/fstype: ext4
    cephFileSystems: []
    cephObjectStores: []
