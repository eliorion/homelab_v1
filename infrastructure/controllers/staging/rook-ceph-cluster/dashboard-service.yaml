# The Ceph dashboard's backing Service. It carries NO tailscale annotations:
# ingress-tailscale.yaml exposes it, and both mechanisms at once register two
# devices contending for one hostname (the loser is silently suffixed `ceph-1`).
apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-dashboard-tailnet
  namespace: rook-ceph
spec:
  type: ClusterIP
  # Same selector as Rook's own rook-ceph-mgr-dashboard Service: mgr_role active
  # is what follows a mgr failover to the standby.
  selector:
    app: rook-ceph-mgr
    mgr_role: active
    rook_cluster: rook-ceph
  ports:
    - name: http-dashboard
      port: 7000
      targetPort: 7000
      protocol: TCP
