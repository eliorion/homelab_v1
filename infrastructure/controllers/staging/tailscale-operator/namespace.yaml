apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # Must stay privileged: proxy pods need NET_ADMIN, which the cluster-wide
    # baseline PodSecurity forbids -> StatefulSets create zero pods.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
