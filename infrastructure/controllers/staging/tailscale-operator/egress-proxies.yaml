# Tailscale operator EGRESS proxies — reach a tailnet device FROM the cluster via
# a local Service. The operator runs a proxy pod (a tailnet member) and points
# this ExternalName Service at it; cluster apps dial the local name and traffic
# exits to the tailnet target. The TCP port is preserved end-to-end.
#
# Consume from ANY namespace:
#   http://tailscale-proxy-00.tailscale.svc.cluster.local:8888
#
# Add more exits by copying the block, bumping the number + target IP. This is
# the central proxy pool — asp/fbref lanes point PROXY_URL at these local svcs
# instead of raw 100.x tailnet IPs.
apiVersion: v1
kind: Service
metadata:
  name: tailscale-proxy-00
  namespace: tailscale
  annotations:
    # Target the residential HTTP proxy node by its tailnet (100.x) IP.
    tailscale.com/tailnet-ip: "100.100.98.5"
spec:
  type: ExternalName
  externalName: placeholder # operator overwrites with the egress proxy's svc DNS
---
# tailscale-proxy-01 — second residential exit (example). Uncomment + set the IP
# when you add it, then add a matching scraper proxy lane in the app HelmRelease.
# apiVersion: v1
# kind: Service
# metadata:
#   name: tailscale-proxy-01
#   namespace: tailscale
#   annotations:
#     tailscale.com/tailnet-ip: "100.x.y.z"
# spec:
#   type: ExternalName
#   externalName: placeholder
---
# Garage S3 backup nodes. NOT consumed directly -- the in-cluster HAProxy gateway
# (infrastructure/services/staging/garage-gateway) load-balances + health-checks
# across these three egress Services and exposes one endpoint to etcd-backup and
# the fbref barman sidecar. Dial (via the gateway): port 3900, the Garage S3 API.
apiVersion: v1
kind: Service
metadata:
  name: garage-node-a
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-ip: "100.122.58.119"
spec:
  type: ExternalName
  externalName: placeholder # operator overwrites with the egress proxy's svc DNS
---
apiVersion: v1
kind: Service
metadata:
  name: garage-node-b
  namespace: tailscale
  annotations:
    # Currently offline -- created anyway so the gateway picks it up the moment
    # it joins the tailnet. HAProxy keeps it marked DOWN until then.
    tailscale.com/tailnet-ip: "100.122.210.124"
spec:
  type: ExternalName
  externalName: placeholder
---
apiVersion: v1
kind: Service
metadata:
  name: garage-node-c
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-ip: "100.92.142.13"
spec:
  type: ExternalName
  externalName: placeholder
