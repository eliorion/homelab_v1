# Tailscale operator egress proxies — local Services that exit to a tailnet
# device. See README.md.
apiVersion: v1
kind: Service
metadata:
  name: tailscale-proxy-00
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-ip: "100.100.98.5"
spec:
  type: ExternalName
  externalName: placeholder # operator overwrites with the egress proxy's svc DNS
---
# Node C's exit for scraper pool `c`. Same host as garage-node-c (100.92.142.13),
# but expects an HTTP proxy on 8888, not Garage's S3 API on 3900 — verify before
# routing traffic. Declaring it does not route traffic: the `residential` flag
# lives in the scraper `pools` table. See README.md.
apiVersion: v1
kind: Service
metadata:
  name: tailscale-proxy-scrape-c
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-ip: "100.92.142.13"
spec:
  type: ExternalName
  externalName: placeholder # operator overwrites with the egress proxy's svc DNS
---
# Garage S3 backup nodes (port 3900). Not dialled directly — the garage-gateway
# HAProxy load-balances across these three. See README.md.
apiVersion: v1
kind: Service
metadata:
  name: garage-node-a
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-ip: "100.122.58.119"
spec:
  type: ExternalName
  externalName: placeholder # operator overwrites with the egress proxy's svc DNS
---
apiVersion: v1
kind: Service
metadata:
  name: garage-node-b
  namespace: tailscale
  annotations:
    # Host offline; declared so the gateway picks it up when it joins.
    tailscale.com/tailnet-ip: "100.122.210.124"
spec:
  type: ExternalName
  externalName: placeholder
---
apiVersion: v1
kind: Service
metadata:
  name: garage-node-c
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-ip: "100.92.142.13"
spec:
  type: ExternalName
  externalName: placeholder
