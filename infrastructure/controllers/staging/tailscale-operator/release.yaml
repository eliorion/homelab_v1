apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  targetNamespace: tailscale
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  values:
    # Must stay empty: the chart then uses the pre-created `operator-oauth` SOPS
    # Secret instead of templating its own. NEVER put creds here (plaintext GitOps).
    oauth: {}
    # Serves the k8s API on the tailnet. mode "true" = AUTH mode (impersonate the
    # caller's tailnet identity); needs a manual ACL grant — see README.md.
    apiServerProxyConfig:
      mode: "true"
      allowImpersonation: "true"
