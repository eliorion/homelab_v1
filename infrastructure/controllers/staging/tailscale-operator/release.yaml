apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  targetNamespace: tailscale
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      # Latest stable, verified against https://pkgs.tailscale.com/helmcharts.
      # Renovate keeps it current after the first install.
      version: "1.98.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  # OAuth creds come from the pre-created `operator-oauth` Secret (SOPS) in the
  # tailscale namespace. Leaving oauth.* empty makes the chart skip templating
  # its own Secret and use ours instead. NEVER put creds here — this file is
  # plaintext GitOps.
  # NOT the default. `retries` defaults to 0, and 0 does not mean "retry on the
  # next reconcile" -- it means helm-controller marks this release Stalled after
  # ONE failed upgrade and never attempts it again, while the Kustomization above
  # it stays Ready. It also leaves the failed upgrade UNREMEDIATED, so a chart
  # that half-applied stays half-applied. Nexus sat Ready=False for 16 days on
  # exactly this. See documentations/14-design-decisions.md, "Every HelmRelease
  # sets upgrade.remediation.retries".
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    oauth: {}
    # API server proxy — expose the k8s API on the tailnet so kubectl works
    # off-LAN without the VIP (192.168.1.100:6443). In-process proxy runs in the
    # operator pod; its tailnet device is `tailscale-operator` (operatorConfig.
    # hostname). mode "true" = AUTH mode: the proxy impersonates the caller's
    # tailnet identity, so k8s RBAC (via an ACL grant) decides access — no client
    # cert. allowImpersonation creates the ClusterRole the proxy needs to do that.
    # Activation needs a manual ACL grant + client `tailscale configure
    # kubeconfig` — see README "API server proxy". Talos API is NOT covered here.
    apiServerProxyConfig:
      mode: "true"
      allowImpersonation: "true"
