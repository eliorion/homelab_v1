apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seaweedfs
resources:
  - job.yaml

# Do NOT disable the name hash suffix: it changes the ConfigMap name when the
# script changes, which changes the Job spec, which is what makes Flux
# (force: true) recreate the Job and re-run it.
configMapGenerator:
  - name: seaweedfs-config-script
    files:
      - configure.sh
