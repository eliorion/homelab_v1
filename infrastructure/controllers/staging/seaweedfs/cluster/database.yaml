apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: seaweedfs-db
  namespace: seaweedfs
spec:
  # One instance per node (required anti-affinity): synchronous `any 1` then has two standbys to
  # choose from, so writes no longer stop when the only standby restarts. The filer behind the
  # whole hdd tier keeps its metadata here.
  instances: 3
  failoverDelay: 30
  affinity:
    podAntiAffinityType: required
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  postgresql:
    parameters:
      # A replica that stops streaming may hold at most this much WAL; past it the slot is invalidated and
      # CNPG re-clones the replica, instead of the primary filling its disk.
      max_slot_wal_keep_size: "4GB"
    synchronous:
      method: any
      number: 1
      # preferred, like every other cluster: with no standby streaming, commit locally instead of
      # waiting. 2026-11-11 both standbys lost their WAL after cp1 went down, the primary held 97
      # writes in SyncRep, and the filers (so the whole S3 store) could not start.
      dataDurability: preferred
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-store
        serverName: seaweedfs-db
  bootstrap:
    initdb:
      database: seaweedfs
      owner: seaweedfs
  # 20Gi (was 10Gi), 2026-11-10: the primary filled 10Gi with 7.1 GB of WAL held for replica db-4, whose pod
  # had disappeared, and SeaweedFS went down. max_slot_wal_keep_size below caps that for good.
  storage:
    storageClass: ssd
    size: 20Gi
