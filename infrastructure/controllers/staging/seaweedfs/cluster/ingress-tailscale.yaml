# S3 on the tailnet (HTTPS 443, MagicDNS cert), and nowhere else.
#
# PRECONDITION: HTTPS Certificates enabled in the Tailscale admin console
# (DNS -> HTTPS Certificates). Without it the proxy comes up with no certificate
# and the endpoint is unreachable.
#
# One hostname only: clients MUST use path-style addressing. Rationale: README.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-s3
  namespace: seaweedfs
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: seaweedfs-seaweedfs-s3
      port:
        number: 8333
  tls:
    # The tailnet device name -- the endpoint is https://<this>.<tailnet>.ts.net.
    - hosts:
        - seaweedfs-s3
