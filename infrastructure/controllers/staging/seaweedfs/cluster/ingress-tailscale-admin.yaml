# The admin UI on the tailnet (HTTPS 443, MagicDNS cert), and nowhere else.
#
# PRECONDITION: HTTPS Certificates enabled in the Tailscale admin console
# (DNS -> HTTPS Certificates). Without it the proxy comes up with no certificate
# and the endpoint is unreachable.
#
# 23646 is the admin's HTTP port. The same Service also publishes 33646, the gRPC
# port the worker dials -- that one stays in-cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-admin
  namespace: seaweedfs
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: seaweedfs-seaweedfs-admin
      port:
        number: 23646
  tls:
    # The tailnet device name -- the endpoint is https://<this>.<tailnet>.ts.net.
    - hosts:
        - seaweedfs-admin
