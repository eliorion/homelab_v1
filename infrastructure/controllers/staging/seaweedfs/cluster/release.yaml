apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: flux-system
spec:
  targetNamespace: seaweedfs
  interval: 30m
  chart:
    spec:
      chart: seaweedfs
      version: "4.44.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    global:
      seaweedfs:
        monitoring:
          enabled: true
          # Without this label Prometheus silently ignores the chart's ServiceMonitors.
          additionalLabels:
            release: kube-prometheus-stack
        enableReplication: true
        # Cross-node only because rack == node below.
        replicationPlacement: "010"

    master:
      replicas: 3
      # Chart default is 1000. Only cheap to change while the tier is empty.
      volumeSizeLimitMB: 30000
      data:
        # NOT hostPath, and immutable after the first install. See README.
        type: persistentVolumeClaim
        storageClass: ssd
        size: 5Gi
      logs:
        type: emptyDir
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 512Mi

    # Merged into every entry of `volumes:`. volume-node-1 peaked at 2.5Gi.
    volume:
      enabled: false
      logs:
        type: emptyDir
      resources:
        requests:
          memory: 512Mi
        limits:
          memory: 4Gi
    # One StatefulSet per HDD node: rack is per-StatefulSet and must equal the node.
    volumes:
      node-1:
        replicas: 1
        rack: staging-controlplane-1
        nodeSelector: |
          kubernetes.io/hostname: staging-controlplane-1
        dataDirs:
          # maxVolumes 0 = auto. The chart default of 8 hides most of each disk.
          - name: usb1000
            type: hostPath
            hostPathPrefix: /var/mnt/hdd-usb-1000
            maxVolumes: 0
          - name: usb500
            type: hostPath
            hostPathPrefix: /var/mnt/hdd-usb-500
            maxVolumes: 0
          - name: sata640
            type: hostPath
            hostPathPrefix: /var/mnt/hdd-sata-640
            maxVolumes: 0
      node-2:
        replicas: 1
        rack: staging-controlplane-2
        nodeSelector: |
          kubernetes.io/hostname: staging-controlplane-2
        dataDirs:
          - name: usb2000
            type: hostPath
            hostPathPrefix: /var/mnt/hdd-usb-2000
            maxVolumes: 0
          - name: usb320
            type: hostPath
            hostPathPrefix: /var/mnt/hdd-usb-320
            maxVolumes: 0

    filer:
      replicas: 2
      data:
        type: emptyDir
      logs:
        type: emptyDir
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 1Gi
      extraEnvironmentVars:
        # Must stay explicitly "false": the chart default re-enables LevelDB2 and it wins.
        WEED_LEVELDB2_ENABLED: "false"
        WEED_POSTGRES2_ENABLED: "true"
        WEED_POSTGRES2_HOSTNAME: "seaweedfs-db-rw.seaweedfs.svc.cluster.local"
        WEED_POSTGRES2_PORT: "5432"
        WEED_POSTGRES2_DATABASE: "seaweedfs"
        WEED_POSTGRES2_SSLMODE: "disable"
      secretExtraEnvironmentVars:
        WEED_POSTGRES2_USERNAME:
          secretKeyRef:
            name: seaweedfs-db-app
            key: username
        WEED_POSTGRES2_PASSWORD:
          secretKeyRef:
            name: seaweedfs-db-app
            key: password

    s3:
      enabled: true
      replicas: 2
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-config
      logs:
        type: emptyDir
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 3Gi

    # Runs volume.fix.replication; without it under-replicated volumes stay read-only.
    admin:
      enabled: true
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 512Mi
    worker:
      enabled: true
      # Deep-merged over the chart default (500m/512Mi, limits 2/2Gi).
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
