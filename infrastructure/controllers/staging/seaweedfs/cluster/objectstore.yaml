apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage-store
  namespace: seaweedfs
spec:
  retentionPolicy: "7d"
  configuration:
    destinationPath: "s3://cnpg-staging-seaweedfs"
    # In-cluster HAProxy gateway -> Tailscale egress -> Garage nodes.
    endpointURL: "http://garage-s3.garage-gw.svc.cluster.local:3900"
    s3Credentials:
      accessKeyId:
        name: garage-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: garage-backup-credentials
        key: ACCESS_KEY_SECRET
    wal:
      compression: gzip
      # NO `encryption:` here. Garage does not support SSE-S3/AES256.
    data:
      compression: gzip
      jobs: 2
  instanceSidecarConfiguration:
    # The seaweedfs namespace LimitRange caps an unsized container at 256Mi.
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 512Mi
    env:
      # THE REGION IS LOAD-BEARING: Garage rejects a HeadBucket signed for any other region.
      - name: AWS_REGION
        value: garage
      - name: AWS_DEFAULT_REGION
        value: garage
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
