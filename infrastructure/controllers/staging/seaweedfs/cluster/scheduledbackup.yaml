apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: seaweedfs-db-daily
  namespace: seaweedfs
spec:
  # 6-field CNPG cron. 2:20 UTC, staggered with the other clusters.
  schedule: "0 20 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: seaweedfs-db
