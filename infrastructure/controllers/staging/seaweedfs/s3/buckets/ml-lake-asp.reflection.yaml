# Which namespaces receive the ml-lake-asp bucket key (Secret s3-ml-lake-asp, ml-lake-asp.enc.yaml): a
# plain patch, reviewed like an RBAC grant: every namespace listed gets READ AND WRITE on asp's lake, which
# holds the ads' text and their sellers (asp docs/27 D6). Keep the two lists identical.
apiVersion: v1
kind: Secret
metadata:
  name: s3-ml-lake-asp
  namespace: flux-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: mlops
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: mlops
