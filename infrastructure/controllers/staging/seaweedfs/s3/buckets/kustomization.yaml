apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One sops Secret per bucket, in flux-system: that is where postBuild.substituteFrom reads them.
resources:
  - advisor-corpus.enc.yaml
  # The scraper's raw page archive for its fbref tenant (asp scraper chart engine.rawArchives):
  # every fetched page body, content-addressed, so a widened grammar re-extracts history from here
  # instead of re-fetching it. No expiry: raw history is the point.
  - fbref-raw.enc.yaml
  # fbref-vision's transient player photos: written by the scraper (tenant fbref-vision), read and
  # deleted by fbref-vision once scored, so the bucket stays near-empty. No expiry, by design.
  - fbref-vision-tmp.enc.yaml
  # MLflow's proxied artifact store (asp k8s/charts/mlops): run artifacts, model files, frozen
  # training sets. In-cluster on purpose: Garage is off-site and kept for disaster-recovery data.
  - mlflow-artifacts.enc.yaml
  # The ML data lake (asp docs/25): parquet snapshots of fbref for the mlops-pipelines run pods.
  # Holds special-category data (GDPR Art. 9), so its identity reaches this bucket and nothing else.
  - ml-lake.enc.yaml
  - nextcloud.enc.yaml
  # The scraper's own identity for streaming advisor files into advisor-corpus (asp scraper
  # chart engine.fileSinks), separate so the scraper never holds the advisor engine's key.
  - scraper-advisor-sink.enc.yaml
  - tmp-backup-garage.enc.yaml
patches:
  # ml-lake's consumer namespaces (reflector), kept out of the encrypted file: ml-lake.reflection.yaml.
  - path: ml-lake.reflection.yaml
