apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One sops Secret per bucket, in flux-system: that is where postBuild.substituteFrom reads them.
resources:
  - advisor-corpus.enc.yaml
  - nextcloud.enc.yaml
  # The scraper's own identity for streaming advisor files into advisor-corpus (asp scraper
  # chart engine.fileSinks), separate so the scraper never holds the advisor engine's key.
  - scraper-advisor-sink.enc.yaml
  - tmp-backup-garage.enc.yaml
