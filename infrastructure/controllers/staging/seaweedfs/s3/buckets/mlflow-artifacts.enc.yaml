# S3 credential for bucket mlflow-artifacts (asp k8s/charts/mlops: MLflow's proxied artifact store,
# mlflow.objectStore). Template: mlflow-artifacts.enc.yaml.exemple. Steps: ../README.md.
apiVersion: v1
kind: Secret
metadata:
    name: s3-mlflow-artifacts
    namespace: flux-system
