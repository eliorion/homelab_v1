# Which namespaces receive the ml-lake-advisor bucket key (Secret s3-ml-lake-advisor): a plain patch,
# reviewed like an RBAC grant: every namespace listed gets READ AND WRITE on the advisor's lake, which holds
# its corpus (asp docs/27 D7). Never the advisor's own customer-facing namespaces. Keep the two lists identical.
apiVersion: v1
kind: Secret
metadata:
  name: s3-ml-lake-advisor
  namespace: flux-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: mlops
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: mlops
