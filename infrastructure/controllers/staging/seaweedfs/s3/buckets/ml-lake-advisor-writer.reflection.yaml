# Which namespaces receive the advisor's write-only key on ml-lake (Secret s3-ml-lake-advisor): advisor
# only, where advisor-mot-backfill uploads each MOT year's Parquet archive under advisor/ before purging
# the staged rows (asp docs/27 D10). It can write the bucket and read nothing; the lake's read key
# (s3-ml-lake) stays in mlops. Keep the two lists identical.
apiVersion: v1
kind: Secret
metadata:
  name: s3-ml-lake-advisor
  namespace: flux-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: advisor
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: advisor
