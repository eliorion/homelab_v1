apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cnpg/
  # Tailscale operator — exposes the asp/fbref admin UIs on the tailnet.
  - tailscale-operator/
  - seaweedfs-cluster/
  # LINSTOR storage pools — one `ssd` pool spanning all three nodes.
  - linstor-cluster/
  # ACME ClusterIssuers (letsencrypt-staging + -prod) and the Cloudflare
  # DNS-01 token. Shared infra: the registry and Forgejo both need real certs.
  - cert-manager-issuers/
