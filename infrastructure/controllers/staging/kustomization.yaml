apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cnpg/
  # Tailscale operator — exposes the asp/fbref admin UIs on the tailnet.
  - tailscale-operator/
  # SeaweedFS — the hdd class and the S3 gateway.
  - seaweedfs-cluster/
  # LINSTOR storage pools. node-2 has no r-linstor partition yet, so its pool
  # simply does not exist until its EPHEMERAL is re-provisioned.
  - linstor-cluster/
