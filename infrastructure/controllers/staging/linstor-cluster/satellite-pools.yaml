apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: ssd-pool
spec:
  storagePools:
      # One object, no nodeAffinity: every node carrying r-linstor gets the
      # pool, and all three report the same pool name so the StorageClass sees
      # a single `ssd` pool. bootstraping/talconfig.yaml owns the partitions.
    - name: ssd
      lvmThinPool: {}
      source:
        hostDevices:
          - /dev/disk/by-partlabel/r-linstor
