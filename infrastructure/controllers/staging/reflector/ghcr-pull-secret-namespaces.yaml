# Plaintext patch, NOT sops-encrypted. Owns the two *-namespaces lists on the
# ghcr-pull-secret Secret (credential itself stays in ghcr-pull-secret.enc.yaml)
# so adding or removing a consuming project is a plain git edit — no sops.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: reflector
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: asp,fbref,lab,scraper,registry,advisor
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: asp,fbref,lab,scraper,registry,advisor
