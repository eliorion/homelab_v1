apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Operator + the ONE central GHCR pull secret it mirrors. See README.md.
# Only decrypts because infra-reflector (clusters/staging/infrastructure.yaml)
# sets decryption.provider: sops.
resources:
  - ../../base/reflector
  - ghcr-pull-secret.enc.yaml

# Plaintext annotation patch, applied after sops decrypts the resource above —
# see ghcr-pull-secret-namespaces.yaml.
patches:
  - path: ghcr-pull-secret-namespaces.yaml
    target:
      kind: Secret
      name: ghcr-pull-secret
