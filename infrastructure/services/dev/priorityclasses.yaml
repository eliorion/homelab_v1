# value and preemptionPolicy are immutable: changing either needs a delete + recreate.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-critical
value: 100000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: Platform workloads the dev tier depends on.
---
# Must match policies/priority.yaml (priority -1000, preemptionPolicy Never).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: dev-preview
value: -1000
preemptionPolicy: Never
globalDefault: false
description: Per-PR preview workloads; first to be preempted, never preempt.
