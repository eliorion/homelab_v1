apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - priorityclasses.yaml
  - rbac/serviceaccounts.yaml
  - rbac/preview-driver.yaml
  - rbac/preview-vcluster.yaml
  - rbac/preview-reader.yaml
  - rbac/preview-reaper.yaml
  - rbac/token-mint.yaml
  - rbac/kyverno-background.yaml
  - templates/resourcequota.yaml
  - templates/limitrange.yaml
  - templates/networkpolicies.yaml
  - templates/ciliumnetworkpolicies.yaml
  - policies/generate-guardrails.yaml
  - policies/generate-rbac.yaml
  - policies/namespaces.yaml
  - policies/workloads.yaml
  - policies/services-pvcs-routes.yaml
  - policies/priority.yaml
  - reaper/cronjob.yaml

# Keep the hash suffix: it renames the ConfigMap on a script edit, which changes the CronJob spec.
configMapGenerator:
  - name: preview-reaper-script
    namespace: dev-platform
    files:
      - reaper/reaper.sh
