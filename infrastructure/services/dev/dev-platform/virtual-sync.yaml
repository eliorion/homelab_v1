# Applies virtual/ inside the vcluster. It lives in dev-platform because spec.kubeConfig reads
# a Secret from the Kustomization's own namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-platform-virtual
  namespace: dev-platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/services/dev/dev-platform/virtual
  prune: true
  wait: true
  kubeConfig:
    secretRef:
      name: vc-vcluster
      key: config
