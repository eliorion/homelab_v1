# The ARC runner pods (scale set self-hosted-arc, infrastructure/services/staging/arc-runner-set/)
# read the vcluster credential they hand to Dagger. Nothing else on the host.
# This used to be a dedicated e2e scale set; with it gone the credential is reachable from any job
# on the default pool. Fork PRs never run there (asp routes them to GitHub-hosted runners), so the
# audience is the same repo's own workflows -- and the token is confined by e2e-runner-scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-runner-kubeconfig
  namespace: dev-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vc-e2e-runner"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-runner-kubeconfig
  namespace: dev-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-runner-kubeconfig
subjects:
  - kind: ServiceAccount
    name: self-hosted-arc-gha-rs-no-permission
    namespace: arc-runners
