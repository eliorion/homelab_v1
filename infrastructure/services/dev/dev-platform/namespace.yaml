# The one host namespace behind the dev platform vcluster (README.md).
apiVersion: v1
kind: Namespace
metadata:
  name: dev-platform
  labels:
    eliorion.fr/tier: dev
    # The vcluster syncer creates plain pods here; baseline is what the charts need.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: dev
value: -1000
preemptionPolicy: Never
globalDefault: false
description: Run workloads inside the dev platform vcluster (e2e runs, dev sandboxes); first to be preempted, never preempt.
