apiVersion: v1
kind: Service
metadata:
  namespace: dev-platform
  name: vcluster
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
  - port: 443
---
apiVersion: v1
kind: Service
metadata:
  namespace: dev-platform
  name: web
spec:
  ports:
  - port: 80
---
apiVersion: v1
kind: Service
metadata:
  namespace: dev-platform
  name: lb-no-class
spec:
  type: LoadBalancer
  ports:
  - port: 80
---
apiVersion: v1
kind: Service
metadata:
  namespace: dev-platform
  name: lb-wrong-name
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
  - port: 80
---
apiVersion: v1
kind: Service
metadata:
  namespace: dev-platform
  name: nodeport
spec:
  type: NodePort
  ports:
  - port: 80
---
apiVersion: v1
kind: Service
metadata:
  namespace: dev-platform
  name: external-ips
spec:
  externalIPs: [192.168.1.50]
  ports:
  - port: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: dev-platform
  name: data
spec:
  storageClassName: ssd-single
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: dev-platform
  name: data-ssd
spec:
  storageClassName: ssd
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: dev-platform
  name: data-default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
