apiVersion: cli.kyverno.io/v1alpha1
kind: ClusterResource
metadata:
  name: cluster
spec:
  crds:
  - ../crds/ciliumnetworkpolicies.yaml
  resources:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-platform
      labels:
        eliorion.fr/tier: dev
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-bare
      labels:
        eliorion.fr/tier: dev
  - apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: dev-quota
      namespace: dev-platform
  - apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: dev-host-boundary
      namespace: dev-platform
  # dev-bare has the quota but not the host boundary.
  - apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: dev-quota
      namespace: dev-bare
