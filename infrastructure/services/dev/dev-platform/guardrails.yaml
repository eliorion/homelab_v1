# Sized for the platform (control plane, CoreDNS, KEDA, CNPG operator) plus two concurrent
# FOUR-stack runs (asp, fbref, scraper, advisor) with their CNPG clusters. Numbers and how
# they were measured: README.md.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev-platform
spec:
  hard:
    pods: "75"
    requests.cpu: "7"
    requests.memory: 12Gi
    limits.cpu: "42"
    limits.memory: 36Gi
    persistentvolumeclaims: "16"
    requests.storage: 40Gi
    ssd-single.storageclass.storage.k8s.io/requests.storage: 40Gi
    ssd.storageclass.storage.k8s.io/persistentvolumeclaims: "0"
    hdd.storageclass.storage.k8s.io/persistentvolumeclaims: "0"
    services: "100"
    services.loadbalancers: "1"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limits
  namespace: dev-platform
spec:
  limits:
    - type: Container
      # limits.cpu in dev-quota refuses any container without a CPU limit; this supplies one.
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        memory: 2Gi
    - type: PersistentVolumeClaim
      max:
        storage: 5Gi
