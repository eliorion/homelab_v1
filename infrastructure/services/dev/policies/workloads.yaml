apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: preview-workloads
spec:
  validationActions: ["Deny"]
  failurePolicy: Fail
  # Empty list = no rules generated for Deployments/StatefulSets; the vcluster syncer creates bare Pods.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
    namespaceSelector:
      matchLabels:
        preview.eliorion.fr/tier: preview
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    # GeneratingPolicy webhooks are always failurePolicy Ignore: refuse pods until the guardrails exist.
    - expression: >-
        request.operation != 'CREATE' ||
        (dyn(resource.Get('v1', 'resourcequotas', request.namespace, 'preview-quota')) != null &&
         dyn(resource.Get('networking.k8s.io/v1', 'networkpolicies', request.namespace, 'default-deny')) != null)
      message: preview guardrails (ResourceQuota preview-quota, NetworkPolicy default-deny) are not generated yet
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) &&
        !object.spec.?hostPID.orValue(false) &&
        !object.spec.?hostIPC.orValue(false)
      message: hostNetwork, hostPID and hostIPC are forbidden in previews
    - expression: "!object.spec.?volumes.orValue([]).exists(v, has(v.hostPath))"
      message: hostPath volumes are forbidden in previews
    - expression: "!variables.containers.exists(c, c.?securityContext.?privileged.orValue(false))"
      message: privileged containers are forbidden in previews
    - expression: "request.operation != 'CREATE' || object.spec.?nodeName.orValue('') == ''"
      message: spec.nodeName may not be set in previews
    - expression: >-
        object.spec.?nodeSelector.orValue({}).all(k, k in ['kubernetes.io/os', 'kubernetes.io/arch'])
      message: nodeSelector may only use kubernetes.io/os and kubernetes.io/arch in previews
    - expression: "!object.spec.?affinity.?nodeAffinity.?requiredDuringSchedulingIgnoredDuringExecution.hasValue()"
      message: required node affinity is forbidden in previews
    # Runs after policies/priority.yaml has mutated the pod.
    - expression: "object.spec.?priorityClassName.orValue('') == 'dev-preview'"
      message: preview pods must run at priorityClassName dev-preview
