apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: preview-priority
spec:
  failurePolicy: Fail
  # Empty list = no Deployment/StatefulSet template mutation; only Pods are rewritten.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        preview.eliorion.fr/tier: preview
  mutations:
    # All three together: the Priority admission plugin already resolved priority from the original class.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              priorityClassName: "dev-preview",
              priority: -1000,
              preemptionPolicy: "Never"
            }
          }
