apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: preview-services
spec:
  validationActions: ["Deny"]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
    namespaceSelector:
      matchLabels:
        preview.eliorion.fr/tier: preview
  validations:
    - expression: >-
        object.spec.?type.orValue('ClusterIP') != 'LoadBalancer' ||
        (object.metadata.name == 'vcluster' && object.spec.?loadBalancerClass.orValue('') == 'tailscale')
      message: only the Service vcluster may be a LoadBalancer, and only with loadBalancerClass tailscale
    - expression: "object.spec.?type.orValue('ClusterIP') != 'NodePort'"
      message: NodePort Services are forbidden in previews
    - expression: "object.spec.?externalIPs.orValue([]).size() == 0"
      message: externalIPs are forbidden in previews
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: preview-pvcs
spec:
  validationActions: ["Deny"]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
    namespaceSelector:
      matchLabels:
        preview.eliorion.fr/tier: preview
  validations:
    # A PVC with no class has already been defaulted to ssd by the time this runs.
    - expression: "object.spec.?storageClassName.orValue('') == 'ssd-single'"
      message: preview PVCs must set storageClassName ssd-single
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: preview-httproutes
spec:
  validationActions: ["Deny"]
  failurePolicy: Fail
  # Admission only: the reports controller has no read on httproutes, and routes are only ever created at admission.
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
    namespaceSelector:
      matchLabels:
        preview.eliorion.fr/tier: preview
  variables:
    - name: pr
      expression: namespaceObject.metadata.?labels[?'preview.eliorion.fr/pr'].orValue('')
    - name: hostnames
      expression: object.spec.?hostnames.orValue([])
  validations:
    # An empty hostnames list matches every hostname on the shared Gateway.
    - expression: >-
        variables.pr.matches('^[0-9]+$') && variables.hostnames.size() > 0 &&
        variables.hostnames.all(h, h.matches('^pr-' + variables.pr + '(-[a-z0-9]+)?\\.preview\\.eliorion\\.fr$'))
      messageExpression: "'hostnames must be pr-' + variables.pr + '[-<suffix>].preview.eliorion.fr, and at least one is required'"
    - expression: >-
        object.spec.?parentRefs.orValue([]).size() > 0 &&
        object.spec.parentRefs.all(p,
          p.name == 'preview' && p.?namespace.orValue('') == 'dev-platform' &&
          p.?group.orValue('gateway.networking.k8s.io') == 'gateway.networking.k8s.io' &&
          p.?kind.orValue('Gateway') == 'Gateway')
      message: parentRefs must be exactly the Gateway dev-platform/preview
    - expression: >-
        object.spec.?rules.orValue([]).all(r,
          r.?backendRefs.orValue([]).all(b,
            b.?namespace.orValue(request.namespace) == request.namespace &&
            b.?group.orValue('') == '' && b.?kind.orValue('Service') == 'Service'))
      message: backendRefs may only name Services in this namespace
