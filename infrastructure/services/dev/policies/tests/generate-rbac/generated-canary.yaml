apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vcluster
  namespace: preview-canary
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-vcluster
subjects:
- kind: ServiceAccount
  name: vc-vcluster
  namespace: preview-canary
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-reader
  namespace: preview-canary
