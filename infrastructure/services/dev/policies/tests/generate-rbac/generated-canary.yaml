  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-kubeconfig-reader
subjects:
- kind: ServiceAccount
  name: preview-reader
  namespace: dev-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dagger-devs-view
