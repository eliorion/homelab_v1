apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: namespaces-reaper
policies:
  - ../../namespaces.yaml
resources:
  - ../namespaces-cap-ok/resources.yaml
  - resources.yaml
userinfo: userinfo.yaml
results:
  - isValidatingPolicy: true
    kind: Namespace
    policy: preview-namespaces
    resources: [preview-pr-12]
    result: fail
  - isValidatingPolicy: true
    kind: Namespace
    policy: preview-namespaces
    operation: DELETE
    resources: [preview-pr-12]
    result: pass
  - isValidatingPolicy: true
    kind: Namespace
    policy: preview-namespaces
    operation: DELETE
    resources: [preview-canary]
    result: fail
