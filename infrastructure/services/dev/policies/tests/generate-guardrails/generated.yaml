apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-quota
  namespace: preview-pr-12
spec:
  hard:
    pods: '80'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: preview-limits
  namespace: preview-pr-12
spec:
  limits:
  - type: Container
    max:
      memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: preview-pr-12
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: preview-gateway-ingress
  namespace: preview-pr-12
spec:
  endpointSelector: {}
  ingress:
  - fromEntities:
    - ingress
