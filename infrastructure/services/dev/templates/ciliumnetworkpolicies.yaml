# Clone sources: edits sync to every preview; deleting one deletes every copy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: preview-platform-egress
  namespace: preview-template
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # 8443 is harbor-nginx's TLS containerPort (Service 443 -> 8443); policy sees the post-DNAT port.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: registry
            app: harbor
            component: nginx
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
# Chart pod labels; the DoesNotExist excludes tenant pods the syncer copies (they carry managed-by).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: preview-vcluster-api
  namespace: preview-template
spec:
  endpointSelector:
    matchLabels:
      app: vcluster
      release: vcluster
    matchExpressions:
      - key: vcluster.loft.sh/managed-by
        operator: DoesNotExist
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dagger
            app.kubernetes.io/name: dagger-helm
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: preview-gateway-ingress
  namespace: preview-template
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
