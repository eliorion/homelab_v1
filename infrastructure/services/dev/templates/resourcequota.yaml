# Clone source: edits sync to every preview; deleting it deletes every copy.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-quota
  namespace: preview-template
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.memory: 16Gi
    pods: "80"
    services: "40"
    services.loadbalancers: "1"
    # A LoadBalancer Service counts its ports here unless allocateLoadBalancerNodePorts: false.
    services.nodeports: "0"
    persistentvolumeclaims: "6"
    requests.storage: 20Gi
    ssd-single.storageclass.storage.k8s.io/requests.storage: 20Gi
    ssd.storageclass.storage.k8s.io/persistentvolumeclaims: "0"
    hdd.storageclass.storage.k8s.io/persistentvolumeclaims: "0"
    count/httproutes.gateway.networking.k8s.io: "6"
