# Clone source. max memory 2Gi rejects the vcluster chart's default 4Gi syncer limit (README).
apiVersion: v1
kind: LimitRange
metadata:
  name: preview-limits
  namespace: preview-template
spec:
  limits:
    - type: Container
      default:
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        memory: 2Gi
    - type: PersistentVolumeClaim
      max:
        storage: 5Gi
