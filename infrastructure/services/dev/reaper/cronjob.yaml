apiVersion: batch/v1
kind: CronJob
metadata:
  name: preview-reaper
  namespace: dev-platform
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: preview-reaper
        spec:
          restartPolicy: OnFailure
          serviceAccountName: preview-reaper
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              # sh + kubectl + jq; keep the kubectl minor within one of the cluster's.
              image: docker.io/alpine/k8s:1.36.4
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/script/reaper.sh"]
              env:
                - name: HOME
                  value: /tmp
                - name: TTL_SECONDS
                  value: "86400"
                - name: LEASE_SECONDS
                  value: "7200"
                - name: MAX_PREVIEWS
                  value: "3"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /script
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: preview-reaper-script
            - name: tmp
              emptyDir: {}
