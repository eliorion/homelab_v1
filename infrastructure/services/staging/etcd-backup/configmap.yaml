apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-backup-config
data:
  AWS_REGION: "garage"
  BUCKET: "homelab-staging-etcd-backup"
  S3_PREFIX: "staging"
  CLUSTER_NAME: "Homelab_staging"
  # The in-cluster HAProxy gateway to the off-cluster Garage nodes.
  CUSTOM_S3_ENDPOINT: "http://garage-s3.garage-gw.svc.cluster.local:3900"
  # Garage needs PATH-STYLE addressing (virtual-host bucket.<host> does not
  # resolve). BEWARE: talos-backup v0.1.0-beta.3 has an INVERTED check --
  #   UsePathStyle = (os.Getenv("USE_PATH_STYLE") == "false")
  # -- so we set "false" here to actually GET path-style. Fixed on main
  # (== "true"). When the pinned image is bumped past beta.3, flip back to "true".
  USE_PATH_STYLE: "false"
  # zstd before encryption.
  ENABLE_COMPRESSION: "true"
  # age PUBLIC key (not secret); the private key is offline -- see README.md.
  # Never set DISABLE_ENCRYPTION: the snapshot holds every Secret in plaintext.
  # NOTE: talos-backup UNCONDITIONALLY combines AGE_RECIPIENT_PUBLIC_KEY and
  # AGE_X25519_PUBLIC_KEY. Leaving one unset appends an empty "" recipient and
  # age fails with "malformed recipient". So BOTH must be set, to the same key.
  AGE_RECIPIENT_PUBLIC_KEY: "age164jzj8jwu7lu2hwanc92unkh75py8sy2y9wt3da3hgk4ddwrkutsn02c3v"
  AGE_X25519_PUBLIC_KEY: "age164jzj8jwu7lu2hwanc92unkh75py8sy2y9wt3da3hgk4ddwrkutsn02c3v"
