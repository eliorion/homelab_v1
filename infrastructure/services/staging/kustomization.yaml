apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - databases/
  - renovate/
  - keycloak/
  - cloudflare/
  - arc-runner-set/
  - nexus/
  # harbor: the OCI cache + push target, and the registry UI. Serves its own
  # TLS (cert-manager), so no client needs --insecure-registry or a CA.
  - harbor/
  # Dagger Engine: the CI build engine. Upstream dagger-helm chart, one
  # StatefulSet engine with a node-local cache volume.
  - dagger/
  - etcd-backup/
  - garage-gateway/
  - radar/
  # Goldilocks: dashboard + controller that creates a VPA (mode Off) per workload.
  - goldilocks/
  - ai-gateway/
  - homepage/
  - openbao/
  # The shared MLOps platform (asp docs/24): Dagster + MLflow, both UIs on the tailnet only.
  - mlops/
  # Forgejo: a mirror of asp with CI on the shared Dagger engine (asp docs/28). Runners in
  # their own namespace, admitted to the engine by dagger/networkpolicy.yaml.
  - forgejo/
  - forgejo-runner/
