apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - databases/
  - renovate/
  - keycloak/
  - cloudflare/
  - arc-runner-set/
  - nexus/
  # harbor: the OCI cache + push target, and the registry UI. Serves its own
  # TLS (cert-manager), so no client needs --insecure-registry or a CA.
  - harbor/
  # Dagger Engine: the CI build engine. StatefulSet x2 with a node-local
  # cache volume each -- /var/lib/dagger holds a buildkitd.lock, so two
  # pods can never share one volume.
  - dagger/
  - etcd-backup/
  - garage-gateway/
  - radar/
  - ai-gateway/
  - homepage/
