- Cloudflare tunnel:
    - Tunnel:
        icon: cloudflare.png
        href: https://one.dash.cloudflare.com/{{HOMEPAGE_VAR_CF_ACCOUNT_ID}}/networks/tunnels
        description: cloudflared, the only public entry
        namespace: cloudflare
        app: cloudflared
        podSelector: infrastructure=cloudflared
        widget:
          type: cloudflared
          accountid: "{{HOMEPAGE_VAR_CF_ACCOUNT_ID}}"
          tunnelid: "{{HOMEPAGE_VAR_CF_TUNNEL_ID}}"
          key: "{{HOMEPAGE_VAR_CF_API_TOKEN}}"
    - AzuraCast:
        icon: azuracast.png
        href: https://mve-azuracast.eliorion.fr
        description: Radio, UI and stream
        siteMonitor: https://mve-azuracast.eliorion.fr
        namespace: azuracast
        app: azuracast
        podSelector: app=azuracast
    - nao (public):
        icon: mdi-chart-box-outline
        href: https://nao.eliorion.fr
        description: Behind Cloudflare Access
        siteMonitor: https://nao.eliorion.fr
    - fbref MCP:
        icon: mdi-api
        href: https://fbref-mcp.eliorion.fr/healthz
        description: MCP server, OAuth via Keycloak
        siteMonitor: https://fbref-mcp.eliorion.fr/healthz
    - Keycloak (public):
        icon: keycloak.png
        href: https://staging-keycloak.eliorion.fr/realms/mcp/.well-known/openid-configuration
        description: Realm endpoints only, no console
        siteMonitor: https://staging-keycloak.eliorion.fr/realms/mcp/.well-known/openid-configuration

- Tailnet:
    - Devices:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        widget:
          type: customapi
          url: https://api.tailscale.com/api/v2/tailnet/-/devices
          refreshInterval: 60000
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_TAILSCALE_API_KEY}}"
          display: dynamic-list
          mappings:
            items: devices
            name: hostname
            label: connectedToControl
            remap:
              - value: true
                to: online
              - value: false
                to: offline
