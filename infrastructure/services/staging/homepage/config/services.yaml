- Observability:
    - Grafana:
        icon: grafana.png
        href: https://grafana.tail45b0ca.ts.net
        description: Dashboards and alerting
        siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc:80/api/health
        namespace: monitoring
        app: grafana
        podSelector: app.kubernetes.io/name=grafana,app.kubernetes.io/instance=kube-prometheus-stack
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          refreshInterval: 60000
          metrics:
            - label: Critical
              query: count(ALERTS{alertstate="firing",severity="critical"}) or vector(0)
            - label: Warning
              query: count(ALERTS{alertstate="firing",severity="warning"}) or vector(0)
    - Radar:
        icon: mdi-radar
        href: http://radar.tail45b0ca.ts.net:9280
        description: Cluster explorer
        siteMonitor: http://radar.radar.svc:9280
        namespace: radar
        app: radar
        podSelector: ""

