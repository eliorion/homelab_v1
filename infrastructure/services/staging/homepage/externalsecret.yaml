apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    # Same name the SOPS Secret had: base/homepage/deployment.yaml reads it via envFrom.
    name: homepage-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homepage/homepage-secrets
