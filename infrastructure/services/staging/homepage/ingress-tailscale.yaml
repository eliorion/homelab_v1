apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: homepage
      port:
        number: 3000
  tls:
    # Device name; must match HOMEPAGE_ALLOWED_HOSTS in kustomization.yaml.
    - hosts:
        - home
