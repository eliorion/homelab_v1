apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-asp-dagger
  namespace: flux-system
spec:
  targetNamespace: arc-dagger
  releaseName: arc-runner-set-asp-dagger
  interval: 30m
  chart:
    spec:
      # Lockstep with the controller chart, infrastructure/controllers/base/arc/release.yaml.
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system
      interval: 12h
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    githubConfigUrl: https://github.com/Eliorion/asp
    # Reflected from arc-runners by github-pat-reflection.yaml.
    githubConfigSecret: arc-github-pat
    # `runs-on: self-hosted-arc-dagger` (asp variable CI_RUNNER_DAGGER). Renaming it renames the
    # ServiceAccount the dagger-engine-exec RoleBinding names (infrastructure/services/base/dagger).
    runnerScaleSetName: self-hosted-arc-dagger
    # = asp's matrix max-parallel: a six-leg matrix starts without a pod start.
    minRunners: 6
    # Session budget with the dind pool: 10 + 6 after cutover = 16 sessions on the one engine (README).
    maxRunners: 10
    template:
      spec:
        # Soft: node-1 carries the engine, whose memory pressure drops every exec session.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - staging-controlplane-1
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: self-hosted-arc-dagger
        # The namespace enforces PSA restricted: every field below is required by it.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        imagePullSecrets:
          - name: ghcr-pull-secret
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
            image: ghcr.io/actions/actions-runner:2.337.0
            command: ["/home/runner/run.sh"]
            env:
              - name: OTEL_EXPORTER_OTLP_PROTOCOL
                value: http/protobuf
              - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                value: http://alloy-receiver.monitoring.svc.cluster.local:4318/v1/traces
              - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
                value: http://alloy-receiver.monitoring.svc.cluster.local:4318/v1/logs
              - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
                value: http://alloy-receiver.monitoring.svc.cluster.local:4318/v1/metrics
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 2Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
        volumes:
          - name: work
            emptyDir: {}
