apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-asp-xl
  namespace: flux-system
spec:
  targetNamespace: arc-runners
  releaseName: arc-runner-set-asp-xl
  interval: 30m
  chart:
    spec:
      # Same chart + version as the default pool (lockstep with the
      # gha-runner-scale-set-controller in controllers/base/arc/release.yaml).
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system
      interval: 12h
  # retries defaults to 0, which latches the release Stalled after ONE failed
  # upgrade and leaves it unremediated. Keep it set (documentations/14).
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    githubConfigUrl: https://github.com/Eliorion/asp
    # Reuses the same PAT secret as the default pool (both in arc-runners).
    githubConfigSecret: arc-github-pat
    # `runs-on: self-hosted-arc-xl` (CI_RUNNER_XL var) targets this scale set.
    # Must stay distinct from the default pool's name.
    runnerScaleSetName: self-hosted-arc-xl
    minRunners: 2
    maxRunners: 4
    # Manual dind template, NOT containerMode: dind — that one accepts no extra
    # dockerd flags, so it cannot pass --insecure-registry (see README).
    template:
      metadata:
        labels:
          # Must match the podAntiAffinity labelSelector below.
          runner-tier: xl
      spec:
        # Hard one-XL-pod-per-node: schedulable concurrency is capped at the
        # node count (3), not at maxRunners — the 4th stays Pending by design.
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    runner-tier: xl
                topologyKey: kubernetes.io/hostname
        initContainers:
          # Copies runner externals where the dind container expects them.
          - name: init-dind-externals
            # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
            image: ghcr.io/actions/actions-runner:2.336.0
            command:
              ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          # Native sidecar (restartPolicy: Always on an initContainer). k3d and
          # the e2e images run inside it, so it carries the memory budget.
          - name: dind
            image: docker:dind
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
              # Nexus docker connectors are plain HTTP (no TLS yet).
              - --insecure-registry=nexus.nexus.svc:5000
              - --insecure-registry=nexus.nexus.svc:5001
              - --insecure-registry=nexus.nexus.svc:5002
              - --insecure-registry=nexus.nexus.svc.cluster.local:5000
              - --insecure-registry=nexus.nexus.svc.cluster.local:5001
              - --insecure-registry=nexus.nexus.svc.cluster.local:5002
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command: ["docker", "info"]
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 2
            resources:
              requests:
                memory: 2Gi
              limits:
                memory: 8Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
            image: ghcr.io/actions/actions-runner:2.336.0
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 1Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
        volumes:
          - name: work
            emptyDir: {}
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
