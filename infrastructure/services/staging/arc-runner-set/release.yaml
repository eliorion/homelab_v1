apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-asp
  namespace: flux-system
spec:
  targetNamespace: arc-runners
  releaseName: arc-runner-set-asp
  interval: 30m
  chart:
    spec:
      # Must stay in lockstep with the gha-runner-scale-set-controller chart
      # version in infrastructure/controllers/base/arc/release.yaml.
      # Renovate keeps this pinned version current.
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system
      interval: 12h
  # NOT the default. `retries` defaults to 0, and 0 does not mean "retry on the
  # next reconcile" -- it means helm-controller marks this release Stalled after
  # ONE failed upgrade and never attempts it again, while the Kustomization above
  # it stays Ready. It also leaves the failed upgrade UNREMEDIATED, so a chart
  # that half-applied stays half-applied. Nexus sat Ready=False for 16 days on
  # exactly this. See documentations/14-design-decisions.md, "Every HelmRelease
  # sets upgrade.remediation.retries".
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    githubConfigUrl: https://github.com/Eliorion/asp
    githubConfigSecret: arc-github-pat
    # `runs-on: self-hosted-arc` in workflow files targets this scale set.
    runnerScaleSetName: self-hosted-arc
    # 5 warm runners kept for fast PR feedback, so this pool never scales to
    # zero — that is ~15Gi permanently reserved on the 50Gi/3-node cluster,
    # shared with the self-hosted-arc-xl pool (release-xl.yaml).
    minRunners: 5
    maxRunners: 25
    # containerMode: dind removed — the auto-injected dind sidecar accepts no
    # extra dockerd flags, so the template below reproduces it manually and
    # adds --insecure-registry for the HTTP-only Nexus docker connectors.
    template:
      spec:
        initContainers:
          # Copies runner externals where the dind container expects them
          # (the chart's containerMode:dind injected this automatically).
          - name: init-dind-externals
            # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
            image: ghcr.io/actions/actions-runner:2.336.0
            command:
              ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          # Native sidecar (restartPolicy: Always on an initContainer).
          - name: dind
            image: docker:dind
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
              # Nexus docker connectors are plain HTTP (no TLS yet).
              - --insecure-registry=nexus.nexus.svc:5000
              - --insecure-registry=nexus.nexus.svc:5001
              - --insecure-registry=nexus.nexus.svc:5002
              - --insecure-registry=nexus.nexus.svc.cluster.local:5000
              - --insecure-registry=nexus.nexus.svc.cluster.local:5001
              - --insecure-registry=nexus.nexus.svc.cluster.local:5002
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command: ["docker", "info"]
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 2
            # Memory bound so a runaway build can't consume a whole node and
            # OOM-evict a co-located self-hosted-arc-xl e2e pod (6Gi is generous
            # for single-service image builds). Deliberately NO cpu limit — CPU
            # is compressible and these builds are short, so keep PR feedback fast.
            resources:
              requests:
                memory: 1Gi
              limits:
                memory: 6Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
            image: ghcr.io/actions/actions-runner:2.336.0
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
            resources:
              requests:
                memory: 2Gi
              limits:
                memory: 4Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
        volumes:
          - name: work
            emptyDir: {}
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
