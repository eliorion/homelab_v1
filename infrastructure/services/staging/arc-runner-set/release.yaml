apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-asp
  namespace: flux-system
spec:
  targetNamespace: arc-runners
  releaseName: arc-runner-set-asp
  interval: 30m
  chart:
    spec:
      # Must stay in lockstep with the gha-runner-scale-set-controller chart
      # version in infrastructure/controllers/base/arc/release.yaml.
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system
      interval: 12h
  # retries defaults to 0, which latches the release Stalled after ONE failed
  # upgrade and leaves it unremediated. Keep it set (documentations/14).
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    githubConfigUrl: https://github.com/Eliorion/asp
    githubConfigSecret: arc-github-pat
    # `runs-on: self-hosted-arc` in workflow files targets this scale set.
    runnerScaleSetName: self-hosted-arc
    minRunners: 5
    maxRunners: 25
    # Manual dind template, NOT containerMode: dind — that one accepts no extra
    # dockerd flags, so it cannot pass --insecure-registry (see README).
    template:
      spec:
        initContainers:
          # Copies runner externals where the dind container expects them.
          - name: init-dind-externals
            # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
            image: ghcr.io/actions/actions-runner:2.336.0
            command:
              ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          # Native sidecar (restartPolicy: Always on an initContainer).
          - name: dind
            image: docker:dind
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
              # Nexus docker connectors are plain HTTP (no TLS yet).
              - --insecure-registry=nexus.nexus.svc:5000
              - --insecure-registry=nexus.nexus.svc:5001
              - --insecure-registry=nexus.nexus.svc:5002
              - --insecure-registry=nexus.nexus.svc.cluster.local:5000
              - --insecure-registry=nexus.nexus.svc.cluster.local:5001
              - --insecure-registry=nexus.nexus.svc.cluster.local:5002
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command: ["docker", "info"]
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 2
            # Memory bound, deliberately NO cpu limit (see README).
            resources:
              requests:
                memory: 1Gi
              limits:
                memory: 6Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
            image: ghcr.io/actions/actions-runner:2.336.0
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
            resources:
              requests:
                memory: 2Gi
              limits:
                memory: 4Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
        # sizeLimit is a RUNAWAY GUARD, not a quota. An unbounded emptyDir on a
        # dind runner can fill /var, which is also etcd's disk. See README.md.
        volumes:
          - name: work
            emptyDir:
              sizeLimit: 25Gi
          - name: dind-sock
            emptyDir:
              sizeLimit: 1Gi
          - name: dind-externals
            emptyDir:
              sizeLimit: 2Gi
