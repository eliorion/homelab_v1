apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-asp
  namespace: flux-system
spec:
  targetNamespace: arc-runners
  releaseName: arc-runner-set-asp
  interval: 30m
  chart:
    spec:
      # Must stay in lockstep with the gha-runner-scale-set-controller chart
      # version in infrastructure/controllers/base/arc/release.yaml.
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system
      interval: 12h
  # retries defaults to 0, which latches the release Stalled after ONE failed
  # upgrade and leaves it unremediated. Keep it set (documentations/14).
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    githubConfigUrl: https://github.com/Eliorion/asp
    githubConfigSecret: arc-github-pat
    # `runs-on: self-hosted-arc` in workflow files targets this scale set.
    runnerScaleSetName: self-hosted-arc
    minRunners: 5
    maxRunners: 16
    # Custom pod template, no Docker daemon: a job only runs `dagger call`, which drives the
    # in-cluster engine over tcp:// (infrastructure/services/base/dagger). Anything that needs
    # a daemon (fork PRs' ephemeral engine, the k3d break-glass e2e) runs on GitHub-hosted
    # runners instead. See README.
    template:
      spec:
        # ScheduleAnyway: a full node must never block a CI job.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: self-hosted-arc
        # The runner image's user is the NAME `runner`, which the kubelet cannot check against
        # runAsNonRoot -- it needs the uid. fsGroup gives that uid the work emptyDir.
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
        containers:
          - name: runner
            # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
            image: ghcr.io/actions/actions-runner:2.338.1
            command: ["/home/runner/run.sh"]
            env:
              # Dagger CLI telemetry to the in-cluster collector. LOGS needs its own full URL: the base endpoint alone does not enable logs.
              - name: OTEL_EXPORTER_OTLP_PROTOCOL
                value: http/protobuf
              - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                value: http://alloy-receiver.monitoring.svc.cluster.local:4318/v1/traces
              - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
                value: http://alloy-receiver.monitoring.svc.cluster.local:4318/v1/logs
              - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
                value: http://alloy-receiver.monitoring.svc.cluster.local:4318/v1/metrics
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            # Request sized to the measured working set (7d: idle 265-323Mi, p99 peak 441Mi,
            # max 1046Mi), so five warm runners reserve 1.25Gi instead of 2.5Gi. The limit is
            # the headroom for a gitleaks scan of full history.
            resources:
              requests:
                memory: 256Mi
              limits:
                memory: 4Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
        volumes:
          - name: work
            emptyDir: {}
