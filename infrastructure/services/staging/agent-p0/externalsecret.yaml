# A FRESH `claude setup-token`, written by hand to OpenBao kv/agent-p0/claude-subscription
# (property CLAUDE_CODE_OAUTH_TOKEN). Never Paperclip's token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-subscription
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: claude-subscription
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: agent-p0/claude-subscription
