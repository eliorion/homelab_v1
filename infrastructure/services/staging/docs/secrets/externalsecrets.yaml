# A fine-grained, READ-ONLY token on Eliorion/asp (Contents + Pull requests: read): the preview lists
# open PRs through the API and fetches their docs over HTTPS. Deliberately not a reused token: the
# existing ones (ARC runners, Renovate) can write or administer, and this pod's dev server is on the
# tailnet. The chart reads key `token` of Secret docs-preview-github.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-preview-github
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: docs-preview-github
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: docs/docs-preview-github
