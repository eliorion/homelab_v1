# The GitHub token, in docs only (OpenBao lets this namespace read kv/docs/*), and the SOPS-encrypted
# read-only deploy key the pod uses while the token is not seeded: ../../../base/docs/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: docs
components:
  - ../../../base/openbao/consumer
resources:
  - externalsecrets.yaml
  - docs-preview-deploy-key.enc.yaml
