# MLflow's own login comes from CNPG (mlops-db-app); OpenBao holds what CNPG cannot generate.
# admin-password seeds MLflow's FIRST start only; flask-secret-key signs CSRF tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mlflow-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: mlops/mlflow-auth
---
# The dagster role: CNPG reads username/password, the dagster chart postgresql-password. The run pods
# read it too (DAGSTER_PG_PASSWORD: a run pod writes its events to Dagster's storage); they execute in
# this namespace (asp docs/27 D2), so the Secret is not reflected anywhere.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-dagster-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mlops-dagster-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: dagster
        password: "{{ .password }}"
        postgresql-password: "{{ .password }}"
  dataFrom:
    - extract:
        key: mlops/dagster-db
---
# The dev lane's MLflow login (user `notebook`, asp docs/27 P2): the dev location's run pods and
# `mise run notebook` in the asp devcontainer read it. Created once by the MLflow admin:
# ../../../base/mlops/README.md. The keys are the environment variables the MLflow client reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-mlflow-notebook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mlops-mlflow-notebook
    creationPolicy: Owner
    template:
      data:
        MLFLOW_TRACKING_USERNAME: notebook
        MLFLOW_TRACKING_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: mlops/mlflow-notebook
---
# ml_ro, the ML platform's ONE reader (asp docs/27 D10, owner 2026-10-17): the same role and password on
# every domain database (fbref, asp, advisor), so a run pod has one set of PG* variables. Born here, in
# the namespace that uses it, and reflected to each database namespace, where CNPG sets the role's
# password from it (managed role ml_ro, passwordSecret ml-ro, in each cluster's database.yaml).
# Seed: bao kv put kv/mlops/ml-ro password=<openssl rand -hex 24>. A new domain database = one more
# namespace in the two lists below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ml-ro
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: ml-ro
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: fbref,asp,advisor
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: fbref,asp,advisor
      data:
        username: ml_ro
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: mlops/ml-ro
---
# The marimo notebook's access token (asp docs/27 P11): the in-cluster `marimo edit` asks for it before
# opening a session, on top of the tailnet. Seed: ../../../base/mlops/README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-marimo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mlops-marimo
    creationPolicy: Owner
    template:
      data:
        token: "{{ .token }}"
  dataFrom:
    - extract:
        key: mlops/marimo
