# CNPG manages role `mlflow` from username/password; MLflow reads `uri` (the backend store).
# Hex passwords only: the value is pasted into a URI and an INI file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-mlflow-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mlops-mlflow-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: mlflow
        password: "{{ .password }}"
        uri: "postgresql://mlflow:{{ .password }}@mlops-db-rw:5432/mlflow"
  dataFrom:
    - extract:
        key: mlops/mlflow-db
---
# MLflow's basic-auth app: auth.ini (its own store, mlflow_auth, as role mlflow) and the CSRF key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mlflow-auth
    creationPolicy: Owner
    template:
      data:
        auth.ini: |
          [mlflow]
          default_permission = NO_PERMISSIONS
          database_uri = postgresql://mlflow:{{ .password }}@mlops-db-rw:5432/mlflow_auth
          admin_username = admin
          admin_password = {{ index . "admin-password" }}
          authorization_function = mlflow.server.auth:authenticate_request_basic_auth
        flask-secret-key: '{{ index . "flask-secret-key" }}'
  dataFrom:
    - extract:
        key: mlops/mlflow-db
    - extract:
        key: mlops/mlflow-auth
---
# The dagster owner of mlops-db: CNPG reads username/password, the dagster chart postgresql-password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-dagster-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mlops-dagster-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: dagster
        password: "{{ .password }}"
        postgresql-password: "{{ .password }}"
  dataFrom:
    - extract:
        key: mlops/dagster-db
