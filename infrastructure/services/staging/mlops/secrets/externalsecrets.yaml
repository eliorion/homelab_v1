# MLflow's own login comes from CNPG (mlops-db-app); OpenBao holds what CNPG cannot generate.
# admin-password seeds MLflow's FIRST start only; flask-secret-key signs CSRF tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mlflow-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: mlops/mlflow-auth
---
# The dagster role: CNPG reads username/password, the dagster chart postgresql-password. Reflected into
# every namespace a code location launches runs in (fbref): a run pod writes its events to Dagster's
# storage, with this password (DAGSTER_PG_PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-dagster-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mlops-dagster-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: fbref
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: fbref
      data:
        username: dagster
        password: "{{ .password }}"
        postgresql-password: "{{ .password }}"
  dataFrom:
    - extract:
        key: mlops/dagster-db
