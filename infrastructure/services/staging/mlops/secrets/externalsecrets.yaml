# MLflow's own login comes from CNPG (mlops-db-app), Dagster's from sops (mlops-dagster-db.enc.yaml).
# admin-password seeds MLflow's FIRST start only; flask-secret-key signs CSRF tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mlflow-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: mlops/mlflow-auth
