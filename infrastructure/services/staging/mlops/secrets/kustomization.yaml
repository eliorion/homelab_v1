# The platform's credentials, in mlops only: kv/mlops/mlflow-auth from OpenBao (seed it before the first
# reconcile, ../../../base/mlops/README.md) and Dagster's role from sops.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops
components:
  - ../../../base/openbao/consumer
resources:
  - externalsecrets.yaml
  - mlops-dagster-db.enc.yaml
