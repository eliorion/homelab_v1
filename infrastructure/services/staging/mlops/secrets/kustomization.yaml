# The platform's credentials, in mlops only (OpenBao lets this namespace read kv/mlops/*). Seed them
# before the first reconcile: ../../../base/mlops/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops
components:
  - ../../../base/openbao/consumer
resources:
  - externalsecrets.yaml
  # The marimo notebook's access token (asp docs/27 P11): sops, like the other tailnet UIs' logins.
  - mlops-marimo.enc.yaml
