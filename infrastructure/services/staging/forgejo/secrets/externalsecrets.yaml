# Forgejo's application credentials, from OpenBao kv/forgejo/* (this namespace reads only that).
# Seed them BEFORE the first reconcile: ../../../base/forgejo/README.md.
#
# forgejo-admin: the local admin the chart creates (gitea.admin.existingSecret) and the bootstrap
# sidecar logs in as. passwordMode keepUpdated: a new value here is the account's password on the
# next pod start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: forgejo-admin
    creationPolicy: Owner
    template:
      data:
        username: forgejo-admin
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: forgejo/admin
---
# One 40-hex shared secret per runner (runner-0..runner-3 = the StatefulSet's ordinals). The
# bootstrap sidecar registers each with `forgejo-cli actions register --secret`; runner pod N
# connects with key runner-N. Reflected into forgejo-runners, which has no SecretStore of its own.
# Rotating a value = a new runner identity: delete the old runner in Forgejo's admin UI afterwards.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: forgejo-runner-secrets
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: forgejo-runners
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: forgejo-runners
  dataFrom:
    - extract:
        key: forgejo/runner-secrets
