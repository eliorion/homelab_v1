apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Every manifest names `namespace: mlops` itself (the ai-gateway convention). The role Secrets come
# from OpenBao (../../mlops/secrets).
resources:
  - ../../../base/databases/mlops
  # Barman Cloud -> Garage bucket cnpg-staging-mlops (key imported by garage-config).
  - garage-backup-credentials.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml
patches:
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: mlops-db
