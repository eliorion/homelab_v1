# pgAdmin on the tailnet over HTTPS and NOWHERE ELSE:
# https://pgadmin.tail45b0ca.ts.net
#
# The Service must carry NO tailscale annotations: both mechanisms at once
# register two devices contending for one hostname, and the loser is silently
# suffixed (`pgadmin-1`).
#
# PRECONDITION: HTTPS Certificates enabled in the Tailscale admin console
# (DNS -> HTTPS Certificates), or the proxy comes up with no certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  labels:
    app: pgadmin
    component: dbtools
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: pgadmin
      port:
        number: 80
  tls:
    # The device name. MagicDNS serves it at https://pgadmin.tail45b0ca.ts.net.
    - hosts:
        - pgadmin
