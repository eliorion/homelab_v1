# nao's session-signing key.
#
# Generated once and it MUST stay stable: a new value logs every user out on the
# next rollout. Read it back with:
#   sops -d infrastructure/services/staging/databases/dbtools/nao-secrets.enc.yaml
#
# There is deliberately NO LLM key here — nao authenticates to ai-gateway with
# the AI_GATEWAY_TOKEN Secret that reflector mirrors into this namespace, so the
# gateway credential exists in exactly one place.
