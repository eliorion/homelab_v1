apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: database

resources:
  - ../../../base/databases/dbtools
  # pgAdmin login (server mode) — the email also names the pgpass storage path.
  - pgadmin-admin.enc.yaml
  # nao session-signing key.
  - nao-secrets.enc.yaml
  # nao's OWN ai-gateway virtual key.
  - nao-ai-gateway-token.enc.yaml
  # Tailnet exposure (Tailscale operator), HTTPS on 443 via MagicDNS.
  - pgadmin-ingress-tailscale.yaml
  - nao-ingress-tailscale.yaml

patches:
  # SWITCHED OFF to free memory on staging-controlplane-1 (see README "Switched off").
  # Hibernate dbtools-db (PVCs kept) and scale its only consumers to 0.
  - target:
      kind: Cluster
      name: dbtools-db
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: dbtools-db
        annotations:
          cnpg.io/hibernation: "on"
  - target:
      kind: Deployment
      name: nao
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: pgadmin
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # PVCs on Longhorn (explicit — also the cluster default SC on Talos).
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: dbtools-db
  # Public URL — must match the browser address byte for byte.
  - path: nao-env-patch.yaml
    target:
      kind: Deployment
      name: nao
