# nao on the tailnet, over HTTPS: https://nao.tail45b0ca.ts.net
#
# ONE OF TWO ways in; the other is the Cloudflare tunnel. Add a host HERE and
# you MUST add its origin to BETTER_AUTH_TRUSTED_ORIGINS (nao-env-patch.yaml)
# in the same sitting.
#
# The Service must carry NO tailscale annotations: both mechanisms at once
# register two devices contending for one hostname, and the loser is silently
# suffixed (`nao-1`) — an origin nothing trusts.
#
# PRECONDITION: HTTPS Certificates enabled in the Tailscale admin console
# (DNS -> HTTPS Certificates), or the proxy comes up with no certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nao
  labels:
    app: nao
    component: dbtools
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: nao
      port:
        number: 5005
  tls:
    # The device name. MagicDNS serves it at https://nao.tail45b0ca.ts.net.
    - hosts:
        - nao
