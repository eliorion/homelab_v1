# Environment-specific nao settings. Strategic-merge on env: entries merge by
# `name`, so only the two variables below are replaced. See README.md.
#
# EVERY BROWSER-VISIBLE ADDRESS MUST BE LISTED IN BETTER_AUTH_TRUSTED_ORIGINS.
# better-auth rejects any non-GET from an untrusted Origin with 403
# INVALID_ORIGIN, so a host that is missing here loads its UI and then refuses
# every login. Values are origins — scheme + host, no path, no trailing slash.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nao
spec:
  template:
    spec:
      containers:
        - name: nao
          env:
            - name: BETTER_AUTH_URL
              value: https://nao.eliorion.fr
            # NO SPACE after the comma — see above.
            - name: BETTER_AUTH_TRUSTED_ORIGINS
              value: https://nao.eliorion.fr,https://nao.tail45b0ca.ts.net
