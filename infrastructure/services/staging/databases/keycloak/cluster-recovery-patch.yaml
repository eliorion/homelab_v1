# TEMPORARY -- restores keycloak-db from its Barman object store after the Longhorn
# volumes were lost in the LINSTOR migration. bootstrap is read ONCE, at
# cluster creation, so this is inert on an existing cluster: it only takes
# effect if the Cluster and its PVCs are deleted first. Remove it once the
# restore is verified, so a future rebuild does not silently recover stale
# data instead of initdb-ing a fresh cluster. documentations/17.
- op: replace
  path: /spec/bootstrap
  value:
    recovery:
      source: keycloak-db-backup
- op: add
  path: /spec/externalClusters
  value:
    - name: keycloak-db-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: r2-store
          serverName: keycloak-db
