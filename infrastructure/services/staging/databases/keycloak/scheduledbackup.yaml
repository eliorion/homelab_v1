apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-daily
spec:
  # 6-field CNPG cron. 3:15 UTC, staggered with the other clusters: the four
  # schedules that shared 03:00:00 all froze on 2026-10-21 (CNPG #10562).
  schedule: "0 15 3 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: keycloak-db
