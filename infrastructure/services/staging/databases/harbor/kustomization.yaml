apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: registry

resources:
  - ../../../base/databases/harbor
  - garage-backup-credentials.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml

patches:
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: harbor-db
