apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: harbor-db-daily
  namespace: registry
spec:
  # 6-field CNPG cron. 2:50 UTC, staggered with the other clusters.
  schedule: "0 50 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: harbor-db
