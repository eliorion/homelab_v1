apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ai-gateway-db-daily
  namespace: ai-gateway
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: ai-gateway-db
