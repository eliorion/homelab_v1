apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage-store
  namespace: ai-gateway
spec:
  retentionPolicy: "7d"
  configuration:
    # ai-gateway's OWN bucket + OWN key — do not point at fbref's bucket or reuse
    # its garage-backup-credentials.
    destinationPath: "s3://cnpg-staging-ai-gateway"
    # In-cluster HAProxy gateway -> Tailscale egress -> Garage nodes.
    endpointURL: "http://garage-s3.garage-gw.svc.cluster.local:3900"
    s3Credentials:
      accessKeyId:
        name: ai-gateway-garage-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: ai-gateway-garage-backup-credentials
        key: ACCESS_KEY_SECRET
    wal:
      compression: gzip
      # NO `encryption:` here — Garage has no SSE-S3/AES256 (SSE-C only) and
      # AES256 would fail every upload.
    data:
      compression: gzip
      jobs: 2
  instanceSidecarConfiguration:
    env:
      # LOAD-BEARING: Garage's region is `garage` and only HeadBucket enforces it,
      # so a wrong/absent region kills WAL archiving silently. Keep BOTH names —
      # boto3 reads AWS_REGION, the aws CLI honours AWS_DEFAULT_REGION.
      - name: AWS_REGION
        value: garage
      - name: AWS_DEFAULT_REGION
        value: garage
      # Same boto3 >= 1.36 data-integrity checksum workaround fbref-db and the R2
      # clusters carry (plugin-barman-cloud #411) — harmless if Garage accepts them.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
