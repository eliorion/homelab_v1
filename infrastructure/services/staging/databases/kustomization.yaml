apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CNPG clusters and their backup wiring for infrastructure/services workloads
# with their own database. See ../../base/databases/README.md.
resources:
  - keycloak/
  - ai-gateway/
  - dbtools/
  - harbor/
  - mlops/

# Same rules as apps/staging/databases; mlops-db keeps the resources in its base.
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: any
      spec:
        failoverDelay: 30
        affinity:
          podAntiAffinityType: required
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: keycloak-db}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "128Mi"}, "limits": {"memory": "512Mi"}}}]'
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: ai-gateway-db}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "256Mi"}, "limits": {"memory": "1Gi"}}}]'
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: dbtools-db}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "128Mi"}, "limits": {"memory": "512Mi"}}}]'
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: harbor-db}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "256Mi"}, "limits": {"memory": "1Gi"}}}]'
