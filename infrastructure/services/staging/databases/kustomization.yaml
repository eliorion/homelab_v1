apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CNPG clusters and their secrets/backups for every infrastructure/services
# workload with its own database. Mirrors apps/staging/databases/ — same
# reason: every db lives together instead of scattered one-per-service, so
# adding a database is "new dir here" everywhere in the repo, not a rule
# that's different for apps/ vs infra/services/.
resources:
  - keycloak/
  - ai-gateway/
  # The whole `database` namespace: the dbtools-db cluster (pgAdmin's config
  # database + nao's users/sessions/chat history) AND the two tools that live
  # off it. The workload here IS database tooling, so it is not split a tier up
  # the way keycloak's and ai-gateway's are.
  - dbtools/
