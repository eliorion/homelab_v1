apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
spec:
  # -v1: a fresh cluster. A cluster RECOVERED from this archive must archive under a new
  # serverName (-v2), as keycloak-db does: CNPG refuses a recovered cluster that would write
  # into the prefix it restored from.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-store
        serverName: forgejo-db-v1
