apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgejo

resources:
  - ../../../base/databases/forgejo
  - r2-backup-credentials.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml

patches:
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: forgejo-db
