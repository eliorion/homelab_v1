# One-off: the first backup of openbao-db holding OpenBao's data (the daily one follows at 03:50).
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: openbao-db-post-switchover
  namespace: openbao
spec:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: openbao-db
