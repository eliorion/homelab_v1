# The Claude subscription token the broker injects into an agent process (asp docs/22 §4).
# Written by hand to OpenBao kv/agent-platform/claude-subscription, property
# CLAUDE_CODE_OAUTH_TOKEN: a `claude setup-token`, never Paperclip's. Only the broker mounts it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-subscription
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: claude-subscription
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: agent-platform/claude-subscription
