apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: r2-store
spec:
  retentionPolicy: "7d"
  configuration:
    # Keycloak's OWN bucket, not asp's, so the token in r2-backup-credentials
    # can be scoped to Object Read & Write on this bucket alone. Sharing asp's
    # bucket would mean a credential in the `identity` namespace that can also
    # rewrite the asp archive — which is the archive you would be restoring
    # from on the day you needed both. fbref keeps its own bucket for the same
    # reason (it just points at Garage rather than R2).
    destinationPath: "s3://cnpg-staging-keycloak"
    endpointURL: "https://07e577de68147de704bb467debe46e21.r2.cloudflarestorage.com"
    s3Credentials:
      accessKeyId:
        name: r2-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: r2-backup-credentials
        key: ACCESS_KEY_SECRET
    wal:
      compression: gzip
      encryption: AES256
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
  instanceSidecarConfiguration:
    # Required for Cloudflare R2: boto3 >= 1.36 sends data-integrity checksums
    # that R2 rejects (XAmzContentSHA256Mismatch). These restore compatibility
    # for both backup and restore. See plugin-barman-cloud issue #411.
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
