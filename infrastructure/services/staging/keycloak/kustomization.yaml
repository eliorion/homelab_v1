apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
# Do NOT list realm/ here — it is applied by its own Flux Kustomization
# (`infra-keycloak-realm`, force: true + wait: true) because the import is an
# immutable Job; a second owner without force would fight it.
# keycloak-db lives in ../databases/keycloak/.
resources:
  - ../../base/keycloak/
