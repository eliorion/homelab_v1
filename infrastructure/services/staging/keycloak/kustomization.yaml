apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
resources:
  - ../../base/keycloak/
  - database/r2-backup-credentials.enc.yaml
  - database/objectstore.yaml
  - database/scheduledbackup.yaml
# `app/` (the sops keycloak-secret) is gone: the operator generates the
# bootstrap admin into `keycloak-initial-admin` itself, so that Secret held a
# credential nothing read, in the KC_BOOTSTRAP_ADMIN_* key spellings only the
# retired StatefulSet understood.
patches:
  - path: database/cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: keycloak-db
