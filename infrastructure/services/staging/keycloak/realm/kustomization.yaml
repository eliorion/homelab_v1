apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
# Applied by its OWN Flux Kustomization (`infra-keycloak-realm`, force: true +
# wait: true), never by the parent — see ../kustomization.yaml.
resources:
  - ../../../base/keycloak/realm/
  # The Cloudflare Access client secret + Zero Trust team domain, read by the
  # import Job as $(env:...). Same Kustomization as the Job, so it exists first.
  - cloudflare-access-client.enc.yaml
