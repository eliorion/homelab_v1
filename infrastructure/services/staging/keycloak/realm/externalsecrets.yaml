---
# Forgejo's OAuth2 source reads `key` + `secret`; the import Job reads `client-secret`. One OpenBao
# value, the three keys. Reflected to `forgejo` (infrastructure/services/base/forgejo/release.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oidc-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: forgejo-oidc-client
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: forgejo
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: forgejo
      data:
        client-secret: "{{ index . \"client-secret\" }}"
        key: forgejo
        secret: "{{ index . \"client-secret\" }}"
  dataFrom:
    - extract:
        key: identity/forgejo-oidc-client
