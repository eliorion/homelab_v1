global
  log stdout format raw local0 info
  maxconn 4096

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 1m
  timeout server 1m

# Re-resolve backend DNS via cluster DNS so a Tailscale egress proxy-pod restart
# (new pod IP behind the ExternalName) is picked up without a HAProxy restart.
resolvers kube
  nameserver dns1 10.96.0.10:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s
  hold nx 5s

# S3 traffic in -> load-balanced across the Garage nodes.
frontend s3_in
  bind :3900
  default_backend garage_s3

backend garage_s3
  balance roundrobin
  # Backends are the Tailscale operator EGRESS Services (ExternalName -> operator
  # proxy pod -> tailnet -> Garage node), defined in
  # infrastructure/controllers/staging/tailscale-operator/egress-proxies.yaml.
  # HAProxy is NOT a tailnet member, so it must reach Garage THROUGH these, never
  # the raw 100.x. node-b stays DOWN until it joins the tailnet -- HAProxy marks it
  # up automatically.
  # HTTP check, NOT a TCP connect: the egress proxy in front of a node accepts a TCP
  # connection even when the node behind it is hung, so a TCP check never marks a
  # hung node down (2026-10-19: node-a hung, a third of requests waited out the 1m
  # timeout). Any status in 3s counts as alive; NOT /health, which can answer 503 for
  # a cluster-wide quorum problem and would then mark every node down at once.
  option httpchk GET /
  http-check expect rstatus ^[2-5]
  timeout check 3s
  default-server check inter 5s fall 2 rise 2 resolvers kube init-addr last,none
  server node-a garage-node-a.tailscale.svc.cluster.local:3900
  server node-b garage-node-b.tailscale.svc.cluster.local:3900
  server node-c garage-node-c.tailscale.svc.cluster.local:3900

# Human-facing health + stats (NOT used by the k8s probes). /stats shows which
# Garage egress backends are currently up/down.
frontend health
  mode http
  bind :8404
  monitor-uri /healthz
  stats enable
  stats uri /stats
  stats refresh 10s
  # Per-backend/per-server state for Prometheus (PodMonitor garage-gateway).
  http-request use-service prometheus-exporter if { path /metrics }

# Garage admin API (bucket/key management and /metrics). Same three backends, port 3903.
# Only the garage-config Job uses this frontend; Prometheus scrapes each node directly
# because /metrics is per node.
frontend admin_in
  bind :3903
  default_backend garage_admin

backend garage_admin
  balance roundrobin
  # Same liveness check as garage_s3, against the admin port.
  option httpchk GET /
  http-check expect rstatus ^[2-5]
  timeout check 3s
  default-server check inter 5s fall 2 rise 2 resolvers kube init-addr last,none
  server node-a garage-node-a.tailscale.svc.cluster.local:3903
  server node-b garage-node-b.tailscale.svc.cluster.local:3903
  server node-c garage-node-c.tailscale.svc.cluster.local:3903
