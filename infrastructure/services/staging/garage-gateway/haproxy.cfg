global
  log stdout format raw local0 info
  maxconn 4096

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 1m
  timeout server 1m

# S3 traffic in -> load-balanced across the Garage nodes.
frontend s3_in
  bind :3900
  default_backend garage_s3

backend garage_s3
  balance roundrobin
  # TCP connect check on the S3 port itself. Garage's admin API (:3903 /health)
  # is often localhost-bound, so we deliberately do NOT depend on it. node-b is
  # expected DOWN until it joins the tailnet -- HAProxy marks it up on its own.
  # If you later expose the admin API on the tailnet, swap to quorum-aware
  # health with:  option httpchk GET /health / http-check expect status 200 /
  # default-server check port 3903 ...
  default-server check inter 3s fall 3 rise 2
  server node-a 100.122.58.119:3900
  server node-b 100.122.210.124:3900
  server node-c 100.92.142.13:3900

# Human-facing health + stats (NOT used by the k8s probes). /stats shows which
# Garage nodes are currently up/down.
frontend health
  mode http
  bind :8404
  monitor-uri /healthz
  stats enable
  stats uri /stats
  stats refresh 10s
