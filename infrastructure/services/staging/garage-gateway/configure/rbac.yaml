apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-config
  namespace: garage-gw
---
# Read ONE Secret in etcd-backup: the key for bucket homelab-staging-etcd-backup.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-config-read-key
  namespace: etcd-backup
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["etcd-backup-s3"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-config-read-key
  namespace: etcd-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-config-read-key
subjects:
  - kind: ServiceAccount
    name: garage-config
    namespace: garage-gw
---
