apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here: rbac.yaml places one Role in each consumer namespace.
resources:
  - rbac.yaml
  - job.yaml
# Do NOT disable the name hash suffix: a script or bucket-list change renames the ConfigMap,
# which changes the Job spec, which is what makes Flux (force: true) re-run it.
configMapGenerator:
  - name: garage-config-script
    namespace: garage-gw
    files:
      - configure.py
      - buckets.txt
