# The scoped Garage admin token the garage-config Job uses (ListBuckets, ListKeys, CreateBucket,
# ImportKey, AllowBucketKey; nothing that deletes). Seed: bao kv put kv/garage-gw/bucket-manager token=<secret>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-bucket-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: garage-bucket-manager
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: garage-gw/bucket-manager
