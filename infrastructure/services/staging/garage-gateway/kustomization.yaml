apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: garage-gw
resources:
  - ../../base/garage-gateway
# Hashed, so a haproxy.cfg change rolls the Deployment. The name must match the
# Deployment's volume reference. See ../../base/garage-gateway/README.md.
configMapGenerator:
  - name: garage-haproxy-config
    files:
      - haproxy.cfg
