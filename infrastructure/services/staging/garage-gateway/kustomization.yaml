apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: garage-gw
resources:
  - ../../base/garage-gateway
# Generated (hashed) so a haproxy.cfg change rolls the Deployment automatically.
# The 3 Garage node IPs are environment-specific, hence the config lives here in
# the staging overlay rather than in base.
configMapGenerator:
  - name: garage-haproxy-config
    files:
      - haproxy.cfg
