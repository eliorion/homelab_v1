# TEMPORARY — seed-from-staging only. Remove after the prod keycloak-db is seeded
# and verified (plan Step 6). CNPG honors a bootstrap stanza ONLY at first cluster
# creation, so this must be present before the prod cluster exists, and is inert after.
- op: replace
  path: /spec/bootstrap
  value:
    recovery:
      source: keycloak-db-staging
- op: add
  path: /spec/externalClusters
  value:
    - name: keycloak-db-staging
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: r2-store-staging
          serverName: keycloak-db
