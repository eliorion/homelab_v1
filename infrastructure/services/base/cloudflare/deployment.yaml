apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  selector:
    matchLabels:
      infrastructure: cloudflared
  replicas: 2
  template:
    metadata:
      labels:
        infrastructure: cloudflared
    spec:
      containers:
        - name: cloudflared
          # renovate: datasource=docker depName=cloudflare/cloudflared
          image: cloudflare/cloudflared:2026.10.7
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-credentials
                  key: token
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            # TCP, not QUIC (the default): QUIC streams were cancelled mid-request ("Incoming request
            # ended abruptly: context canceled", 18 in 24 h on 2026-10-29), which broke video uploads
            # to the feedback board and some Scout requests.
            - --protocol
            - http2
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          livenessProbe:
            httpGet:
              # /ready is 200 only while connected to the edge; port = --metrics port.
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
