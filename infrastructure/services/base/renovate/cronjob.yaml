apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "@hourly"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Drop a finished run after a day. A failed Job is otherwise kept until a
      # newer failure displaces it (failedJobsHistoryLimit), and KubeJobFailed
      # fires for as long as it exists: failures from August 2026 were still
      # alerting weeks later, after every run since had succeeded. A day is long enough
      # for the 15m alert to fire and be read; a repeat failure re-fires it.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          containers:
            - name: renovate
              # renovate: datasource=docker depName=renovate/renovate
              image: renovate/renovate:43.265.3
              args:
                - eliorion/homelab_v1

              envFrom:
                - secretRef:
                    name: renovate-container-env
                - configMapRef:
                    name: renovate-configmap

          restartPolicy: Never
