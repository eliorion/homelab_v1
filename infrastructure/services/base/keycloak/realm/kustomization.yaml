apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - job.yaml

# Do NOT disable the name hash suffix: it changes the ConfigMap name when a realm
# file changes, which changes the Job spec, which is what makes Flux (force: true)
# recreate the Job and re-run the import. Without it realm edits apply to nothing.
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-mcp.yaml
      - realm-master.yaml
      - realm-apps.yaml
