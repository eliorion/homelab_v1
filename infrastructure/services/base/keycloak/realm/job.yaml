# Applies realm-mcp.yaml to the running Keycloak.
#
# keycloak-config-cli rather than the operator's KeycloakRealmImport CR: the
# import CR is create-oriented, so realm UPDATES are effectively ignored and
# every change would mean deleting and re-importing the realm. The DCR policies
# and client scopes here will be tuned repeatedly while onboarding connectors,
# which is exactly the case the import CR handles worst. config-cli diffs and
# applies only what changed, with no Keycloak restart.
#
# The Job is immutable, so its own Flux Kustomization carries `force: true`
# (clusters/staging/infrastructure.yaml, `infra-keycloak-realm`) — the same
# recipe the db-migrations Flyway Job uses. A realm edit therefore deletes and
# recreates this Job, which is what makes it re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-config
  labels:
    app: keycloak
spec:
  backoffLimit: 5
  # Keep a finished Job around for a day so its logs are readable after a
  # reconcile; Flux recreates it on the next change regardless.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: keycloak
        component: realm-config
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config-cli
          # No build exists for Keycloak 26.6+ — the newest version-specific tag
          # is 6.5.1-26.5.5 — so this is the floating 26.x tag. The admin REST
          # API is stable within a major, but this IS a version skew: if the
          # realm pipeline starts failing after a Keycloak bump, look here first.
          image: adorsys/keycloak-config-cli:6.5.1-26
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # In-cluster, over the HTTPS listener. Reaching it from this
            # namespace is allowed by spec.networkPolicy.https on the Keycloak
            # CR; nothing else in the cluster can.
            - name: KEYCLOAK_URL
              value: https://keycloak-service:8443
            # The certificate is signed by the private CA in
            # app/certificate.yaml, which this image has no way to trust without
            # building a Java truststore. The hop is encrypted but not
            # authenticated — acceptable for a pod-to-pod call inside a
            # namespace only this Job and the tunnel can enter.
            - name: KEYCLOAK_SSLVERIFY
              value: "false"
            # Generated by the operator because the Keycloak CR sets no
            # bootstrapAdmin. No admin credential exists in git.
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: username
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: password
            # Flux runs this the moment the manifests land, which can be before
            # Keycloak finishes starting. Wait rather than fail.
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 300s
            # Every realm file. A glob would also work, but naming them means a
            # file added to the ConfigMap and forgotten here fails loudly rather
            # than being silently imported.
            - name: IMPORT_FILES_LOCATIONS
              value: /config/realm-mcp.yaml,/config/realm-master.yaml,/config/realm-apps.yaml
            # OFF BY DEFAULT in keycloak-config-cli, and realm-apps.yaml does not
            # work without it: the Cloudflare Access client's secret and callback
            # URL arrive as $(env:...) references so that neither a credential
            # nor an account-specific hostname is baked into a base manifest.
            # With substitution disabled the literal string `$(env:...)` is
            # imported as the secret and every token exchange fails.
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            # The Cloudflare Access client credential, generated once and held in
            # staging/keycloak/realm/cloudflare-access.enc.yaml. It is declared in
            # the realm rather than generated by Keycloak so that re-running this
            # import cannot rotate it out from under the Cloudflare side.
            - name: CF_ACCESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudflare-access-client
                  key: client-secret
            # The Zero Trust team domain (https://<team-name>.cloudflareaccess.com),
            # which is the host half of the ONE redirect URI Access ever calls
            # back on. Not a secret — it is in the browser's address bar during
            # every login — but it is account-specific, so it lives in the same
            # Secret rather than in this base file.
            - name: CF_ACCESS_TEAM_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-access-client
                  key: team-domain
            # ADD AND UPDATE, NEVER DELETE, for components. Full management
            # would treat every client-registration policy absent from the file
            # as one to remove — including defaults Keycloak relies on, and any
            # policy a later Keycloak version introduces.
            - name: IMPORT_MANAGED_COMPONENT
              value: no-delete
            # Same reasoning for the objects a live realm accumulates outside
            # this file: clients arrive by dynamic registration, and
            # sub-components hang off the ones above.
            - name: IMPORT_MANAGED_CLIENT
              value: no-delete
            - name: IMPORT_MANAGED_SUBCOMPONENT
              value: no-delete
            # THE MOST IMPORTANT LINE IN THIS FILE. Users are created in the
            # admin console, not in realm-mcp.yaml, so the default (full
            # management) would delete every account on the next import —
            # every account, since the file declares none. That is a silent
            # total lockout triggered by an unrelated realm edit.
            - name: IMPORT_MANAGED_USER
              value: no-delete
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75
          volumeMounts:
            - name: realm
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: tmp
          emptyDir: {}
