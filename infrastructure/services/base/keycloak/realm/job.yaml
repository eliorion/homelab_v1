# Applies the realm files to the running Keycloak with keycloak-config-cli.
#
# A Job is immutable, so this is applied by its own Flux Kustomization
# (`infra-keycloak-realm`, force: true) — the delete+recreate is what re-runs it.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-config
  labels:
    app: keycloak
spec:
  backoffLimit: 5
  # Keep a finished Job for a day so its logs stay readable.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: keycloak
        component: realm-config
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config-cli
          # Floating 26.x tag: no build exists for Keycloak 26.6+ (newest
          # version-specific tag is 6.5.1-26.5.5). This IS a version skew — if the
          # realm pipeline breaks after a Keycloak bump, look here first.
          image: adorsys/keycloak-config-cli:6.5.1-26
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # The in-cluster HTTPS listener, allowed by spec.networkPolicy.https.
            - name: KEYCLOAK_URL
              value: https://keycloak-service:8443
            # The serving cert is signed by the private CA in app/certificate.yaml,
            # which this image cannot trust without a Java truststore.
            - name: KEYCLOAK_SSLVERIFY
              value: "false"
            # Operator-generated, because the Keycloak CR sets no bootstrapAdmin.
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: username
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: password
            # Flux can run this before Keycloak has finished starting; wait rather than fail.
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 300s
            # Must name every file in the keycloak-realm ConfigMap; unlisted files
            # are silently not imported.
            - name: IMPORT_FILES_LOCATIONS
              value: /config/realm-mcp.yaml,/config/realm-master.yaml,/config/realm-apps.yaml
            # OFF BY DEFAULT in keycloak-config-cli. Without it the literal string
            # `$(env:...)` is imported into realm-apps.yaml as the client secret
            # and every Cloudflare Access token exchange fails.
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            # The applications realm NAME, per environment (staging:
            # `staging-apps`). Substituted into realm-apps.yaml's `realm:` key.
            # Changing it does NOT rename the live realm — config-cli creates
            # the new one and leaves the old, users and all, behind.
            - name: APPS_REALM
              valueFrom:
                configMapKeyRef:
                  name: keycloak-realm-vars
                  key: APPS_REALM
            # Substituted into realm-apps.yaml; from the sops Secret
            # cloudflare-access-client in staging/keycloak/realm/.
            - name: CF_ACCESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudflare-access-client
                  key: client-secret
            - name: CF_ACCESS_TEAM_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-access-client
                  key: team-domain
            # Substituted into realm-apps.yaml; the same Secret is mirrored into
            # the `nextcloud` namespace by reflector, so both ends of the OIDC
            # client read one value.
            - name: NEXTCLOUD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-oidc-client
                  key: client-secret
            # no-delete everywhere: the default (full management) deletes every
            # live object the realm files do not declare.
            - name: IMPORT_MANAGED_COMPONENT
              value: no-delete
            - name: IMPORT_MANAGED_CLIENT
              value: no-delete
            - name: IMPORT_MANAGED_SUBCOMPONENT
              value: no-delete
            # Same reasoning as USER below: realm-apps.yaml declares the two
            # nextcloud-* groups, and full management would delete any group
            # added by hand in the admin console on the next import.
            - name: IMPORT_MANAGED_GROUP
              value: no-delete
            # THE MOST IMPORTANT LINE IN THIS FILE. The realm files declare no
            # users, so full management would delete EVERY account on the next
            # import — a silent total lockout from an unrelated realm edit.
            - name: IMPORT_MANAGED_USER
              value: no-delete
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75
          volumeMounts:
            - name: realm
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: tmp
          emptyDir: {}
