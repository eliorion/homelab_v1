# The Keycloak CR has no PDB field, so this is hand-written.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
spec:
  minAvailable: 1
  selector:
    matchLabels:
      # The labels the operator puts on its pods — must match or this selects nothing.
      app: keycloak
      app.kubernetes.io/managed-by: keycloak-operator
