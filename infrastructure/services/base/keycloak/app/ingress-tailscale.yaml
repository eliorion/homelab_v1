# The admin console, published on the tailnet and nowhere else, over HTTPS.
#
# Do NOT swap this for the `tailscale.com/expose` annotation: expose is an L3
# forward and would serve the console as plain http on :8080.
# PRECONDITION: HTTPS Certificates must be enabled in the Tailscale admin console
# (DNS → HTTPS Certificates), or the proxy comes up with no certificate — see
# infrastructure/controllers/staging/tailscale-operator/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-admin
  labels:
    app: keycloak
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: keycloak-service
      port:
        number: 8080
  tls:
    # The device name. MagicDNS serves it at
    # https://keycloak-admin.tail45b0ca.ts.net — the exact string
    # spec.hostname.admin is set to; a mismatch breaks every console redirect.
    - hosts:
        - keycloak-admin
