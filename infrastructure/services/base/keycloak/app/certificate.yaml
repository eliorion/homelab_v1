# Internal TLS for the Keycloak pods: a private CA scoped to this namespace.
# Namespaced Issuers, NOT ClusterIssuers — this CA signs for `identity` only.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: keycloak-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-ca
spec:
  isCA: true
  commonName: keycloak-ca
  secretName: keycloak-ca
  duration: 87600h # 10y
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: keycloak-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: keycloak-ca
spec:
  ca:
    secretName: keycloak-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
spec:
  # Consumed by the Keycloak CR as spec.http.tlsSecret.
  secretName: keycloak-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    # The Service the operator generates is <CR name>-service — must match.
    - keycloak-service
    - keycloak-service.identity
    - keycloak-service.identity.svc
    - keycloak-service.identity.svc.cluster.local
  issuerRef:
    name: keycloak-ca
    kind: Issuer
