apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  instances: 2

  # Do NOT set `image`: it flips the operator into --optimized mode and decouples
  # the server version from the operator. Version knob: scripts/fetch-keycloak-operator.

  db:
    vendor: postgres
    host: keycloak-db-rw
    database: keycloak
    # Generated by CNPG from the keycloak-db Cluster; no credential is in git.
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password

  # Do NOT set `bootstrapAdmin`: the operator generates one into the Secret
  # `keycloak-initial-admin`, which is what the realm import Job authenticates with.

  http:
    # Serving cert from app/certificate.yaml.
    tlsSecret: keycloak-tls
    # Plain HTTP listener for ONE caller, the Tailscale admin proxy; fenced by
    # networkPolicy.http below.
    httpEnabled: true

  hostname:
    # The public issuer; fbref-mcp verifies this `iss` by exact string.
    hostname: https://staging-keycloak.eliorion.fr
    # Must stay identical to realm-master.yaml's frontendUrl and to the
    # `keycloak-admin` device name in ingress-tailscale.yaml — change one, change all.
    # This restricts NOTHING: the admin REST API stays reachable via the public
    # hostname. /admin is kept off the internet by Cloudflare tunnel path rules +
    # a WAF rule — see infrastructure/services/staging/cloudflare/README.md.
    admin: https://keycloak-admin.tail45b0ca.ts.net
    # Refuse to derive the hostname from request headers.
    strict: true

  proxy:
    headers: xforwarded

  ingress:
    # The operator creates an Ingress for `hostname` by default; nothing serves it here.
    enabled: false

  networkPolicy:
    enabled: true
    # HTTPS: the Cloudflare tunnel and the in-namespace realm import Job.
    https:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: cloudflare
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: identity
    # HTTP: only the Tailscale proxy fronting the admin console.
    http:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: tailscale
    # `management` (health + metrics) stays unrestricted: the kubelet probes it
    # from the node, which is not a pod and would be dropped by a namespaceSelector.

  additionalOptions:
    # Return 503 under overload instead of queueing without bound.
    - name: http-max-queued-requests
      value: "1000"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
