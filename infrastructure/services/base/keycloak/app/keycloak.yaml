apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  instances: 2

  # Do NOT set `image`: it flips the operator into --optimized mode and decouples
  # the server version from the operator. Version knob: scripts/fetch-keycloak-operator.

  db:
    vendor: postgres
    host: keycloak-db-rw
    database: keycloak
    # Generated by CNPG from the keycloak-db Cluster; no credential is in git.
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password

  # Do NOT set `bootstrapAdmin`: the operator generates one into the Secret
  # `keycloak-initial-admin`, which is what the realm import Job authenticates with.

  http:
    # Serving cert from app/certificate.yaml.
    tlsSecret: keycloak-tls
    # Plain HTTP listener for ONE caller, the Tailscale admin proxy; fenced by
    # networkPolicy.http below.
    httpEnabled: true

  hostname:
    # The public issuer; fbref-mcp verifies this `iss` by exact string.
    hostname: https://staging-keycloak.eliorion.fr
    # Must stay identical to realm-master.yaml's frontendUrl and to the
    # `keycloak-admin` device name in ingress-tailscale.yaml — change one, change all.
    # This restricts NOTHING: the admin REST API stays reachable via the public
    # hostname. /admin is kept off the internet by Cloudflare tunnel path rules +
    # a WAF rule — see infrastructure/services/staging/cloudflare/README.md.
    admin: https://keycloak-admin.tail45b0ca.ts.net
    # Refuse to derive the hostname from request headers.
    strict: true

  proxy:
    headers: xforwarded

  ingress:
    # The operator creates an Ingress for `hostname` by default; nothing serves it here.
    enabled: false

  networkPolicy:
    enabled: true
    # HTTPS: the Cloudflare tunnel and the in-namespace realm import Job.
    https:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: cloudflare
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: identity
    # HTTP: only the Tailscale proxy fronting the admin console.
    http:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: tailscale
    # `management` (health + metrics) stays unrestricted: the kubelet probes it
    # from the node, which is not a pod and would be dropped by a namespaceSelector.

  # `instances: 2` above buys nothing if both land on the same node, and that
  # is exactly what happened: keycloak-0 and keycloak-1 were BOTH scheduled on
  # staging-controlplane-1, so an unplanned loss of that one node took out
  # 100% of SSO -- every service behind this realm, at once.
  #
  # The operator already emits a maxSkew: 1 hostname constraint, but with
  # whenUnsatisfiable: ScheduleAnyway. That is a preference, and the scheduler
  # overrode it (node 1 is the one with the most allocatable headroom by
  # requests, so it wins ties). Hardening it to DoNotSchedule is the whole fix.
  #
  # Safe on this cluster: 2 replicas across 3 schedulable nodes is always
  # satisfiable, including during a single-node drain -- the evicted pod has
  # the third node to land on, and the PDB (minAvailable 1) permits the
  # eviction. It only strands a pod if two of three nodes are unavailable, at
  # which point a co-located pair would not have survived either.
  #
  # Restated verbatim from the operator's own output rather than trimmed,
  # because spec.scheduling REPLACES the generated constraints rather than
  # merging with them. The zone constraint is kept for that reason alone; the
  # nodes carry no topology.kubernetes.io/zone label, so it matches one
  # implicit domain and is inert. The labelSelector must stay byte-identical
  # to the operator's -- a selector that matches no pod is not an error, it is
  # a silently absent constraint, which is the bug being fixed here.
  scheduling:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: keycloak
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: keycloak
            app.kubernetes.io/managed-by: keycloak-operator
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: keycloak
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: keycloak
            app.kubernetes.io/managed-by: keycloak-operator

  additionalOptions:
    # Return 503 under overload instead of queueing without bound.
    - name: http-max-queued-requests
      value: "1000"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
