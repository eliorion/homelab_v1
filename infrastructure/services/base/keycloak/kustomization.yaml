apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Do NOT add the `identity` Namespace here: it is owned by
# infrastructure/controllers/base/keycloak-operator.
# Do NOT add `realm/` here: it carries an immutable Job and has its own Flux
# Kustomization with force: true (`infra-keycloak-realm`). A second owner without
# force would make realm edits fail to apply forever, silently.
resources:
  - app/
