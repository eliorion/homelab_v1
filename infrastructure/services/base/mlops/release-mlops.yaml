# Chart owned by the asp repo (k8s/charts/mlops). Values here are environment overrides ONLY, never
# image tags (asp CI bumps those in the chart). README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mlops
  namespace: flux-system
spec:
  targetNamespace: mlops
  interval: 30m
  chart:
    spec:
      chart: k8s/charts/mlops
      sourceRef:
        kind: GitRepository
        name: mlops
      interval: 12h
      reconcileStrategy: Revision
  # NO dependsOn `dagster`: its pods mount this release's ConfigMap (deadlock). README.md.
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  test:
    enable: true
  values:
    global:
      imagePullSecrets:
        - name: ghcr-pull-secret
    mlflow:
      # Must match the `mlflow` device in ingress-tailscale.yaml: MLflow refuses other Host headers.
      extraAllowedHosts:
        - mlflow.tail45b0ca.ts.net
    monitorNamespaces:
      - homepage
