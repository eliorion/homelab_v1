# Both UIs: the Tailscale proxy and Homepage's site monitor in; MLflow also takes the code locations'
# run pods. README.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow
  namespace: mlops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
        # The code locations' run pods and the marimo notebook (asp k8s/charts/mlops-pipelines).
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [mlops-pipelines-run, mlops-pipelines-dev-run, marimo]
      ports:
        - protocol: TCP
          port: 5000
  # Its database, its bucket, DNS. Nothing else: the CVE-2026-64849 class of bug (SSRF) has nowhere to go.
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: mlops-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
      ports:
        - protocol: TCP
          port: 8333
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Cilium: the run launcher talks to the Kubernetes API, which only the kube-apiserver entity expresses.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dagster-webserver
  namespace: mlops
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dagster
      component: dagster-webserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homepage
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: mlops-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The code locations' gRPC servers (dagster-workspace.yaml).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mlops
            app: mlops-pipelines
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mlops
            app: mlops-pipelines-dev
      toPorts:
        - ports:
            - port: "3030"
              protocol: TCP
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dagster-daemon
  namespace: mlops
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dagster
      component: dagster-daemon
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: mlops-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The code locations' gRPC servers (dagster-workspace.yaml).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mlops
            app: mlops-pipelines
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mlops
            app: mlops-pipelines-dev
      toPorts:
        - ports:
            - port: "3030"
              protocol: TCP
    - toEntities:
        - kube-apiserver
