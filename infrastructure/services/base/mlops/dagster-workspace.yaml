# Mounted by the dagster release (dagsterWebserver.workspace.externalConfigmap). One grpc_server
# entry per code location, all in this namespace (asp docs/27 D2), deployed by release-pipelines.yaml.
# Edit together with the workspace annotation in release-dagster.yaml (the pods read this at start).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-workspace
  namespace: mlops
data:
  workspace.yaml: |
    load_from:
      # asp k8s/charts/mlops-pipelines, location mlops-pipelines: the production location (the fbref
      # lake extract, the step-up model and its publication, asp docs/25 and docs/27).
      - grpc_server:
          host: mlops-pipelines.mlops.svc.cluster.local
          port: 3030
          location_name: mlops-pipelines
      # Location mlops-pipelines-dev: the dev lane (extract_query, run_notebook; asp docs/27 P2).
      # Read-only credentials only, one run at a time (mlops/lane=dev, release-dagster.yaml).
      - grpc_server:
          host: mlops-pipelines-dev.mlops.svc.cluster.local
          port: 3030
          location_name: mlops-pipelines-dev
