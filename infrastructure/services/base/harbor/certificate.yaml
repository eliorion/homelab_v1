# letsencrypt-STAGING deliberately. Confirm issuance AND one forced renewal
# (`cmctl renew registry-tls -n registry`) before flipping to prod: LE prod
# allows 5 duplicate certs per week, so a solver typo caught there costs a
# seven-day outage for this name.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-tls
  namespace: registry
spec:
  secretName: registry-tls
  dnsNames:
    - registry.eliorion.fr
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    # Rotate the key on renewal; nothing pins this cert's public key.
    rotationPolicy: Always
