# The Harbor UI, published on the tailnet and nowhere else, over HTTPS.
#
# Do NOT swap this for the `tailscale.com/expose` annotation: expose is an L3
# forward, so the browser would get Harbor's OWN certificate -- currently a
# letsencrypt-STAGING chain, which is untrusted.
#
# Do NOT point this at the `harbor` Service either. Its nginx answers :80 with
# `return 301 https://$host$request_uri`, and since $host is the tailnet name
# that redirects to this same Ingress -- an infinite loop. These path rules are
# harbor-nginx's own routing table, minus the redirect.
#
# PRECONDITION: HTTPS Certificates enabled in the Tailscale admin console
# (DNS -> HTTPS Certificates), or the proxy comes up with no certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-ui
  namespace: registry
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: harbor-core
                port:
                  number: 80
          - path: /c/
            pathType: Prefix
            backend:
              service:
                name: harbor-core
                port:
                  number: 80
          - path: /service/
            pathType: Prefix
            backend:
              service:
                name: harbor-core
                port:
                  number: 80
          - path: /v2/
            pathType: Prefix
            backend:
              service:
                name: harbor-core
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor-portal
                port:
                  number: 80
  tls:
    # The device name. MagicDNS serves it at https://harbor.tail45b0ca.ts.net
    - hosts:
        - harbor
