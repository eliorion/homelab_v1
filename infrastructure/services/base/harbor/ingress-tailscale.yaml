# Do NOT point at the `harbor` Service: its :80 redirects to $host, looping back here. See README.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-ui
  namespace: registry
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: harbor-core
                port:
                  number: 80
          - path: /c/
            pathType: Prefix
            backend:
              service:
                name: harbor-core
                port:
                  number: 80
          - path: /service/
            pathType: Prefix
            backend:
              service:
                name: harbor-core
                port:
                  number: 80
          - path: /v2/
            pathType: Prefix
            backend:
              service:
                name: harbor-core
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor-portal
                port:
                  number: 80
  tls:
    # The device name. MagicDNS serves it at https://harbor.tail45b0ca.ts.net
    - hosts:
        - harbor
