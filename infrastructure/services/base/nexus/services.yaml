# Exposes the UI (8081) + the three docker connector ports outside the cluster,
# alongside the chart-managed ClusterIP (see README.md).
apiVersion: v1
kind: Service
metadata:
  name: nexus-lb
  namespace: nexus
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8081
      targetPort: http # named container port from the nexus3 chart
      protocol: TCP
    # Numeric targetPorts: must match each repo's `docker.httpPort` in release.yaml.
    - name: docker-hub
      port: 5000
      targetPort: 5000
      protocol: TCP
    - name: docker-ghcr
      port: 5001
      targetPort: 5001
      protocol: TCP
    - name: docker-cache
      port: 5002
      targetPort: 5002
      protocol: TCP
  selector:
    # Must match the stevehipwell/nexus3 chart's selectorLabels (release `nexus`).
    app.kubernetes.io/name: nexus3
    app.kubernetes.io/instance: nexus
    app.kubernetes.io/component: repository
