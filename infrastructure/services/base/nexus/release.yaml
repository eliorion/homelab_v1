apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nexus
  namespace: flux-system
spec:
  targetNamespace: nexus
  releaseName: nexus
  interval: 30m
  # Nexus boots slowly (2min+), give helm-controller room to wait.
  timeout: 10m
  chart:
    spec:
      # Renovate keeps this pinned version current.
      chart: nexus3
      version: "5.22.0"
      sourceRef:
        kind: HelmRepository
        name: stevehipwell
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  # Without an upgrade block, remediation.retries defaults to 0 -- and 0 means
  # helm-controller marks the release Stalled after ONE failure and stops
  # retrying entirely. That is what happened here: a single failed upgrade on
  # 2026-07-27 latched Stalled=True reason=RetriesExceeded, and the release sat
  # Ready=False for over two weeks with nothing retrying and nothing alerting
  # loudly enough to be noticed.
  #
  # This does NOT by itself fix the current failure -- see the note on
  # persistence.size below; that needs a one-off orphan-delete of the
  # StatefulSet. What it fixes is the latch, so the NEXT transient failure
  # (registry blip, slow boot past the 10m timeout) retries and self-heals
  # instead of parking the CI cache indefinitely.
  #
  # Safe to add while the release is broken: this changes spec, not
  # spec.values, so the rendered pod template is byte-identical. The
  # StatefulSet's ControllerRevision hash is unchanged and nexus-0 is adopted
  # in place rather than rolled -- which matters, because rolling it means a
  # cold cache and a Longhorn re-attach of a 267 GiB volume.
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Keep the service named `nexus` so cluster DNS stays nexus.nexus.svc:8081.
    fullnameOverride: nexus
    persistence:
      enabled: true
      # Talos cluster: Longhorn CSI (local-path was the k3s provisioner).
      storageClass: longhorn
      # CURRENTLY BLOCKING EVERY UPGRADE OF THIS RELEASE, and not fixable from
      # git alone. volumeClaimTemplates is immutable on a StatefulSet, so this
      # 350Gi cannot be applied over the live template, which still reads
      # 250Gi. Longhorn already expanded the PVC online -- it is at 350Gi
      # today -- so the ONLY thing stale is the StatefulSet's copy, and every
      # Helm upgrade dies on:
      #
      #   StatefulSet.apps "nexus" is invalid: spec: Forbidden: updates to
      #   statefulset spec for fields other than 'replicas', 'ordinals', ...
      #
      # Clearing it is a one-off imperative step, documented with its rationale
      # in documentations/04-ci-runners-cache.md (Troubleshooting). It is
      # non-destructive on Longhorn:
      #
      #   kubectl -n nexus delete sts nexus --cascade=orphan
      #   flux reconcile helmrelease nexus -n flux-system --force
      #
      # --cascade=orphan keeps nexus-0 and the PVC running; the recreated
      # StatefulSet adopts the pod. Both flags are load-bearing: a plain
      # `flux reconcile` logs "release in-sync with desired state" and skips
      # the re-apply, so the orphaned StatefulSet is never recreated.
      #
      # AFTERWARDS, re-assert the one-replica setting described below. It lives
      # on the Longhorn Volume CR, not in these values, and survives only
      # because the orphan-delete preserves the PVC.
      size: 350Gi
      # ONE Longhorn replica, deliberately — everything in this volume is a
      # cache. Proxied PyPI/Docker artifacts re-download on the next miss, and
      # the hosted docker-cache is CI output that gets rebuilt. Losing the node
      # costs a cold cache and a slow first CI run, not data.
      #
      # It also costs the most of any volume here: 350Gi provisioned per replica
      # against ~287Gi actual, which at the default 3 was 1TB of the cluster's
      # ~2.1TB of schedulable Longhorn space and left routine growth elsewhere
      # (fbref-db) with nowhere to go.
      #
      # The count is NOT settable from these values: Longhorn takes it from the
      # StorageClass, and both the PVC's storageClassName and the StatefulSet's
      # volumeClaimTemplate are immutable, so pointing at a 1-replica class
      # would mean deleting the StatefulSet and the volume with it. It lives on
      # the Longhorn Volume CR instead:
      #
      #   kubectl -n longhorn-system patch volumes.longhorn.io <pv-name> \
      #     --type=merge -p '{"spec":{"numberOfReplicas":1}}'
      #
      # Longhorn persists that per-volume, so it survives restarts and upgrades
      # — but a recreated PVC would come back at the class default of 3.
    # Keep heap modest: single-node homelab. Raise -Xmx and the memory limit
    # together if Nexus OOMs under heavier use.
    install4jAddVmParams: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=2048m"
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 10
        memory: 6Gi
    # Prefer node staging-controlplane-1. Longhorn keeps a replica on every
    # node (defaultReplicaCount: 3), so node-1 always holds a local copy of
    # the data volume — running the pod here means the engine reads its data
    # locally. Soft (preferred) so Nexus still schedules elsewhere if node-1
    # is down; data survives via the other replicas. Note: after a failover
    # the pod does not auto-return to node-1 until it's rescheduled.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - staging-controlplane-1
    rootPassword:
      # SOPS-encrypted secret provided by the staging overlay.
      secret: nexus-root-password
      key: password
    service:
      additionalPorts:
        - port: 5000
          name: docker-hub
          containerPort: 5000
        - port: 5001
          name: docker-ghcr
          containerPort: 5001
        - port: 5002
          name: docker-cache
          containerPort: 5002
    config:
      enabled: true
      anonymous:
        enabled: true
      # Docker clients authenticate via token — required even for anonymous pull.
      realms:
        enabled: true
        values:
          - NexusAuthenticatingRealm
          - DockerToken
      cleanup:
        # Proxies keep a 14d window — re-pulling base images upstream is costly.
        - name: purge-stale
          notes: "Drop anything not downloaded in 14 days."
          format: ALL_FORMATS
          mode: delete
          criteria:
            lastDownloaded: "1209600"
        # docker-cache only. BuildKit (mode=max) overwrites the :buildcache tag
        # every build; the OLD manifest goes UNTAGGED but Nexus keeps it + its
        # unique layer blobs forever — a never-downloaded dangling manifest that
        # a lastDownloaded policy can NEVER match (it was never pulled by tag).
        # That leak hit ~215GB of orphans. Key on lastBlobUpdated (age since last
        # WRITE) instead: the live :buildcache is rewritten every build so it
        # stays fresh and survives, while each dangling manifest is never
        # rewritten → ages out in 4d → reaped → assetBlob.cleanup frees its blobs.
        - name: purge-buildcache
          notes: "docker-cache: drop manifests not rewritten in 4 days (reaps BuildKit dangling manifests)."
          format: docker
          mode: delete
          criteria:
            lastBlobUpdated: "345600"
      repos:
        - name: pypi-proxy
          format: pypi
          type: proxy
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
          proxy:
            remoteUrl: https://pypi.org
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          httpClient:
            blocked: false
            autoBlock: true
          cleanup:
            policyNames: [purge-stale]
        - name: docker-hub
          format: docker
          type: proxy
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
          proxy:
            remoteUrl: https://registry-1.docker.io
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          httpClient:
            blocked: false
            autoBlock: true
          docker:
            v1Enabled: false
            forceBasicAuth: false # anonymous pull
            httpPort: 5000
          dockerProxy:
            indexType: HUB
          cleanup:
            policyNames: [purge-stale]
        - name: ghcr
          format: docker
          type: proxy
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
          proxy:
            remoteUrl: https://ghcr.io
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          httpClient:
            blocked: false
            autoBlock: true
          docker:
            v1Enabled: false
            forceBasicAuth: false
            httpPort: 5001
          dockerProxy:
            indexType: REGISTRY
          cleanup:
            policyNames: [purge-stale]
        - name: docker-cache
          format: docker
          type: hosted
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
            writePolicy: allow # :buildcache tag overwritten every build
          docker:
            v1Enabled: false
            forceBasicAuth: false # anonymous pull (e2e cache-from has no login); push still needs auth
            httpPort: 5002
          cleanup:
            policyNames: [purge-buildcache]
