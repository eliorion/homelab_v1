# Talos watches this CR and materialises a Secret of the same name in this
# namespace holding a client cert scoped to os:etcd:backup, rotating it
# automatically. Requires machine.features.kubernetesTalosAPIAccess to list
# this namespace -- see bootstraping/talconfig.yaml.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup-talos-secrets
  namespace: etcd-backup
spec:
  roles:
    - os:etcd:backup
