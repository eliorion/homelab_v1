# Talos materialises a Secret of the same name holding an auto-rotated client
# cert (see README.md). The role AND this namespace must both be listed under
# machine.features.kubernetesTalosAPIAccess in bootstraping/talconfig.yaml.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup-talos-secrets
  namespace: etcd-backup
spec:
  roles:
    - os:etcd:backup
