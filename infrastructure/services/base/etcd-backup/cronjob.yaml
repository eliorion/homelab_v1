apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: etcd-backup
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # Was 3. A failed Job object keeps kube_job_status_failed == 1 for as long
  # as it exists, and EtcdBackupJobFailed has no time bound, so three retained
  # failures meant three permanently-firing criticals. Two of them dated from
  # 31 July and one from 6 August while every run since has succeeded.
  # Keep the most recent failure for post-mortem; the durable signal that
  # backups are actually broken is EtcdBackupStale, not a tombstone count.
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Reap finished Jobs by age as well as by count, so a failure cannot
      # outlive its usefulness just because nothing has failed since. 48h is
      # comfortably longer than the 9h EtcdBackupStale window, so a genuine
      # outage still alerts for its whole duration.
      ttlSecondsAfterFinished: 172800
      # The three historical failures all ended in "timed out waiting for the
      # condition" -- the Job hung rather than erroring. Without a deadline a
      # hung Job sits until the next schedule and Forbid then skips that run,
      # so one hang silently costs two cycles. A successful run takes ~27s
      # (156 MB snapshot, compress, upload); 15 min is ~30x headroom and still
      # far inside the 6h period.
      activeDeadlineSeconds: 900
      # Left at 2 (3 attempts total) deliberately. The schedule is 6-hourly
      # and EtcdBackupStale tolerates 9h, so the cluster already absorbs one
      # entirely failed cycle. Against an unreachable Garage or a hung tailnet
      # path -- the observed failure mode -- more in-Job retries only consume
      # the deadline above; the meaningful retry is the next cycle.
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: talos-backup
              # renovate: datasource=docker depName=ghcr.io/siderolabs/talos-backup
              image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3
              command:
                - /talos-backup
              workingDir: /tmp
              # Garage credentials + S3/age config; both come from the overlay
              # under exactly these names.
              envFrom:
                - secretRef:
                    name: etcd-backup-s3
                - configMapRef:
                    name: etcd-backup-config
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                # Snapshot is written here before upload.
                - mountPath: /tmp
                  name: tmp
                - mountPath: /.talos
                  name: talos
                # Path the Talos client library auto-discovers.
                - mountPath: /var/run/secrets/talos.dev
                  name: talos-secrets
          volumes:
            - name: tmp
              emptyDir: {}
            - name: talos
              emptyDir: {}
            - name: talos-secrets
              secret:
                secretName: etcd-backup-talos-secrets
