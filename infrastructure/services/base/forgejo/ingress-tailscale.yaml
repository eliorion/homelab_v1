# Tailnet door for the UI and HTTPS clones: https://forgejo.tail45b0ca.ts.net. Links Forgejo prints
# and the Keycloak login still point at ROOT_URL (git.eliorion.fr), which is LAN-only: there is no
# subnet router. Same trade-off as Harbor's UI ingress. README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: forgejo-http
      port:
        number: 3000
  tls:
    - hosts:
        - forgejo
