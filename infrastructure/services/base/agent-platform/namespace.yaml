# agent-platform: the control plane (agent-api, the Agent controller).
apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# agent-sandboxes: the agents themselves (gVisor boxes, one per Agent), their templates, warm
# pools and network policy. Restricted too: a box runs non-root, drops ALL, RuntimeDefault seccomp.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandboxes
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# agent-providers: the custom model providers' Secrets (an AI-gateway virtual key, an API key),
# written by agent-api from the UI (Settings > Model providers) and read by the broker when it starts
# a runtime. Nothing runs here. Its own namespace so agent-api, which writes Secrets, never reaches
# the subscription token Secret in agent-platform.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-providers
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
