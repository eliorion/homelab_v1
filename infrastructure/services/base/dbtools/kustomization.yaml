apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The dbtools-db CNPG cluster these two workloads store their state in lives in
# databases/dbtools/, beside every other infrastructure/services database —
# same split as ai-gateway and keycloak.
resources:
  - namespace.yaml
  - db-reflect-stubs.yaml
  - pgadmin-servers-configmap.yaml
  - pgadmin-deployment.yaml
  - pgadmin-service.yaml
  - pgadmin-networkpolicy.yaml
  - nao-config-configmap.yaml
  - nao-pvc.yaml
  - nao-deployment.yaml
  - nao-service.yaml
  - nao-networkpolicy.yaml
