apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ai-gateway-db
  namespace: ai-gateway
spec:
  instances: 2
  # NO migration Job here: Bifrost runs its own migration ladder at startup and a
  # Flyway Job would race it.
  bootstrap:
    initdb:
      # Must match the Bifrost chart's default user/db name
      # (values-examples/external-postgres.yaml).
      database: bifrost
      owner: bifrost
      # Bifrost's config store REQUIRES UTF8; pinned, not left to CNPG's default.
      encoding: UTF8
  storage:
    # Do not lower: headroom so the primary can still start with WAL archiving
    # broken (see ../README.md).
    size: 20Gi
