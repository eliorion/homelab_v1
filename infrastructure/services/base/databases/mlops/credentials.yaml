# Generated in the cluster, once. ../../mlops/README.md.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mlops-password
  namespace: mlops
spec:
  length: 48
  digits: 12
  # No symbols: the value lands in an INI file and a libpq environment.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-dagster-db
  namespace: mlops
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mlops-dagster-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: dagster
        password: "{{ .password }}"
        # The dagster chart reads this key; must equal password.
        postgresql-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mlops-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-mlflow-db
  namespace: mlops
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mlops-mlflow-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: mlflow
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mlops-password
