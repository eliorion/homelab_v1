# One instance, no backup: ../../mlops/README.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mlops-db
  namespace: mlops
spec:
  instances: 1
  bootstrap:
    initdb:
      # Must match postgresql.postgresqlDatabase/Username in the dagster HelmRelease.
      database: dagster
      owner: dagster
      secret:
        name: mlops-dagster-db
  managed:
    roles:
      - name: dagster
        ensure: present
        login: true
        passwordSecret:
          name: mlops-dagster-db
      - name: mlflow
        ensure: present
        login: true
        passwordSecret:
          name: mlops-mlflow-db
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  storage:
    size: 5Gi
---
# `retain`: deleting these objects must NOT drop the data.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mlflow
  namespace: mlops
spec:
  cluster:
    name: mlops-db
  name: mlflow
  owner: mlflow
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mlflow-auth
  namespace: mlops
spec:
  cluster:
    name: mlops-db
  name: mlflow_auth
  owner: mlflow
  databaseReclaimPolicy: retain
