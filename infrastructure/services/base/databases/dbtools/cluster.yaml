# Metadata store for pgAdmin and nao — NOT project data. See README.md.
# NO ScheduledBackup, on purpose: nothing here is restorable, and nothing here
# needs to be.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dbtools-db
  namespace: database
spec:
  instances: 1
  # The field is imageName (NOT image); ghcr.io/cloudnative-pg/cloudnative-pg is
  # the operator image and must never be used here.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie

  postgresql:
    parameters:
      max_connections: "100"
      effective_cache_size: "256MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"

  bootstrap:
    initdb:
      # initdb can bootstrap only ONE database; pgAdmin's comes from the Database
      # CR in pgadmin-database.yaml.
      database: nao
      owner: app

  storage:
    size: 5Gi
