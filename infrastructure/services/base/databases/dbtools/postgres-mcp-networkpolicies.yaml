# One policy per Postgres MCP Pro instance, and the ONE-CLUSTER EGRESS RULE IS
# THE ISOLATION. pgAdmin and nao are allowed all three databases; each of these
# is allowed exactly the one it is named after, so `postgres-mcp-fbref` cannot
# open a socket to asp-db even with a correct DSN. That is the difference
# between "configured for fbref" and "can only reach fbref".
#
# INGRESS is declared too, which nothing else in this namespace does. It is
# earned here: the SSE endpoint has no authentication and `execute_sql` reads
# the whole database, so without a rule any pod in the cluster could query it.
# `name: ai-gateway` is the label on the ai-gateway namespace, the same selector
# nao-networkpolicy.yaml already uses in the other direction.
#
# Two limits worth knowing:
#   · Same caveat as pgadmin-networkpolicy.yaml — `-rw` and `-ro` select the
#     SAME pods, so this cannot express "replica only". The replica endpoint in
#     the DSN is the write boundary, not this file.
#   · `kubectl port-forward` originates from the kubelet, not from a pod, so it
#     is not covered by the ingress rule. Debugging still works.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-mcp-fbref
  labels:
    app: postgres-mcp-fbref
    component: dbtools
    project: fbref
spec:
  podSelector:
    matchLabels:
      app: postgres-mcp-fbref
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ai-gateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: fbref-db
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fbref
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-mcp-asp
  labels:
    app: postgres-mcp-asp
    component: dbtools
    project: asp
spec:
  podSelector:
    matchLabels:
      app: postgres-mcp-asp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ai-gateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: asp-db
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: asp
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-mcp-scraper
  labels:
    app: postgres-mcp-scraper
    component: dbtools
    project: scraper
spec:
  podSelector:
    matchLabels:
      app: postgres-mcp-scraper
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ai-gateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: scraper-db
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: scraper
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
