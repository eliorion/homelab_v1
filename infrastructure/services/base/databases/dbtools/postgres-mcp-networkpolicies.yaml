# One policy per Postgres MCP Pro instance. THE ONE-CLUSTER EGRESS RULE IS THE
# ISOLATION — each pod may reach only the database it is named after. Do not
# widen it to all three the way pgAdmin and nao are.
#
# INGRESS is declared too, which nothing else in this namespace does: the SSE
# endpoint has no authentication of its own. `name: ai-gateway` is the label on
# the ai-gateway namespace.
#
# `-rw` and `-ro` select the SAME pods, so this cannot express "replica only" —
# the replica host in the DSN is the write boundary, not this file.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-mcp-fbref
  labels:
    app: postgres-mcp-fbref
    component: dbtools
    project: fbref
spec:
  podSelector:
    matchLabels:
      app: postgres-mcp-fbref
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ai-gateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: fbref-db
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fbref
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
