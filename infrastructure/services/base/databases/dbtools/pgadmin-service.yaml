# ClusterIP only. Add NO tailscale annotations here: the staging overlay
# publishes pgAdmin with a Tailscale Ingress, and both mechanisms at once
# contend for one hostname (README.md "Tailnet exposure").
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  labels:
    app: pgadmin
    component: dbtools
spec:
  type: ClusterIP
  selector:
    app: pgadmin
  ports:
    - name: http
      port: 80
      targetPort: http
