# ClusterIP only, and NO tailscale annotations — the staging overlay publishes
# pgAdmin with a Tailscale Ingress (https, 443) instead, so this base object
# stays reachable by port-forward alone:
#   kubectl -n database port-forward svc/pgadmin 5050:80
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  labels:
    app: pgadmin
    component: dbtools
spec:
  type: ClusterIP
  selector:
    app: pgadmin
  ports:
    - name: http
      port: 80
      targetPort: http
