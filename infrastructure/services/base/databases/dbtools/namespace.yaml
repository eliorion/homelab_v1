# Database-tooling namespace: the two clients that read the platform databases
# (pgAdmin — SQL client; nao — analytics agent). Nothing here owns data; the
# tools reach asp / fbref / scraper across namespaces, always through each
# cluster's `-ro` REPLICA service, which cannot accept a write at all.
#
# Infrastructure rather than an app: these serve every project's database and
# belong to no one project — same placing as ai-gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    # Selectable by NetworkPolicies in other namespaces (and by the reflector
    # allow-lists that mirror credentials in here).
    name: database
