# nao's project directory: nao_config.yaml plus everything `nao sync` writes.
# RWO + Recreate: one writer only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nao-project
  labels:
    component: dbtools
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
