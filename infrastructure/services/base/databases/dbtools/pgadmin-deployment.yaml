# pgAdmin 4 — SQL client for the asp / fbref / scraper databases. See README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  labels:
    app: pgadmin
    component: dbtools
spec:
  replicas: 1
  # Sessions live on the pod's emptyDir — never run two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
        component: dbtools
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 5050 # the uid baked into dpage/pgadmin4
        runAsGroup: 5050
        fsGroup: 5050
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Build the pgpass the servers.json PassFile entries point at, from the
        # reflected CNPG credentials.
        - name: pgpass
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # pgAdmin looks under storage/<email with @ and . replaced>: it maps
              # '@' to '_' and leaves dots alone (dev@example.fr -> dev_example.fr).
              dir="/var/lib/pgadmin/storage/$(echo "$PGADMIN_DEFAULT_EMAIL" | tr '@' '_')"
              mkdir -p "$dir"
              umask 077
              cat > "$dir/pgpass" <<EOF
              asp-db-ro.asp.svc.cluster.local:5432:*:app:${ASP_DB_PASSWORD}
              fbref-db-ro.fbref.svc.cluster.local:5432:*:app:${FBREF_DB_PASSWORD}
              scraper-db-ro.scraper.svc.cluster.local:5432:*:app:${SCRAPER_DB_PASSWORD}
              EOF
              chmod 600 "$dir/pgpass"
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-admin
                  key: email
            - name: ASP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asp-db-app
                  key: password
            - name: FBREF_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fbref-db-app
                  key: password
            - name: SCRAPER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scraper-db-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.17
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5050
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-admin
                  key: email
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-admin
                  key: password
            # Must stay above 1024: uid 5050 with every capability dropped cannot
            # take the image's default port 80.
            - name: PGADMIN_LISTEN_PORT
              value: "5050"
            # Without this the entrypoint waits on a Postfix that never comes up.
            - name: PGADMIN_DISABLE_POSTFIX
              value: "true"
            - name: PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED
              value: "False"
            - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
              value: "False"
            - name: PGADMIN_SERVER_JSON_FILE
              value: /pgadmin4/servers.json
            - name: PGADMIN_DB_USER
              valueFrom:
                secretKeyRef:
                  name: dbtools-db-app
                  key: username
            - name: PGADMIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dbtools-db-app
                  key: password
            # PGADMIN_CONFIG_* values are evaluated as PYTHON literals, hence the
            # inner quotes. $(VAR) is Kubernetes env expansion and resolves only
            # because the two vars above are declared first.
            - name: PGADMIN_CONFIG_CONFIG_DATABASE_URI
              value: "'postgresql://$(PGADMIN_DB_USER):$(PGADMIN_DB_PASSWORD)@dbtools-db-rw.database.svc.cluster.local:5432/pgadmin'"
          securityContext:
            allowPrivilegeEscalation: false
            # Must stay false: the image regenerates files under /pgadmin4 at boot.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        # Sessions + pgpass only — the config database is external.
        - name: data
          emptyDir: {}
        - name: servers
          configMap:
            name: pgadmin-servers
