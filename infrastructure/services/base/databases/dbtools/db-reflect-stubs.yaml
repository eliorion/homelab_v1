# Empty stubs that kubernetes-reflector fills from each project's CNPG -app
# Secret. This is the `app` OWNER credential — the write boundary is the `-ro`
# host every consumer uses, not the network. See README.md "Why this is
# read-only". The source clusters must also permit reflection, in
# apps/staging/databases/<project>/cluster-reflector-patch.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: asp-db-app
  labels:
    component: dbtools
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "asp/asp-db-app"
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: fbref-db-app
  labels:
    component: dbtools
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "fbref/fbref-db-app"
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: scraper-db-app
  labels:
    component: dbtools
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "scraper/scraper-db-app"
type: Opaque
