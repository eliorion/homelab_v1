apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The `database` namespace, whole: the dbtools-db CNPG cluster and its clients.
# See README.md.
resources:
  # The namespace + the credentials reflected into it.
  - namespace.yaml
  - db-reflect-stubs.yaml
  # Their own state: cluster + pgAdmin's second database.
  - cluster.yaml
  - pgadmin-database.yaml
  # pgAdmin — SQL client.
  - pgadmin-servers-configmap.yaml
  - pgadmin-deployment.yaml
  - pgadmin-service.yaml
  - pgadmin-networkpolicy.yaml
  # nao — analytics agent.
  - nao-config-configmap.yaml
  - nao-pvc.yaml
  - nao-deployment.yaml
  - nao-service.yaml
  - nao-networkpolicy.yaml
  # Postgres MCP Pro — one instance PER DATABASE.
  - postgres-mcp-deployments.yaml
  - postgres-mcp-services.yaml
  - postgres-mcp-networkpolicies.yaml
