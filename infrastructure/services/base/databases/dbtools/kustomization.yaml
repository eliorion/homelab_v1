apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The `database` namespace, whole: the dbtools-db CNPG cluster AND the two
# clients that live off it (pgAdmin, nao). Unlike keycloak / ai-gateway — whose
# databases sit here while the workload sits a tier up — the workload here IS
# database tooling, so splitting it bought a second directory and nothing else:
# `infrastructure/services/staging` is ONE Flux Kustomization, so `databases/`
# is a plain directory here, not a separately-ordered unit the way
# `apps/staging/databases` is.
resources:
  # The namespace + the credentials reflected into it.
  - namespace.yaml
  - db-reflect-stubs.yaml
  # Their own state: cluster + pgAdmin's second database (initdb bootstraps the
  # `nao` one; a CNPG Database CR is the only declarative way to get a second).
  - cluster.yaml
  - pgadmin-database.yaml
  # pgAdmin — SQL client.
  - pgadmin-servers-configmap.yaml
  - pgadmin-deployment.yaml
  - pgadmin-service.yaml
  - pgadmin-networkpolicy.yaml
  # nao — analytics agent.
  - nao-config-configmap.yaml
  - nao-pvc.yaml
  - nao-deployment.yaml
  - nao-service.yaml
  - nao-networkpolicy.yaml
