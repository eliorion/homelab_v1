# One ClusterIP per Postgres MCP Pro instance. Add NO Ingress and no tailscale
# annotation: the SSE endpoint has no authentication of its own. The only
# consumer is the ai-gateway, which reaches these by Service DNS —
#
#   http://postgres-mcp-<project>.database.svc.cluster.local:8000/sse
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-mcp-fbref
  labels:
    app: postgres-mcp-fbref
    component: dbtools
    project: fbref
spec:
  type: ClusterIP
  selector:
    app: postgres-mcp-fbref
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-mcp-asp
  labels:
    app: postgres-mcp-asp
    component: dbtools
    project: asp
spec:
  type: ClusterIP
  selector:
    app: postgres-mcp-asp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-mcp-scraper
  labels:
    app: postgres-mcp-scraper
    component: dbtools
    project: scraper
spec:
  type: ClusterIP
  selector:
    app: postgres-mcp-scraper
  ports:
    - name: http
      port: 8000
      targetPort: http
