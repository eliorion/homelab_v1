# SEED copy of nao_config.yaml. The init container installs it into the project
# PVC only when the file is ABSENT, so `nao init` / edits made inside the pod
# survive restarts and this ConfigMap is a starting point, not the live config.
# To re-seed from git: delete the file in the pod and restart —
#   kubectl -n database exec deploy/nao -- rm /app/project/nao_config.yaml
#   kubectl -n database rollout restart deploy/nao
#
# No secret appears here: `{{ env('...') }}` is nao's own interpolation, resolved
# in the pod against the env vars the Deployment injects from the reflected CNPG
# secrets. Every host is the `-ro` REPLICA service — the agent reads, and the
# server rejects a write even if it tries one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nao-config
  labels:
    component: dbtools
data:
  nao_config.yaml: |
    # Automarket platform — three Postgres databases, all read through their
    # CNPG replica service.
    databases:
      - name: asp
        type: postgres
        host: asp-db-ro.asp.svc.cluster.local
        port: 5432
        database: automarket
        schema: public
        user: "{{ env('ASP_DB_USER') }}"
        password: "{{ env('ASP_DB_PASSWORD') }}"
      - name: fbref
        type: postgres
        host: fbref-db-ro.fbref.svc.cluster.local
        port: 5432
        database: fbref
        schema: public
        user: "{{ env('FBREF_DB_USER') }}"
        password: "{{ env('FBREF_DB_PASSWORD') }}"
      - name: scraper
        type: postgres
        host: scraper-db-ro.scraper.svc.cluster.local
        port: 5432
        database: scraper
        schema: public
        user: "{{ env('SCRAPER_DB_USER') }}"
        password: "{{ env('SCRAPER_DB_PASSWORD') }}"

    # LLM access goes through ai-gateway, so the provider keys stay in that
    # namespace and nao holds only the gateway token.
    #
    # `provider: openai` names the WIRE PROTOCOL, not a vendor — which vendor
    # actually answers is decided by the routing rule behind the alias below,
    # in the ai-gateway dashboard. Hence the `/v1` appended here: the contract
    # publishes only the gateway's address, and each client appends the path
    # for the protocol its SDK speaks.
    llm:
      providers:
        - provider: openai
          api_key: "{{ env('NAO_LLM_API_KEY') }}"
          base_url: "{{ env('NAO_LLM_BASE_URL') }}/v1"
          models:
            - id: "{{ env('NAO_LLM_MODEL') }}"
              default: true
