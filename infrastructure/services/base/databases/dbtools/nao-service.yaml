# ClusterIP only. Add NO tailscale annotations here — the staging overlay
# publishes nao two ways (Tailscale Ingress + Cloudflare tunnel), both pointed
# at this Service. Every browser-visible address must appear in
# BETTER_AUTH_TRUSTED_ORIGINS. See README.md.
apiVersion: v1
kind: Service
metadata:
  name: nao
  labels:
    app: nao
    component: dbtools
spec:
  type: ClusterIP
  selector:
    app: nao
  ports:
    - name: http
      port: 5005
      targetPort: http
