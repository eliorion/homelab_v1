# nao — open-source analytics agent (getnao/nao). See README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nao
  labels:
    app: nao
    component: dbtools
spec:
  replicas: 1
  # One RWO project volume — never two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nao
  template:
    metadata:
      labels:
        app: nao
        component: dbtools
    spec:
      # Runs as ROOT and has to: supervisord refuses to start as anyone else
      # ("Error: Can't drop privilege as nonroot user"). Do NOT add runAsUser.
      # fsGroup 1000 is the `nao` user the programs setuid to — it makes the
      # nao-project PVC group-writable. Pod level, so the init container is
      # covered too.
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed the project directory ONCE — `cp -n`, so the PVC copy wins after
        # the first boot.
        - name: seed-project
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /app/project
              cp -n /seed/nao_config.yaml /app/project/nao_config.yaml
              echo "project dir:"; ls -la /app/project
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: project
              mountPath: /app/project
            - name: seed
              mountPath: /seed
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: nao
          # Commit tag: the image publishes no semver tags, so Renovate cannot
          # bump this. Move it by hand.
          image: getnao/nao:b325bba
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5005
          env:
            - name: NAO_DEFAULT_PROJECT_PATH
              value: /app/project
            # The project comes from the PVC, not from a git clone at boot.
            - name: NAO_CONTEXT_SOURCE
              value: local
            # Must stay "true": the NetworkPolicy blocks eu.i.posthog.com and the
            # client then hangs for thirty minutes on the upload instead of
            # failing (nao_core/tracking.py reads this).
            - name: POSTHOG_DISABLED
              value: "true"
            # Overridden by the staging overlay, together with
            # BETTER_AUTH_TRUSTED_ORIGINS — see nao-env-patch.yaml.
            - name: BETTER_AUTH_URL
              value: http://localhost:5005
            # Must stay stable: a new value logs every user out on the next
            # rollout.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: nao-secrets
                  key: better-auth-secret
            - name: NAO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: dbtools-db-app
                  key: username
            - name: NAO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dbtools-db-app
                  key: password
            # $(VAR) is Kubernetes env expansion over the two vars declared above.
            - name: DB_URI
              value: postgres://$(NAO_DB_USER):$(NAO_DB_PASSWORD)@dbtools-db-rw.database.svc.cluster.local:5432/nao
            # nao's OWN ai-gateway virtual key. `optional: true` keeps the pod
            # serving its UI before the key is filled in — chat is what fails,
            # not the process. Consumed by nao_config.yaml via {{ env('...') }}.
            - name: NAO_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nao-ai-gateway-token
                  key: AI_GATEWAY_TOKEN
                  optional: true
            # No trailing `/v1` — nao_config.yaml appends it.
            - name: NAO_LLM_BASE_URL
              value: "http://ai-gateway.ai-gateway.svc.cluster.local:8080"
            # Project DB credentials, consumed by nao_config.yaml's env() calls.
            - name: ASP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: asp-db-app
                  key: username
            - name: ASP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asp-db-app
                  key: password
            - name: FBREF_DB_USER
              valueFrom:
                secretKeyRef:
                  name: fbref-db-app
                  key: username
            - name: FBREF_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fbref-db-app
                  key: password
            - name: SCRAPER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: scraper-db-app
                  key: username
            - name: SCRAPER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scraper-db-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            # Must stay false: the image declares no USER and its entrypoint
            # writes inside /app.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              # SETUID/SETGID only, because supervisord setuids to `nao` per
              # program; without them the spawn fails. Do NOT add DAC_OVERRIDE —
              # the supervisor-log emptyDir below exists precisely so it can stay
              # dropped.
              add:
                - SETUID
                - SETGID
          volumeMounts:
            - name: project
              mountPath: /app/project
            - name: tmp
              mountPath: /tmp
            # supervisord's own logfile, over the image's `nao:nao` 0755 dir —
            # see the capabilities block above.
            - name: supervisor-log
              mountPath: /var/log/supervisor
          # TCP, not HTTP: there is no documented health path.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: project
          persistentVolumeClaim:
            claimName: nao-project
        - name: seed
          configMap:
            name: nao-config
        - name: tmp
          emptyDir: {}
        - name: supervisor-log
          emptyDir: {}
