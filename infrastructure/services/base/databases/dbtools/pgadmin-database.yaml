# pgAdmin's config database — the second database on dbtools-db, which initdb
# cannot create. `retain`: deleting this object must NOT drop the database.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pgadmin
  namespace: database
spec:
  cluster:
    name: dbtools-db
  name: pgadmin
  owner: app
  databaseReclaimPolicy: retain
