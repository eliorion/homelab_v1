# The three servers pgAdmin pre-registers on first login (PGADMIN_SERVER_JSON_FILE).
#
# Every host MUST stay the CNPG `-ro` REPLICA service — that is the whole write
# boundary (README.md "Why this is read-only").
#
# PassFile is resolved RELATIVE TO the logged-in user's pgAdmin storage directory
# (/var/lib/pgadmin/storage/<email with @ -> _>/), so the leading "/" is not a
# filesystem root.
#
# The import runs ONCE per user; editing this ConfigMap will not re-import.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  labels:
    component: dbtools
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "asp (replica, read-only)",
          "Group": "Automarket",
          "Host": "asp-db-ro.asp.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "automarket",
          "Username": "app",
          "PassFile": "/pgpass",
          "SSLMode": "prefer",
          "Comment": "Listings, price history, scrape_queue, search_requests."
        },
        "2": {
          "Name": "fbref (replica, read-only)",
          "Group": "Automarket",
          "Host": "fbref-db-ro.fbref.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "fbref",
          "Username": "app",
          "PassFile": "/pgpass",
          "SSLMode": "prefer",
          "Comment": "Football-reference + transfermarkt: public, mcp, tm, xwalk, cmp, audit."
        },
        "3": {
          "Name": "scraper (replica, read-only)",
          "Group": "Automarket",
          "Host": "scraper-db-ro.scraper.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "scraper",
          "Username": "app",
          "PassFile": "/pgpass",
          "SSLMode": "prefer",
          "Comment": "Scraping platform: lanes, scrape_requests, result_queue, site_config."
        }
      }
    }
