# Postgres MCP Pro (crystaldba/postgres-mcp) — ONE INSTANCE PER DATABASE, which
# is the isolation and not a convenience. See README.md "Postgres MCP Pro".
#
# WHICH PROJECT A POD SERVES IS DECLARED IN FOUR PLACES AND THEY MUST AGREE: the
# object name, the `project` label, the PROJECT env var, and the Bifrost client
# name `postgres_<project>` in the ai-gateway dashboard.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mcp-fbref
  labels:
    app: postgres-mcp-fbref
    component: dbtools
    project: fbref
spec:
  replicas: 1
  selector:
    # `app` ONLY — a Deployment selector is immutable, so adding `project` here
    # would lock in a rename.
    matchLabels:
      app: postgres-mcp-fbref
  template:
    metadata:
      labels:
        app: postgres-mcp-fbref
        component: dbtools
        project: fbref
    spec:
      # No Kubernetes API access is needed, and the token would be the one
      # credential in this pod NOT scoped to a single database.
      automountServiceAccountToken: false
      # Drops the docker-link env vars kubelet injects for every Service.
      enableServiceLinks: false
      # Pod-level as well as container-level, so a container added later cannot
      # silently run as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-mcp
          # Latest GitHub RELEASE. No release ships streamable-http yet, which
          # is why the transport below is sse.
          image: crystaldba/postgres-mcp:0.3.0
          imagePullPolicy: IfNotPresent
          # --sse-host=0.0.0.0 is MANDATORY: the default is localhost and a pod
          # bound there accepts nothing.
          args:
            - --access-mode=restricted
            - --transport=sse
            - --sse-host=0.0.0.0
            - --sse-port=8000
          ports:
            - name: http
              containerPort: 8000
          env:
            # Not read by postgres-mcp — a marker for `kubectl describe pod`.
            - name: PROJECT
              value: fbref
            # Required: the rootfs is read-only and python needs a writable HOME.
            - name: HOME
              value: /tmp
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: fbref-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fbref-db-app
                  key: password
            # Built by hand, not taken from the Secret: the CNPG `-app` uri would
            # point at the PRIMARY. $(VAR) is Kubernetes env expansion.
            - name: DATABASE_URI
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@fbref-db-ro.fbref.svc.cluster.local:5432/fbref
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # TCP, not HTTP: GET /sse opens a stream that would hang an HTTP probe
          # forever. Liveness is deliberately slack (5 min) — see README.md.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mcp-asp
  labels:
    app: postgres-mcp-asp
    component: dbtools
    project: asp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-mcp-asp
  template:
    metadata:
      labels:
        app: postgres-mcp-asp
        component: dbtools
        project: asp
    spec:
      # No Kubernetes API access is needed, and the token would be the one
      # credential in this pod NOT scoped to a single database.
      automountServiceAccountToken: false
      # Drops the docker-link env vars kubelet injects for every Service.
      enableServiceLinks: false
      # Pod-level as well as container-level, so a container added later cannot
      # silently run as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-mcp
          image: crystaldba/postgres-mcp:0.3.0
          imagePullPolicy: IfNotPresent
          args:
            - --access-mode=restricted
            - --transport=sse
            - --sse-host=0.0.0.0
            - --sse-port=8000
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PROJECT
              value: asp
            - name: HOME
              value: /tmp
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: asp-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asp-db-app
                  key: password
            # The asp database is named `automarket`, not `asp`.
            - name: DATABASE_URI
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@asp-db-ro.asp.svc.cluster.local:5432/automarket
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
