apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
  namespace: flux-system
spec:
  targetNamespace: radar
  releaseName: radar
  interval: 30m
  chart:
    spec:
      chart: radar
      version: "1.8.6"
      sourceRef:
        kind: HelmRepository
        name: skyhook
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  values:
    fullnameOverride: radar
    replicaCount: 1
    service:
      type: ClusterIP
      port: 9280
      # Publishes the UI and /mcp on the tailnet; L3 forward, keeps port 9280.
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: radar
    mcp:
      enabled: true
    # Read-only, except portForward: Radar port-forwards to
    # kube-system/hubble-relay:4245 -- false leaves the traffic view empty.
    rbac:
      create: true
      helm: false
      podExec: false
      portForward: true
      secrets: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
