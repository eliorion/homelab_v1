apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
  namespace: flux-system
spec:
  targetNamespace: radar
  releaseName: radar
  interval: 30m
  chart:
    spec:
      # Renovate keeps this pinned version current.
      chart: radar
      version: "1.8.6"
      sourceRef:
        kind: HelmRepository
        name: skyhook
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  values:
    fullnameOverride: radar
    replicaCount: 1
    service:
      type: ClusterIP
      port: 9280
      # Publish the Radar UI (and /mcp) on the tailnet via the Tailscale
      # operator -- authed by tailnet identity, off-LAN, never internet-exposed
      # (same pattern as the Longhorn / asp / fbref admin UIs). Reach it at
      # http://radar.<your-tailnet>.ts.net (plain HTTP, not 443).
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: radar
    mcp:
      enabled: true
    # Mostly read-only: helm/podExec/secrets stay off (no mutate, no exec).
    # portForward is on because Radar reaches Cilium Hubble Relay by
    # port-forwarding to the relay pod (kube-system/hubble-relay:4245) -- it's
    # the traffic/flows view's transport. Grants create pods/portforward
    # cluster-wide; access is gated by the tailnet.
    rbac:
      create: true
      helm: false
      podExec: false
      portForward: true
      secrets: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
