apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: openbao
spec:
  secretName: openbao-tls
  issuerRef:
    kind: Issuer
    name: openbao-ca
  # OpenBao does not reload its certificate on renewal: restart it within renewBefore. See README.
  duration: 17520h
  renewBefore: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - openbao
    - openbao.openbao
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - openbao-active.openbao.svc
    - openbao-0.openbao-internal
    - openbao-0.openbao-internal.openbao.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
