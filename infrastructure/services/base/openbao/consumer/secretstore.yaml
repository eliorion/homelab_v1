apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      # base64 of ../ca.crt, the offline OpenBao CA. Replace both together.
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: openbao-eso
