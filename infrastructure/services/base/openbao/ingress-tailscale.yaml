# Backend is HTTPS with the private CA; the operator proxies a port named `https` as https+insecure.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao-ui
  namespace: openbao
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: openbao-active
      port:
        name: https
  tls:
    - hosts:
        - openbao
