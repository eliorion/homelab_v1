apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-config
  namespace: openbao
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-config
    spec:
      restartPolicy: Never
      # Must match the role bound by self-initialization in release.yaml.
      serviceAccountName: openbao-config
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          # Keep on the server's version.
          image: quay.io/openbao/openbao:2.7.1
          command: ["/bin/sh", "/config/configure.sh"]
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: ca
              mountPath: /openbao/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: ca
          secret:
            secretName: openbao-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
