apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-gateway
  namespace: garage-gw
  labels:
    app: garage-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: garage-gateway
  template:
    metadata:
      labels:
        app: garage-gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: garage-gateway
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haproxy
          # renovate: datasource=docker depName=haproxy
          image: haproxy:3.4.4-alpine
          ports:
            - name: s3
              containerPort: 3900
            - name: health
              containerPort: 8404
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # TCP connect only: do NOT gate these on backend health. See README.md.
          livenessProbe:
            tcpSocket:
              port: 3900
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3900
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: cfg
              mountPath: /usr/local/etc/haproxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cfg
          configMap:
            name: garage-haproxy-config
        - name: tmp
          emptyDir: {}
