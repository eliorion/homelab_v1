apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: eliorion-images-signed
spec:
  # Audit first: reports only. Switch to ["Deny"] (and failurePolicy Fail) once the reports
  # are clean — README, "Moving to Deny".
  validationActions: ["Audit"]
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [asp, fbref, scraper, advisor, lab]
  matchImageReferences:
    - glob: "ghcr.io/eliorion/*"
  # Never rewrite a running workload's images from an audit policy.
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  credentials:
    # Must live in the kyverno namespace: reflected there by infra-reflector.
    secrets: [ghcr-pull-secret]
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            # asp's build-push.yaml at a release tag, nothing else. Owner case-insensitive.
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/(?i:eliorion)/asp/\.github/workflows/build-push\.yaml@refs/tags/.+$
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: sbom
      intoto:
        type: https://cyclonedx.org/bom
  variables:
    - name: released
      expression: >-
        (images.containers + images.?initContainers.orValue([]))
        .filter(image, image.startsWith('ghcr.io/eliorion/'))
  validations:
    - expression: >-
        variables.released.map(image, verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
      message: an ghcr.io/eliorion image is not signed by asp's build-push.yaml at a release tag
    - expression: >-
        variables.released.map(image,
        verifyAttestationSignatures(image, attestations.sbom, [attestors.release])).all(e, e > 0)
      message: an ghcr.io/eliorion image carries no CycloneDX SBOM attestation from asp's release
