# Sized for Phase 0 test 1's 20Gi resize request (expected Deferred on a node, not refused
# here) plus every other pod in this namespace. A 40Gi request is refused by THIS quota first.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-p0
spec:
  hard:
    pods: "8"
    requests.cpu: "4"
    requests.memory: 24Gi
    limits.memory: 24Gi
    requests.storage: 20Gi
    persistentvolumeclaims: "6"
