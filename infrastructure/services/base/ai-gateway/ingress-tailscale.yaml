# The gateway on the tailnet (HTTPS 443, MagicDNS cert), and nowhere else.
#
# PRECONDITION: HTTPS Certificates enabled in the Tailscale admin console
# (DNS → HTTPS Certificates). Without it the proxy comes up with no certificate
# and the gateway is unreachable.
#
# The Service must carry NO tailscale annotations, and the chart's own
# `ingress.enabled` stays false — either one would be a second tailnet device
# contending for this hostname. Rationale: README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-gateway
  namespace: ai-gateway
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: ai-gateway
      port:
        number: 8080
  tls:
    # The tailnet device name — KEEP `ai-gateway`: every consumer's base URL
    # (https://ai-gateway.<tailnet>.ts.net) is derived from this exact string.
    - hosts:
        - ai-gateway
