# The AI gateway. Bifrost is the CURRENT implementation, not the contract:
# everything a client touches — the Service name `ai-gateway`, the tailnet
# hostname `ai-gateway`, the `/anthropic` + `/v1` paths, and the model aliases
# `ai/opus` | `ai/sonnet` | `ai/fast` — is chosen so a swap to LiteLLM changes
# THIS FILE and nothing in any consumer. See README.md for the contract.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
  namespace: flux-system
spec:
  targetNamespace: ai-gateway
  releaseName: ai-gateway
  interval: 1m
  chart:
    spec:
      # Renovate keeps this pinned version current.
      chart: bifrost
      version: "2.1.34"
      sourceRef:
        kind: HelmRepository
        name: bifrost
        namespace: flux-system
      interval: 12h
  values:
    # Both overrides are load-bearing: they make the Service, the selector
    # labels and the ServiceMonitor read `ai-gateway`, never `bifrost`, so the
    # in-cluster DNS name survives a backend swap.
    nameOverride: ai-gateway
    fullnameOverride: ai-gateway

    # State lives in CNPG (storage.mode: postgres below), not on a per-pod
    # volume, so multiple replicas share one consistent config/virtual-key
    # store. Two is enough for the homelab's single-tenant load — matches the
    # `instances: 2` on ai-gateway-db itself.
    replicaCount: 2

    image:
      repository: docker.io/maximhq/bifrost
      # renovate: datasource=docker depName=docker.io/maximhq/bifrost
      # Chart 2.1.34 ships appVersion 1.5.12; the chart REQUIRES an explicit tag.
      tag: "v1.5.12"

    service:
      type: ClusterIP
      port: 8080
      # NO `tailscale.com/expose` annotation here. The tailnet is published by
      # ingress-tailscale.yaml instead, which serves HTTPS on 443 with no port
      # in the URL; `expose` would forward at L3 on :8080 over plain http.
      # Running both would register two tailnet devices contending for the same
      # `ai-gateway` hostname.

    # The CHART's ingress stays off — it hardcodes `secretName` and routes via
    # rules/host, neither of which suits a Tailscale Ingress. The tailnet
    # Ingress is its own object (ingress-tailscale.yaml); there is still no
    # public/LAN ingress of any kind.
    ingress:
      enabled: false

    storage:
      mode: postgres
      configStore:
        enabled: true
      logsStore:
        enabled: true
        # objectStorage stays disabled: no bucket wired for log offload yet,
        # so request/response audit rows stay in ai-gateway-db itself.

    # ai-gateway-db (infrastructure/services/base/ai-gateway/database/), NOT
    # the chart's own bundled subchart — postgresql.enabled stays false so the
    # chart never renders its own Postgres StatefulSet.
    postgresql:
      enabled: false
      external:
        enabled: true
        host: ai-gateway-db-rw
        port: 5432
        user: bifrost
        database: bifrost
        # In-cluster ClusterIP traffic only; no other CNPG consumer in this
        # repo sets sslMode either.
        sslMode: disable
        # CNPG generates this Secret from the Cluster's bootstrap.initdb —
        # no password is ever written to git.
        existingSecret: ai-gateway-db-app
        passwordKey: password

    # One Secret feeds every credential the gateway resolves by `env.NAME`.
    # Provider keys and the virtual key never land in the rendered config.json
    # ConfigMap this way — only the env var NAMES do.
    envFrom:
      - secretRef:
          name: ai-gateway-providers

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

    bifrost:
      appDir: /app/data
      port: 8080
      logLevel: info
      logStyle: json
      envLabel: staging

      # THE DATABASE WINS. `split` is Bifrost's default: config.json seeds a
      # section on first boot and is otherwise left alone, so edits made in the
      # dashboard survive every restart. Combined with declaring NO providers,
      # virtual keys or routing rules below, nothing in Git can overwrite the UI.
      #
      # The previous value, "config.json", did the opposite: it re-applied the
      # file's sections at EVERY startup — even when the stored config_hash
      # matched, because UI edits deliberately do not update that hash. Every
      # pod restart silently reverted the dashboard.
      sourceOfTruth: "split"

      encryptionKeySecret:
        name: ai-gateway-providers
        key: BIFROST_ENCRYPTION_KEY

      # Dashboard/admin login. This gates the UI and the management API, NOT
      # inference — inference is gated by the virtual key below.
      authConfig:
        isEnabled: true
        existingSecret: ai-gateway-admin
        usernameKey: username
        passwordKey: password

      client:
        # Require a credential on every inference call. A virtual key alone
        # satisfies it, which is what lets Claude Code authenticate with a
        # single header. Leaving this false would make the gateway an open
        # relay to paid provider keys for anyone on the tailnet.
        enforceAuthOnInference: true
        # CORS for the dashboard only. The gateway is unreachable off-tailnet,
        # so the origin list is not the security boundary here.
        allowedOrigins:
          - "*"
