# The AI gateway (Bifrost). Client contract and rationale: README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
  namespace: flux-system
spec:
  targetNamespace: ai-gateway
  releaseName: ai-gateway
  interval: 1m
  chart:
    spec:
      chart: bifrost
      version: "2.1.34"
      sourceRef:
        kind: HelmRepository
        name: bifrost
        namespace: flux-system
      interval: 12h
  values:
    # BOTH are load-bearing: they keep the Service, the selector labels and the
    # ServiceMonitor named `ai-gateway`, never `bifrost`.
    nameOverride: ai-gateway
    fullnameOverride: ai-gateway

    # KEEP AT 1. Bifrost caches virtual keys, providers and routing rules in
    # memory at startup, so a second pod serves a stale config view (same key:
    # 401 virtual_key_not_found on one pod, 200 on the other).
    replicaCount: 1

    image:
      repository: docker.io/maximhq/bifrost
      # renovate: datasource=docker depName=docker.io/maximhq/bifrost
      # Required by the chart's values.schema.json, and DELIBERATELY ahead of
      # the chart's appVersion (1.5.12) — do not "fix" it back to appVersion.
      tag: "v1.6.9"

    service:
      type: ClusterIP
      port: 8080
      # NO `tailscale.com/expose` annotation here: ingress-tailscale.yaml
      # publishes the tailnet device, and both would contend for the hostname.

    # The chart's own ingress stays off; the tailnet Ingress is its own object.
    ingress:
      enabled: false

    storage:
      mode: postgres
      configStore:
        enabled: true
      logsStore:
        enabled: true

    # External CNPG cluster ai-gateway-db (../databases/ai-gateway/); keep
    # `enabled: false` so the chart never renders its own Postgres.
    postgresql:
      enabled: false
      external:
        enabled: true
        host: ai-gateway-db-rw
        port: 5432
        user: bifrost
        database: bifrost
        sslMode: disable
        # Generated by CNPG from the Cluster's bootstrap.initdb.
        existingSecret: ai-gateway-db-app
        passwordKey: password

    # Every credential the gateway resolves by `env.NAME` comes from here.
    envFrom:
      - secretRef:
          name: ai-gateway-providers

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

    # The two settings PodSecurity `restricted` reported missing from the chart.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault

    bifrost:
      appDir: /app/data
      port: 8080
      logLevel: info
      logStyle: json
      envLabel: staging

      # KEEP "split" — the database wins. "config.json" re-applies this file at
      # every startup and silently reverts dashboard edits.
      sourceOfTruth: "split"

      encryptionKeySecret:
        name: ai-gateway-providers
        key: BIFROST_ENCRYPTION_KEY

      # Dashboard / management-API login. Does NOT gate inference.
      authConfig:
        isEnabled: true
        existingSecret: ai-gateway-admin
        usernameKey: username
        passwordKey: password

      client:
        # false here = open relay to the paid provider keys for the tailnet.
        enforceAuthOnInference: true
        # CORS for the dashboard only.
        allowedOrigins:
          - "*"

      plugins:
        # MUST STAY true (the chart defaults it false): virtual keys, budgets,
        # rate limits and routing rules have no API routes without it, and the
        # dashboard then fails with "Failed to load virtual keys: An unexpected
        # error occurred" / a bare 405.
        governance:
          enabled: true
          version: 1
          config:
            # Requires a VIRTUAL key, not just any credential — without it the
            # admin password also buys provider calls.
            is_vk_mandatory: true
            required_headers: []
            is_enterprise: false
