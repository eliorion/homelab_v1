# THE CLIENT CONTRACT, as data.
#
# In-cluster consumers (agent pods, jobs) read these keys instead of hardcoding
# a backend. Nothing here names Bifrost, so replacing the backend is a change to
# release.yaml alone. The matching credential is the `ai-gateway-token` Secret
# (staging overlay), mirrored into the same namespaces.
#
# Reflector mirrors this into every consumer namespace, because a ConfigMap
# cannot be read across namespaces.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-contract
  namespace: ai-gateway
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: asp,fbref,lab,scraper
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: asp,fbref,lab,scraper
data:
  # Base URL for in-cluster callers. Off-cluster callers (laptop, devcontainer)
  # use the tailnet host instead — see README.md.
  AI_GATEWAY_BASE_URL: "http://ai-gateway.ai-gateway.svc.cluster.local:8080"
  # The two wire protocols the gateway speaks. A client picks the one its SDK
  # already talks; both are served by the same process on the same port.
  AI_GATEWAY_ANTHROPIC_URL: "http://ai-gateway.ai-gateway.svc.cluster.local:8080/anthropic"
  AI_GATEWAY_OPENAI_URL: "http://ai-gateway.ai-gateway.svc.cluster.local:8080/v1"
  # Provider-neutral model aliases. Ask for these, never for a vendor model id
  # — which model actually answers is decided by the routing rules in
  # release.yaml, so re-pointing a tier costs no client change.
  AI_GATEWAY_MODEL_SMART: "ai/opus"
  AI_GATEWAY_MODEL_DEFAULT: "ai/sonnet"
  AI_GATEWAY_MODEL_FAST: "ai/fast"
