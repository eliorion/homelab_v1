# Scraping for the gateway; the chart templates no monitor object.
#
# A PodMonitor, NOT a ServiceMonitor: the chart renders two Services
# (`ai-gateway`, `ai-gateway-headless`) with byte-identical labels, so a
# ServiceMonitor selector matches both and scrapes the same pod twice.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ai-gateway
  namespace: ai-gateway
  labels:
    # Matches Prometheus podMonitorSelector.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
      app.kubernetes.io/instance: ai-gateway
      app.kubernetes.io/component: server
  podMetricsEndpoints:
    # `http` is the container port name; /metrics shares the API port and is
    # gated by authConfig (basic auth), not by the governance plugin. Swapping in
    # a virtual key here 401s. The Secret must stay in this namespace: the
    # operator resolves it and inlines the credential. See README.
    - port: http
      path: /metrics
      interval: 30s
      basicAuth:
        username:
          name: ai-gateway-admin
          key: username
        password:
          name: ai-gateway-admin
          key: password
