apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dagger-engine
  namespace: dagger
spec:
  serviceName: dagger-engine
  replicas: 2
  # StatefulSet, not Deployment: buildkitd.lock forces one volume per pod, and clients
  # address dagger-engine-N by stable name. See README.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: dagger-engine
  template:
    metadata:
      labels:
        app: dagger-engine
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: dagger-engine
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # cp1 excluded on purpose; ssd-single is node-local, so this decides where the cache lives. See README.
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - staging-controlplane-2
                      - staging-controlplane-3
      containers:
        - name: engine
          image: registry.dagger.io/engine:v0.21.9
          # NO args: --config is BuildKit's TOML-only flag and a second one CrashLoops the engine. See README.
          securityContext:
            # The engine IS BuildKit; it cannot run unprivileged.
            privileged: true
          env:
            # Undocumented, experimental; scraped by monitoring/configs/staging/dagger-ci.
            - name: _EXPERIMENTAL_DAGGER_METRICS_ADDR
              value: 0.0.0.0:9090
          ports:
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: cache
              mountPath: /var/lib/dagger
            - name: config
              mountPath: /etc/dagger
              readOnly: true
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              # No CPU limit on purpose. See README.
              memory: 8Gi
      volumes:
        - name: config
          configMap:
            name: dagger-engine-config
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes:
          - ReadWriteOnce
        # Node-local, one replica; never `hdd`. See README.
        storageClassName: ssd-single
        resources:
          requests:
            storage: 100Gi
