apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - repository.yaml
  - release.yaml
configMapGenerator:
  # Fixed name, referenced from release.yaml values: a CA change needs a rollout restart. See README.
  - name: dagger-harbor-ca
    namespace: dagger
    files:
      - config/harbor-ca.pem
    options:
      disableNameSuffixHash: true
  # Build-time only: copied into the release's engine.configJson, then dropped (local-config).
  - name: dagger-engine-json
    namespace: flux-system
    files:
      - config/engine.json
    options:
      annotations:
        config.kubernetes.io/local-config: "true"
replacements:
  - source:
      kind: ConfigMap
      name: dagger-engine-json
      fieldPath: data.[engine.json]
    targets:
      - select:
          kind: HelmRelease
          name: dagger
        fieldPaths:
          - spec.values.engine.configJson
