apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - service.yaml
  - statefulset.yaml
# Generated so the name carries a content hash: the engine reads engine.json
# once at start-up, so without the hash a config change would apply only on the
# next unrelated restart.
configMapGenerator:
  - name: dagger-engine-config
    namespace: dagger
    files:
      - config/engine.json
      - config/engine.toml
