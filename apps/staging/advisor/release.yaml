# Chart owned by the asp repo (k8s/charts/advisor) — values here are environment
# overrides ONLY, never image tags (the chart's values.yaml owns those). README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: advisor
  namespace: flux-system
spec:
  targetNamespace: advisor
  interval: 30m
  chart:
    spec:
      chart: k8s/charts/advisor
      sourceRef:
        kind: GitRepository
        name: advisor
      interval: 12h
      # Upgrade on every commit to the chart path — that is how the CI tag-bump
      # commit rolls out without touching this repo.
      reconcileStrategy: Revision
  install:
    # Belt-and-braces: the advisor ns is normally created by the databases tier.
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  test:
    enable: true
  values:
    global:
      # Private GHCR image; the Secret is mirrored into the ns by reflector (once
      # `advisor` is added to its namespace list — see apps/staging/databases/advisor/README.md).
      imagePullSecrets:
        - name: ghcr-pull-secret
    otel:
      enabled: true
      # OTLP/HTTP base URL: the SDKs append /v1/traces; the chart's egress opens 4318 only.
      endpoint: http://alloy-receiver.monitoring.svc.cluster.local:4318
      environment: staging
    # Data collection and the LLM pipeline (asp docs/16 section 4). The ai-gateway routing aliases
    # are ai/low, ai/normal, ai/high and ai/xhigh (ai/fast does not exist: "could not auto resolve a
    # provider"); extraction over thousands of passages runs on ai/normal.
    seed:
      enabled: true
    siteConfig:
      enabled: true
    collection:
      enabled: true
      # advisor-mot-backfill (asp docs/19 PR 1, docs/29): always suspended, run by hand with
      # `kubectl -n advisor create job --from=cronjob/advisor-mot-backfill mot-2022-r3`. Capacity confirmed
      # on 2026-10-19: advisor-db storage is 100Gi (apps/base/databases/advisor).
      # claimName is EMPTY on purpose (2026-11-04): with an archive the script purges a year's staged rows and
      # closes it, production has no reader of those Parquet files, and the catalogue is about to grow, so 2022
      # would freeze at about 13% of tests placed. Empty = the year stays staged and the run stops after it.
      # mot-archive-pvc.yaml stays for when a re-aggregator exists.
      motBackfill:
        enabled: true
        capacityConfirmed: true
        archive:
          claimName: ""
    pipeline:
      enabled: true
      # Suspended 2026-11-04: it spends the shared free quota on 0.28% of a night's passages and has filed nothing
      # since 2026-10-11. Comes back when the placed-first, batched pipeline passes its benchmark (asp docs/29).
      suspend: true
      llm:
        model: ai/normal
    tests:
      roleIsolation:
        enabled: true
        logins:
          pub: {secretName: advisor-pub-login}  # pragma: allowlist secret
          ingest: {secretName: advisor-ingest-login}  # pragma: allowlist secret
          seed: {secretName: advisor-seed-login}  # pragma: allowlist secret
          review: {secretName: advisor-review-login}  # pragma: allowlist secret
          publish: {secretName: advisor-publish-login}  # pragma: allowlist secret
    components:
      advisor-engine:
        enabled: true
        env:
          # caradisiac is paused with the pipeline (2026-11-04): 95% of stored documents were never parsed and its
          # later thread pages look unread. honestjohn and planete-citroen never produced anything.
          SITES: "www.largus.fr,www.forum-peugeot.com,forum.quechoisir.org,www.fiches-auto.fr,www.adac.de,data.economie.gouv.fr,api.nhtsa.gov,opendata.rdw.nl,open.data.dvsa.gov.uk,www.utac-otc.com"
      # The review queue, on the tailnet only (review-ingress-tailscale.yaml). The proxy's identity
      # header names the reviewer; never set this to a header a client could send on its own.
      advisor-review:
        enabled: true
        env:
          REVIEWER_HEADER: tailscale-user-login
