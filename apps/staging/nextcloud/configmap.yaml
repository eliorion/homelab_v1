apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-config
  namespace: nextcloud
data:
  # `localhost` is here for the kubelet probes (they send Host: localhost).
  NEXTCLOUD_TRUSTED_DOMAINS: "nextcloud.eliorion.fr localhost"
  # Cluster pod CIDR (bootstraping/talconfig.yaml). cloudflared terminates the
  # tunnel here, so without this every client shows up as the cloudflared pod IP.
  TRUSTED_PROXIES: "10.244.0.0/16"
  # TLS ends at the Cloudflare edge; the in-cluster hop is plain HTTP. Without
  # these three Nextcloud emits http:// asset URLs and the browser blocks them.
  OVERWRITEPROTOCOL: "https"
  OVERWRITEHOST: "nextcloud.eliorion.fr"
  OVERWRITECLIURL: "https://nextcloud.eliorion.fr"
  PHP_MEMORY_LIMIT: "1G"
  PHP_UPLOAD_LIMIT: "4G"
  # Read by the before-starting hook (apps/base/nextcloud/oidc-hook.yaml).
  OIDC_PROVIDER_ID: "Keycloak"
  # Must equal the clientId in the `apps` realm.
  OIDC_CLIENT_ID: "nextcloud"
  # The PUBLIC issuer, deliberately: Keycloak's networkPolicy.https admits only
  # the `cloudflare` and `identity` namespaces, so this pod cannot reach
  # keycloak-service:8443 at all. The backchannel hairpins out through the
  # tunnel and back — which means Nextcloud logins depend on the tunnel being up.
  # The realm segment must equal APPS_REALM in
  # infrastructure/services/staging/keycloak/realm/realm-vars.yaml.
  OIDC_DISCOVERY_URI: "https://staging-keycloak.eliorion.fr/realms/staging-apps/.well-known/openid-configuration"
