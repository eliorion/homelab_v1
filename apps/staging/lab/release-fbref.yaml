# fbref analysis lab — JupyterLab pod in the central `lab` ns, reading the fbref
# read-only DB replica across namespaces. Chart: k8s/charts/lab in the asp repo
# (synced via the `lab` GitRepository, clusters/staging/lab-source.yaml).
# OFF by default (replicas: 0). Scale up when you want to work:
#   kubectl -n lab scale deploy/lab-fbref --replicas=1
#   kubectl -n lab port-forward svc/lab-fbref 8888:8888   # http://localhost:8888
#   kubectl -n lab logs deploy/lab-fbref | grep -m1 token  # random Jupyter token
#   kubectl -n lab scale deploy/lab-fbref --replicas=0     # done
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab-fbref
  namespace: flux-system
spec:
  targetNamespace: lab
  interval: 30m
  chart:
    spec:
      chart: k8s/charts/lab
      sourceRef:
        kind: GitRepository
        name: lab
      interval: 12h
      reconcileStrategy: Revision
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    name: lab-fbref
    db:
      host: fbref-db-ro.fbref.svc.cluster.local
      namespace: fbref
      secretName: fbref-db-app # pragma: allowlist secret
      podSelector:
        cnpg.io/cluster: fbref-db
    # PRIVATE lab image? Make ghcr.io/eliorion/lab-jupyterlab public (it bakes no
    # secrets) OR reflect a pull secret into the lab ns (apps/staging/lab/secrets.yaml)
    # and uncomment:
    # imagePullSecrets:
    #   - name: ghcr-pull-secret
