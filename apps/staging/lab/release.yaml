# Central analysis-sandbox — ONE HelmRelease, one lab pod per entry in the
# `projects` list (chart k8s/charts/lab in the asp repo, via the `lab`
# GitRepository). The chart derives each lab's DB coords from the CNPG
# convention and generates its reflect-stub Secret. OFF by default (replicas: 0).
#
# Scale a lab up when you want it:
#   kubectl -n lab scale deploy/lab-asp --replicas=1
#   kubectl -n lab port-forward svc/lab-asp 8888:8888    # http://localhost:8888
#   kubectl -n lab logs deploy/lab-asp | grep -m1 token  # random Jupyter token
#   kubectl -n lab scale deploy/lab-asp --replicas=0
#
# ADD A PROJECT: append its name below + add the reflector permit annotation to
# its CNPG cluster (apps/staging/databases/<project>/cluster-reflector-patch.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab
  namespace: flux-system
spec:
  targetNamespace: lab
  interval: 30m
  chart:
    spec:
      chart: k8s/charts/lab
      sourceRef:
        kind: GitRepository
        name: lab
      interval: 12h
      reconcileStrategy: Revision
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Always-on so the labs are reachable on the tailnet without scaling.
    replicas: 1
    projects:
      - asp
      - fbref
    # Publish each lab on the tailnet via the Tailscale operator — reach at
    #   http://lab-asp.<tailnet>.ts.net:8888  /  http://lab-fbref.<tailnet>.ts.net:8888
    tailscale:
      expose: true
    # No Jupyter token: the tailnet identity is the auth boundary (same model as
    # the admin UIs). Anyone on the tailnet gets the lab's read-only DB access.
    auth:
      disableToken: true
    # Private image: the central reflector source (homelab #11) already mirrors
    # ghcr-pull-secret into the lab ns, so just reference it — no per-lab stub.
    imagePullSecrets:
      - name: ghcr-pull-secret # pragma: allowlist secret
