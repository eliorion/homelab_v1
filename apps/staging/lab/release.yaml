# Central analysis-sandbox — one lab pod per entry in the `projects` list. See
# README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab
  namespace: flux-system
spec:
  targetNamespace: lab
  interval: 30m
  chart:
    spec:
      chart: k8s/charts/lab
      sourceRef:
        kind: GitRepository
        name: lab
      interval: 12h
      reconcileStrategy: Revision
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    replicas: 1
    # Empty in the chart means "cluster default"; pin it so the class is visible
    # here and does not silently change when the default flips.
    storage:
      className: hdd
    # ADD A PROJECT: append it here AND add the reflector permit annotation to its
    # CNPG cluster (apps/staging/databases/<project>/cluster-reflector-patch.yaml).
    projects:
      - asp
      - fbref
    # Publish each lab on the tailnet via the Tailscale operator.
    tailscale:
      expose: true
    # No Jupyter token — the tailnet is the only auth boundary.
    auth:
      disableToken: true
    # Reference the central pull secret, which reflector auto-mirrors into the lab
    # ns. Nothing here may declare that Secret's `data` — see the trap below.
    imagePullSecretReflect:
      enabled: true
