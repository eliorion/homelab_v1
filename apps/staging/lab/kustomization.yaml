apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace: field — resources carry their own (the lab ns + reflector stubs
# live in `lab`; the HelmReleases live in flux-system, like every other release).
resources:
  - namespace.yaml
  - secrets.yaml
  - release-asp.yaml
  - release-fbref.yaml
