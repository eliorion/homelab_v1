# Reflector stubs — empty Secrets that kubernetes-reflector fills from each
# project's CNPG `<db>-app` Secret in the project namespace. The source clusters
# PERMIT reflection into `lab` via inheritedMetadata
# (apps/staging/databases/<proj>/cluster-reflector-patch.yaml); these stubs pull
# EXACTLY those two secrets (no auto-mirror → certs/replication stay put).
#
# No secret material lives here — reflector populates `.data` at runtime. Until
# reflector has reconciled, these are empty; the lab pods run at replicas: 0 so
# nothing consumes them until you scale up (by which point they're filled).
apiVersion: v1
kind: Secret
metadata:
  name: asp-db-app # pragma: allowlist secret
  namespace: lab
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "asp/asp-db-app"
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: fbref-db-app # pragma: allowlist secret
  namespace: lab
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "fbref/fbref-db-app"
type: Opaque
