# Flyway migration Job for the scraper coordination database.
# The image tag is bumped BY HAND; a stale pin is invisible because the
# already-completed Job still satisfies the Kustomization's `wait: true`.
# No ttlSecondsAfterFinished — Flux owns the Job lifecycle (force);
# a TTL would delete the completed Job and re-run it on every reconcile.
apiVersion: batch/v1
kind: Job
metadata:
  name: scraper-db-migrate
  namespace: scraper
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scraper-db-migrations
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flyway
          image: ghcr.io/eliorion/scraper-db-migrations:scraper-db-migrations-v0.5.0
          args: ["migrate"]
          env:
            # jdbc-uri must resolve to the bootstrap database "scraper"
            # (bootstrap.initdb.database in apps/base/databases/scraper/database.yaml)
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: scraper-db-app
                  key: jdbc-uri
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: scraper-db-app
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scraper-db-app
                  key: password
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_BASELINE_VERSION
              value: "0"
            - name: FLYWAY_CONNECT_RETRIES
              value: "10"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # flyway writes temp files under /flyway
            capabilities:
              drop: ["ALL"]
