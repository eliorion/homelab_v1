apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: asp

resources:
  - ../../../base/databases/asp
  - r2-backup-credentials.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml
  - ingestion-metrics-configmap.yaml

patches:
  # Attach the Barman Cloud Plugin for R2 backups.
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: asp-db
  # PVCs on Longhorn (explicit — also the cluster default SC on Talos).
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: asp-db
  # Permit kubernetes-reflector to mirror the -app secret out of this ns.
  - path: cluster-reflector-patch.yaml
    target:
      kind: Cluster
      name: asp-db
  # Export the ingestion pause flags as CNPG metrics.
  - path: cluster-metrics-patch.yaml
    target:
      kind: Cluster
      name: asp-db
