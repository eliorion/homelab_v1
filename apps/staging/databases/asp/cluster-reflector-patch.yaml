# inheritedMetadata stamps ALL objects this cluster generates, so it carries the
# reflection PERMISSION only — never an auto-mirror annotation, or the
# -ca / -server / -replication secrets leak out with the -app one.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: asp-db
spec:
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "lab,database"
