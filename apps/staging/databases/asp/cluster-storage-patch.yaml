- op: add
  path: /spec/storage/storageClass
  value: ssd-cnpg
# ssd-cnpg is node-local: one instance per node, off node-1's nearly full pool.
- op: add
  path: /spec/affinity
  value:
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [staging-controlplane-2, staging-controlplane-3]
