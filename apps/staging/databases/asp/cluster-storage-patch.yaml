- op: add
  path: /spec/storage/storageClass
  value: ssd-cnpg
# ssd-cnpg is node-local: one instance per node, off node-1's nearly full pool.
- op: add
  path: /spec/affinity
  value:
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [staging-controlplane-2, staging-controlplane-3]
# The base 20Gi was 96% full on 2026-10-27. ssd-cnpg expands online
# (allowVolumeExpansion, resizeInUseVolumes); the base stays 20Gi for the e2e.
- op: replace
  path: /spec/storage/size
  value: 40Gi
