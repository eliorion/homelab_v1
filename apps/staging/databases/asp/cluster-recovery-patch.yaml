# INERT: not listed in kustomization.yaml patches. Re-attaching it only has an
# effect on a cluster that does not exist yet — CNPG reads bootstrap once, at
# first creation. As written it restores from serverName asp-db, which is also
# what cluster-backup-patch.yaml archives to -- re-attaching it unchanged would
# archive into the prefix it restores from. Give the recovered cluster its own
# serverName first (README).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: asp-db
spec:
  bootstrap:
    initdb: null
    recovery:
      source: asp-db-archive
  externalClusters:
    - name: asp-db-archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: r2-store
          serverName: asp-db
