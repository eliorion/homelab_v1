# INERT: not listed in kustomization.yaml patches. Re-attaching it only has an
# effect on a cluster that does not exist yet — CNPG reads bootstrap once, at
# first creation. A recovered cluster must archive under a different serverName
# than the one it restores from (README).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: asp-db
spec:
  bootstrap:
    initdb: null
    recovery:
      source: asp-db-archive
  externalClusters:
    - name: asp-db-archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: r2-store
          serverName: asp-db
