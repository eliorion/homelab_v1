# The ML lake reader's login (asp docs/27 D6, P8), from OpenBao kv/asp/ml-ro (this namespace reads nothing
# else). Seed it before the first reconcile: ../../../base/databases/asp/README.md, "ML lake". CNPG reads
# username/password HERE (managed role ml_ro, ../../../base/databases/asp/database.yaml); the extract runs
# in mlops (asp docs/27 D2), so the Secret is reflected there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asp-ml-ro
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: asp-ml-ro
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: mlops
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: mlops
      data:
        username: ml_ro
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: asp/ml-ro
