apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fbref

resources:
  - ../../../base/databases/scout-customer
  - scout-customer-login.enc.yaml
  - scout-customer-garage-backup.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml

patches:
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: scout-customer
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: scout-customer
