apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monica

resources:
  - ../../../base/databases/monica
  # Backups are OFF. Uncomment these three AND the cluster-backup-patch entry
  # under `patches:` together, and only with a working R2 token in place: with
  # placeholder credentials the barman WAL archiver fails and degrades the
  # cluster, and `databases` reconciles with wait:true gating db-migrations ->
  # apps, so that stalls the whole app tier. See README.md.
  # - r2-backup-credentials.enc.yaml
  # - objectstore.yaml
  # - scheduledbackup.yaml

patches:
  # Attach the Barman Cloud plugin -> R2. Uncomment together with the three
  # resources above.
  # - path: cluster-backup-patch.yaml
  #   target:
  #     kind: Cluster
  #     name: monica-db
  # PVCs on the LINSTOR `ssd` class.
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: monica-db
