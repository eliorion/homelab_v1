apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quackback

resources:
  - ../../../base/databases/quackback
  # Barman Cloud -> Garage bucket cnpg-staging-quackback (key imported by garage-config).
  - garage-backup-credentials.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml

patches:
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: quackback-db
  # Attach the Barman Cloud plugin -> Garage.
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: quackback-db
