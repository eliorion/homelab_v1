apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# db-migrations/ is intentionally NOT listed — it is applied by its own
# Flux Kustomization, which dependsOn this one.
resources:
  - asp/
  - advisor/
  - fbref/
  - n8n/
  - nextcloud/
  - quackback/
  - scout-customer/
  - scraper/

# Staging only, never in base/databases: base also feeds the e2e vcluster, whose
# LimitRange rejects limits over 2Gi. Sizes and why: infrastructure/services/base/databases/README.md.
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: any
      spec:
        failoverDelay: 30
        affinity:
          podAntiAffinityType: required
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: advisor-db}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "256Mi"}, "limits": {"memory": "1Gi"}}}]'
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: asp-db}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "512Mi"}, "limits": {"memory": "1536Mi"}}}]'
  # fbref-db: 2 GB of shared_buffers (128MB by default, 1GB from 2026-10 to 2026-11). The scout webapp's
  # first read of a page came from disk (a club roster 2.2 s cold, 0.3 s warm; person_season_last alone
  # is 320 MB) and its statements hit scout_ro's 5 s timeout. Measured on the replica 2026-11-11..14:
  # nearly all of Scout's statement time was disk reads (317 s of 321 s), while the pod held 2.4 of its
  # 4Gi (1 GB of buffers plus 1.2 GB of page cache the node reclaims at will). Buffers are the part of
  # the cache the kernel cannot take back, so the second GB comes out of memory the limit already
  # allows: the LIMIT IS UNCHANGED (owner, 2026-11-14) and the request, 2Gi, now equals the buffers.
  # effective_cache_size tells the planner what the 4Gi limit holds in all. Changing shared_buffers
  # RESTARTS both instances (replica first, then the primary in place, see README): about a minute of
  # "Data unavailable" on Scout, which reads the replica only. Merge outside the scout refresh
  # (18:47-22:30 UTC).
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: fbref-db}
    patch: |-
      - {"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "2Gi"}, "limits": {"memory": "4Gi"}}}
      - {"op": "add", "path": "/spec/postgresql/parameters/shared_buffers", "value": "2GB"}
      - {"op": "replace", "path": "/spec/postgresql/parameters/effective_cache_size", "value": "3GB"}
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: n8n-db}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "256Mi"}, "limits": {"memory": "1Gi"}}}]'
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: nextcloud-db}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "128Mi"}, "limits": {"memory": "512Mi"}}}]'
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: quackback-db}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "128Mi"}, "limits": {"memory": "512Mi"}}}]'
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: scout-customer}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "128Mi"}, "limits": {"memory": "512Mi"}}}]'
  # scraper-db: 3Gi limit (asp docs/29 P0). It now also holds the result-spill manifest and, from
  # P1, every tenant's frontier; the request stays 512Mi so scheduling is unchanged. Changing the
  # limit restarts both instances (replica first, then a switchover).
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: scraper-db}
    patch: '[{"op": "add", "path": "/spec/resources", "value": {"requests": {"memory": "512Mi"}, "limits": {"memory": "3Gi"}}}]'
