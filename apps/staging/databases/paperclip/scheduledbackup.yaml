apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: paperclip-db-daily
spec:
  # 6-field CNPG cron, not the 5-field Unix form. 03:20.
  schedule: "0 20 3 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: paperclip-db
