apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: r2-store
spec:
  retentionPolicy: "3d"
  configuration:
    destinationPath: "s3://scout-cnpg-staging"
    endpointURL: "https://07e577de68147de704bb467debe46e21.r2.cloudflarestorage.com"
    s3Credentials:
      accessKeyId:
        name: r2-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: r2-backup-credentials
        key: ACCESS_KEY_SECRET
    wal:
      compression: zstd
      encryption: AES256
    data:
      # snappy, not gzip: barman gzips the base tar on ONE core at level 9 (4-5h per base).
      compression: snappy
      encryption: AES256
      jobs: 8
      # Without it a backup taken on the standby waits up to 0.9 x checkpoint_timeout to start.
      immediateCheckpoint: true
  instanceSidecarConfiguration:
    # Required for Cloudflare R2: without both, backup AND restore fail with
    # XAmzContentSHA256Mismatch (plugin-barman-cloud #411).
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
