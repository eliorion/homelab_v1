apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fbref

resources:
  - ../../../base/databases/fbref
  # grafana_ro role password (basic-auth) — consumed by the CNPG managed role.
  - fbref-grafana-ro.enc.yaml
  # mcp_ro role password (basic-auth) — consumed by the CNPG managed role and
  # read by the fbref-mcp Deployment as its DATABASE_URL credential.
  - fbref-mcp-ro.enc.yaml
  # ghcr-pull-secret now comes from the central reflector source
  # (infrastructure/controllers/staging/reflector) — mirrored into this ns.
  # CNPG -> Garage backup (bucket cnpg-staging-fbref, via the in-cluster gateway).
  - garage-backup-credentials.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml

patches:
  # Attach the Barman Cloud plugin -> Garage (WAL archiver + daily base backup).
  # Connectivity verified before enabling (barman-cloud-backup-list, EXIT=0).
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: fbref-db
  # PVCs on Longhorn (explicit — also the cluster default SC on Talos).
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: fbref-db
  # Permit kubernetes-reflector to mirror the -app secret into the `lab` ns.
  - path: cluster-reflector-patch.yaml
    target:
      kind: Cluster
      name: fbref-db
