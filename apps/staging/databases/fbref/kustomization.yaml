apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fbref

# OpenBao SecretStore + its ServiceAccount: this namespace reads kv/fbref/* (eso-namespaces.txt).
components:
  - ../../../../infrastructure/services/base/openbao/consumer

resources:
  - ../../../base/databases/fbref
  # Passwords for the grafana_ro / mcp_ro / scout_ro CNPG managed roles.
  - fbref-grafana-ro.enc.yaml
  - fbref-mcp-ro.enc.yaml
  - fbref-scout-ro.enc.yaml
  # The signing secret of Scout's feedback widget (Quackback), read by the fbref chart.
  - scout-quackback-widget.enc.yaml
  # ml_ro / model_rw logins and the pipelines' MLflow login, from OpenBao (asp docs/25).
  - externalsecrets.yaml
  # CNPG -> Garage backup (bucket cnpg-staging-fbref, via the in-cluster gateway).
  - garage-backup-credentials.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml

patches:
  # Attach the Barman Cloud plugin -> Garage (WAL archiver + daily base backup).
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: fbref-db
  # PVCs on Longhorn + the staging disk size.
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: fbref-db
  # Permit kubernetes-reflector to mirror the -app secret into the `lab` ns.
  - path: cluster-reflector-patch.yaml
    target:
      kind: Cluster
      name: fbref-db
  # Tolerant liveness probe: API-server drops no longer restart Postgres mid-backup.
  - path: cluster-probes-patch.yaml
    target:
      kind: Cluster
      name: fbref-db
