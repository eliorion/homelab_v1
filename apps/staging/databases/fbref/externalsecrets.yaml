# The ML pipelines' credentials (asp docs/25), from OpenBao kv/fbref/* (this namespace reads nothing
# else). Seed them before the first reconcile: ../../fbref/README.md, "ML pipelines". The ML runs execute
# in mlops (asp docs/27 D2), so each Secret is reflected there; CNPG reads the two role Secrets HERE.
#
# The two database roles: CNPG reads username/password (managed roles ml_ro and model_rw in
# ../../../base/databases/fbref/database.yaml) and re-keys the role when the value changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fbref-ml-ro
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: fbref-ml-ro
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: mlops
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: mlops
      data:
        username: ml_ro
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: fbref/ml-ro
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fbref-model-rw
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: fbref-model-rw
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: mlops
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: mlops
      data:
        username: model_rw
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: fbref/model-rw
---
# The run pods' MLflow login (user `pipelines`, created once by the MLflow admin: README). The keys
# are the environment variables the MLflow client reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fbref-mlflow-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: fbref-mlflow-pipelines
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: mlops
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: mlops
      data:
        MLFLOW_TRACKING_USERNAME: pipelines
        MLFLOW_TRACKING_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: fbref/mlflow-pipelines
