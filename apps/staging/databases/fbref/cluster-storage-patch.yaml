- op: add
  path: /spec/storage/storageClass
  value: ssd
# Staging sizing; base stays at 10Gi. A full volume halts the primary with CNPG's
# "Not enough disk space" and takes the whole fbref stack down with it.
# Both Longhorn volumes are patched to numberOfReplicas: 1 — the class provisions
# 3, which no longer fits on node-1's disk. Re-apply after any PVC recreate.
- op: replace
  path: /spec/storage/size
  value: 200Gi
