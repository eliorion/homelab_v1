- op: add
  path: /spec/storage/storageClass
  value: ssd-cnpg
# Base stays at 10Gi. A full volume halts the primary and the whole fbref stack.
# 260Gi since 2026-10-15: WAL archiving to Garage timed out from ~01:40, the primary kept
# every unarchived segment and filled 200Gi by ~07:20 (crash loop "Not enough disk space").
- op: replace
  path: /spec/storage/size
  value: 260Gi
# ssd-cnpg is node-local: one instance per 745GB pool. node-1's pool cannot hold 200Gi.
- op: add
  path: /spec/affinity
  value:
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [staging-controlplane-2, staging-controlplane-3]
