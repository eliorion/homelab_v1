# Permit kubernetes-reflector to mirror the -app secret into the `lab` and
# `database` namespaces.
# inheritedMetadata stamps ALL cluster objects — put nothing here but the permit.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fbref-db
spec:
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "lab,database"
