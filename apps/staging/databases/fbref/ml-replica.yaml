# fbref-ml: the ML platform's OWN replica of fbref-db (asp docs/27 P11, owner 2026-10-17). A CNPG replica
# cluster, read by nobody but the mlops run pods and the marimo notebook (as ml_ro, Secret ml-ro). Its point
# is the standby delay: fbref-db-ro serves the apps with max_standby_streaming_delay 300s, so an extract
# statement older than that is cancelled when replay conflicts (docs/27 P3). Here the delay is unlimited:
# replay waits for the query, the extract is never cancelled, and the lag that builds up harms nobody.
#
# Streams from fbref-db-rw as streaming_replica with the primary's own certificates (same namespace). No
# slot, no archive restore: if it ever falls further behind than the primary keeps WAL, delete the Cluster
# and its PVC and let Flux recreate it (one pg_basebackup, ~150 GB). No backup either: it holds no data
# of its own. Roles and grants are replicated from the primary's catalogs, so ml_ro works here unchanged
# (CNPG managed roles do not apply to a replica cluster).
#
# Storage: ssd-cnpg (node-local, thin), on staging-controlplane-3, the pool with the most room
# (412 GiB free of 694 on 2026-10-17, beside fbref-db's own 400Gi volume using 165 GB).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fbref-ml
  namespace: fbref
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie

  replica:
    enabled: true
    source: fbref-db

  bootstrap:
    pg_basebackup:
      source: fbref-db

  externalClusters:
    - name: fbref-db
      connectionParameters:
        host: fbref-db-rw
        user: streaming_replica
        dbname: postgres
        sslmode: verify-full
      sslKey:
        name: fbref-db-replication
        key: tls.key
      sslCert:
        name: fbref-db-replication
        key: tls.crt
      sslRootCert:
        name: fbref-db-ca
        key: ca.crt

  postgresql:
    parameters:
      # The reason this cluster exists: replay waits for the reader, never the other way round.
      max_standby_streaming_delay: "-1"
      max_standby_archive_delay: "-1"
      # off: on, the primary would keep the rows a long extract still sees (bloat on fbref-db).
      hot_standby_feedback: "off"
      # ml_ro is capped at 10 connections (fbref-db's managed role, replicated); a few for CNPG.
      max_connections: "40"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "8MB"

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

  storage:
    storageClass: ssd-cnpg
    size: 250Gi

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [staging-controlplane-3]
