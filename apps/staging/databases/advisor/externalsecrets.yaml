# The advisor ML reader's login (asp docs/27 D7, P9), from OpenBao kv/advisor/ml-login (this namespace reads nothing
# else). Seed it before the first reconcile: README.md, "ML lake". CNPG reads
# username/password HERE (managed role advisor_ml, ../../../base/databases/advisor/database.yaml); the extract runs
# in mlops (asp docs/27 D2), so the Secret is reflected there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: advisor-ml-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: advisor-ml-login
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: mlops
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: mlops
      data:
        username: advisor_ml
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: advisor/ml-login
