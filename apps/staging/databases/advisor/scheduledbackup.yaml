apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: advisor-db-daily
  namespace: advisor
spec:
  # 6-field CNPG cron. 2:40 UTC, staggered with the other clusters.
  schedule: "0 40 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: advisor-db
