apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: advisor

resources:
  - ../../../base/databases/advisor
  # The five advisor_* role-login Secrets and the Garage backup wiring are NOT here yet —
  # see README.md. They need the owner's staging sops key and (for backups) a Garage bucket.

patches:
  # PVCs on the staging storage class. Base stays unset (dev has no storage class opinion).
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: advisor-db
