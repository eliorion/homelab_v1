apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: advisor

resources:
  - ../../../base/databases/advisor
  # Password for the advisor_pub CNPG managed role (unblocks advisor-api's dbRole login).
  - advisor-pub-login.enc.yaml
  # Password for the advisor_review CNPG managed role (advisor-review's dbRole login). Encrypt it
  # from the .exemple before merging: this line fails the build until the file exists, which is
  # what keeps the review UI from being enabled without its login.
  - advisor-review-login.enc.yaml
  # Logins for advisor_seed (the chart's seed hook), advisor_ingest (collection) and
  # advisor_publish (the publish CronJob), the roles asp docs/16 section 4 names for data collection.
  - advisor-seed-login.enc.yaml
  - advisor-ingest-login.enc.yaml
  - advisor-publish-login.enc.yaml
  # The Garage backup wiring is NOT here yet — see README.md (it needs a Garage bucket).

patches:
  # PVCs on the staging storage class. Base stays unset (dev has no storage class opinion).
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: advisor-db
