- op: add
  path: /spec/storage/storageClass
  value: ssd-cnpg
# ssd-cnpg is node-local (one copy, no remote access): Postgres replication is the redundancy, one
# instance per node, off node-1's full pool (2026-10-28: 0 KiB free, advisor-db-1 unmountable).
# Changing the class moves nothing by itself: each instance is re-cloned onto it, one at a time
# (apps/base/databases/fbref/README.md, "Operating it").
- op: add
  path: /spec/affinity
  value:
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [staging-controlplane-2, staging-controlplane-3]
