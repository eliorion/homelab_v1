apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextcloud

resources:
  - ../../../base/databases/nextcloud
  # CNPG -> Garage backup (bucket cnpg-staging-nextcloud, via the in-cluster gateway).
  # Create this file from the .exemple template BEFORE pushing: with placeholder
  # credentials the barman WAL archiver fails, degrades the cluster, and
  # `databases` reconciles with wait:true -- that stalls the whole app tier.
  - garage-backup-credentials.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml

patches:
  # TEMPORARY restore from the Barman object store -- see the patch file.
  - path: cluster-recovery-patch.yaml
    target:
      kind: Cluster
      name: nextcloud-db
  # Attach the Barman Cloud plugin -> Garage (WAL archiver + daily base backup).
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: nextcloud-db
  # PVCs on the LINSTOR `ssd` class.
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: nextcloud-db
