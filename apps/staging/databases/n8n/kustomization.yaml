apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: n8n

resources:
  - ../../../base/databases/n8n
  # The key must exist on Garage before this applies: a key Garage rejects makes the
  # WAL archiver fail and pg_wal grow until CNPG stops the primary. See README.md.
  - garage-backup-credentials.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml

patches:
  # Attach the Barman Cloud plugin -> Garage.
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: n8n-db
  # PVCs on the LINSTOR `ssd` class.
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: n8n-db
