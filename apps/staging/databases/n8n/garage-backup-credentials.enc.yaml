# ############################################################################
# NOT ENCRYPTED YET — PLACEHOLDER VALUES ONLY. Fill in and encrypt in the
# devcontainer (where sops + the staging age key live):
#
#   garage bucket create cnpg-staging-n8n
#   garage key create n8n-cnpg-staging
#   garage bucket allow --read --write cnpg-staging-n8n --key n8n-cnpg-staging
#
#   cd apps/staging/databases/n8n
#   sops -e -i garage-backup-credentials.enc.yaml   # <- BEFORE `git add`
#
# Then uncomment the backup block in kustomization.yaml (three resources + the
# cluster-backup-patch entry) so Flux actually applies it.
#
# The `.enc.yaml` name is what .sops.yaml matches on (path_regex staging/…),
# so `sops -e -i` picks the staging age recipient with no extra flags.
#
# CHECK BEFORE COMMITTING REAL VALUES:
#
#   grep -q ENC\\[ garage-backup-credentials.enc.yaml && echo SAFE || echo PLAINTEXT
#
# Committing this file with real values still in plaintext puts the Garage key
# in git history permanently — rotating the key is then the only fix.
# ############################################################################
