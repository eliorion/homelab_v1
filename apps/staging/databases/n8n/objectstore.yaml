apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage-store
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: "s3://cnpg-staging-n8n"
    # In-cluster HAProxy gateway -> Tailscale egress -> Garage nodes.
    endpointURL: "http://garage-s3.garage-gw.svc.cluster.local:3900"
    s3Credentials:
      accessKeyId:
        name: garage-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: garage-backup-credentials
        key: ACCESS_KEY_SECRET
    wal:
      compression: gzip
      # NO `encryption:` here. Garage does not support SSE-S3/AES256 (SSE-C
      # only) -- setting AES256 would fail every WAL/base upload.
    data:
      compression: gzip
      jobs: 2
  instanceSidecarConfiguration:
    env:
      # THE REGION IS LOAD-BEARING. Garage rejects a HeadBucket signed for any
      # other region with a bare 400; only barman-cloud-check-wal-archive calls
      # it, and only while the archive is empty -- which is this store's case.
      # Both names: boto3 reads AWS_REGION, the aws CLI honours AWS_DEFAULT_REGION.
      - name: AWS_REGION
        value: garage
      - name: AWS_DEFAULT_REGION
        value: garage
      # Defensive: boto3 >= 1.36 data-integrity checksum rejection seen with R2
      # (plugin-barman-cloud #411).
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
