# Permits kubernetes-reflector to mirror this cluster's Secrets into `database`.
# inheritedMetadata stamps ALL cluster objects — keep it to this permit only.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: scraper-db
spec:
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "database"
