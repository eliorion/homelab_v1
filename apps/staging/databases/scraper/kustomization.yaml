apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scraper

resources:
  - ../../../base/databases/scraper
  - serving-metrics-configmap.yaml

patches:
  # PVCs on the LINSTOR `ssd` class.
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: scraper-db
  # Permit reflection of the -app secret into the `database` ns.
  - path: cluster-reflector-patch.yaml
    target:
      kind: Cluster
      name: scraper-db
  # Export the per-site serving pause flags as CNPG metrics.
  - path: cluster-metrics-patch.yaml
    target:
      kind: Cluster
      name: scraper-db
