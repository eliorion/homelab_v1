apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scraper

resources:
  - ../../../base/databases/scraper
  - serving-metrics-configmap.yaml
  # Barman Cloud -> Garage bucket cnpg-staging-scraper (key imported by garage-config).
  - garage-backup-credentials.enc.yaml
  - objectstore.yaml
  - scheduledbackup.yaml
  # ONE-OFF: finish scraper-db-1's stuck PVC resize. Remove once the PVC reports 20Gi.
  - finish-resize-job.yaml

patches:
  # Attach the Barman Cloud plugin -> Garage.
  - path: cluster-backup-patch.yaml
    target:
      kind: Cluster
      name: scraper-db
  # PVCs on the LINSTOR `ssd` class.
  - path: cluster-storage-patch.yaml
    target:
      kind: Cluster
      name: scraper-db
  # Permit reflection of the -app secret into the `database` ns.
  - path: cluster-reflector-patch.yaml
    target:
      kind: Cluster
      name: scraper-db
  # Export the per-site serving pause flags as CNPG metrics.
  - path: cluster-metrics-patch.yaml
    target:
      kind: Cluster
      name: scraper-db
