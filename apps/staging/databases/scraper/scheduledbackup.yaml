apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: scraper-db-daily
  namespace: scraper
spec:
  # 6-field CNPG cron. 2:30 UTC, staggered with the other clusters.
  schedule: "0 30 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: scraper-db
