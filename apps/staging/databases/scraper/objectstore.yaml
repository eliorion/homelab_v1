apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage-store
  namespace: scraper
spec:
  retentionPolicy: "7d"
  configuration:
    destinationPath: "s3://cnpg-staging-scraper"
    # In-cluster HAProxy gateway -> Tailscale egress -> Garage nodes.
    endpointURL: "http://garage-s3.garage-gw.svc.cluster.local:3900"
    s3Credentials:
      accessKeyId:
        name: garage-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: garage-backup-credentials
        key: ACCESS_KEY_SECRET
    wal:
      compression: gzip
      # Archive up to 4 WAL files at once. One at a time, a slow Garage (8 s to 3.5 min per
      # file after its metadata disks filled, 2026-11-13) drained a 690-file backlog at ~16/h
      # net, about 40 h; scraper-db writes ~15 segments/h, so a slower Garage would fill its disk.
      maxParallel: 4
      # NO `encryption:` here. Garage does not support SSE-S3/AES256.
    data:
      compression: gzip
      jobs: 2
  instanceSidecarConfiguration:
    env:
      # THE REGION IS LOAD-BEARING: Garage rejects a HeadBucket signed for any other region.
      - name: AWS_REGION
        value: garage
      - name: AWS_DEFAULT_REGION
        value: garage
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
