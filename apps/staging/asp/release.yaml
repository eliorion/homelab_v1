# Chart lives in the asp repo (k8s/charts/asp) — values here are environment
# overrides ONLY, never image tags (the chart's values.yaml owns those). README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: asp
spec:
  interval: 1m
  # Must exceed the content lanes' Camoufox warm-up gated readiness
  # (initialDelay 90s + minReadySeconds 30), or a slow warm-up rolls back.
  timeout: 10m
  chart:
    spec:
      chart: k8s/charts/asp
      # Chart.yaml version is static 0.1.0 — upgrade on git revision instead.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: asp
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      # retries is REQUIRED: helm-controller performs no remediation at the
      # default retries: 0 — strategy alone is a no-op.
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
  test:
    enable: true
    ignoreFailures: false
  driftDetection:
    mode: enabled
  values:
    global:
      # Private GHCR images; the Secret is mirrored into the ns by reflector.
      imagePullSecrets:
        - name: ghcr-pull-secret
    # Off: no scraper producer feeds asp today — flipping this alone is not
    # enough, asp must rejoin the scraper platform first (README.md).
    ingest:
      enabled: false
    adminUi:
      enabled: true
      service:
        # Publish the admin UI on the tailnet (Tailscale operator), never
        # internet-exposed.
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: asp-admin-ui
    webapp:
      # `enabled`, not `enable` — a mistyped key path is silently ignored, so the
      # old spelling did nothing; it only looked right because the chart defaults
      # this to true.
      enabled: true
      db:
        # READ AS webapp_ro, NOT AS THE OWNING `app` ROLE. Setting `host` makes
        # the chart compose the DSN from the managed role's basic-auth Secret
        # (asp-webapp-ro) instead of the read-write asp-db-app/uri every other
        # component uses. The webapp writes nothing — the buying guide's one
        # INSERT was removed — and under this role it cannot: asp V6 grants it
        # SELECT on listings + price_history and nothing else.
        #
        # asp-db-r (any instance), never asp-db-ro: with 2 instances the
        # replica-only service has exactly one endpoint and drops to zero
        # mid-failover, which is what CrashLooped the fbref MCP. The role is
        # read-only wherever it lands, so serving reads from the primary is fine.
        host: asp-db-r
        roSecretName: asp-webapp-ro
