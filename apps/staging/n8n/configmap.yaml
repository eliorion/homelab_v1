apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: n8n
data:
  # Must match the tls host in ../../base/n8n/ingress-tailscale.yaml.
  # HTTPS origin, so N8N_SECURE_COOKIE stays at its secure default; on plain
  # HTTP it must be set to "false" or sign-in never completes.
  N8N_HOST: "n8n.tail45b0ca.ts.net"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "https"
  WEBHOOK_URL: "https://n8n.tail45b0ca.ts.net/"

  # Schedule Triggers resolve their cron against this.
  GENERIC_TIMEZONE: "Europe/Paris"
  TZ: "Europe/Paris"

  # Exposes /metrics; the ServiceMonitor in monitoring/configs/staging/n8n-metrics
  # scrapes it.
  N8N_METRICS: "true"

  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_RUNNERS_ENABLED: "true"
