apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: n8n
data:
  # Must match the tls host in ../../base/n8n/ingress-tailscale.yaml.
  # HTTPS origin, so N8N_SECURE_COOKIE stays at its secure default; on plain
  # HTTP it must be set to "false" or sign-in never completes.
  N8N_HOST: "n8n.tail45b0ca.ts.net"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "https"

  # Public, Cloudflare-tunnelled origin — only /webhook is routed there.
  # Telegram must reach this, so it cannot be the tailnet host.
  WEBHOOK_URL: "https://staging-n8n.eliorion.fr/"
  # Editor + OAuth callback stay on the tailnet host. Without this,
  # WEBHOOK_URL becomes the OAuth redirect and the LinkedIn credential
  # breaks, because that URL is not registered with the LinkedIn app.
  N8N_EDITOR_BASE_URL: "https://n8n.tail45b0ca.ts.net/"

  # Schedule Triggers resolve their cron against this.
  GENERIC_TIMEZONE: "Europe/Paris"
  TZ: "Europe/Paris"

  # Exposes /metrics; the ServiceMonitor in monitoring/configs/staging/n8n-metrics
  # scrapes it.
  N8N_METRICS: "true"

  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_RUNNERS_ENABLED: "true"
