apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: n8n

resources:
  - ../../base/n8n
  - configmap.yaml
  - n8n-secrets.enc.yaml

# TEMPORARY, remove after the migration restore: n8n generates a new encryption
# key into n8n-data-pvc on first start, and a new key cannot decrypt the
# restored credentials.
patches:
  - target:
      kind: Deployment
      name: n8n
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
