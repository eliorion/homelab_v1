# The central scraper service — Helm chart owned by the asp repo
# (k8s/charts/scraper), synced via the `scraper` GitRepository
# (clusters/staging/sources.yaml). Image tags live in the chart's values.yaml
# (CI bumps them per release); this file carries environment overrides ONLY.
# Deploys into its OWN `scraper` namespace against its own CNPG cluster
# scraper-db. asp + fbref consume results from its API (their ingest pods) — the
# API is the only project↔scraper contract; this service stores NO scraped data.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scraper
  namespace: flux-system
spec:
  targetNamespace: scraper
  interval: 1m
  # Helm op ceiling — must exceed the engine scraper lanes' Camoufox warm-up
  # gated readiness (initialDelay 90s) + minReadySeconds 30, or a slow warm-up
  # looks like a failed upgrade and rolls back.
  timeout: 10m
  chart:
    spec:
      chart: k8s/charts/scraper
      # Chart.yaml version is a human changelog signal only — upgrade on every
      # new git revision of the (chart-path-scoped) GitRepository instead.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: scraper
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      # A failed upgrade (pods never Ready within timeout, or a failed helm test)
      # rolls back to the last good release. retries is REQUIRED: helm-controller
      # performs no remediation at the default retries: 0.
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
  test:
    # Run the chart's helm test hooks (curl backend /v1/health + admin-ui) after
    # every install/upgrade; a failing hook fails the release → rollback.
    enable: true
    ignoreFailures: false
  driftDetection:
    mode: enabled
  values:
    global:
      # Pull the private GHCR images (ghcr.io/eliorion/scraper-*). The
      # ghcr-pull-secret is mirrored into this ns by the central reflector source.
      imagePullSecrets:
        - name: ghcr-pull-secret
    # FlareSolverr ON: the fbref engine lane fetches Cloudflare-protected pages
    # through it (Camoufox cannot clear a managed challenge server-side). The
    # fbref lane's PROXY_URL is forwarded INTO the solve, so FlareSolverr's
    # Chrome egresses via the proxy — hence solver.proxyEgressPorts below.
    solver:
      enabled: true
      replicas: 2 # one solve per replica → fbref crawl + scrape solve in parallel
      proxyEgressPorts: [8888] # let FlareSolverr reach the Tailscale egress proxy
    engine:
      # STATIC lanes RETIRED entirely (chart default is asp + fbref; this empties
      # it). Both projects are request-driven now, so this namespace runs ONLY the
      # platform: backend + the request pools below + solver + admin-ui. Flux
      # prunes the old static Deployments (engine-asp-* and engine-fbref-*). fbref
      # is the first (only) client via fbref-ingest → POST /v1/scrape; asp's own
      # static consumer (asp-ingest) is turned OFF in apps/staging/asp.
      tenants: []
      # Request-driven warm pools (ROLE=server) — the target of POST /v1/scrape.
      # One pool per egress IP; a pod leases lanes bound to its proxy, warms the
      # anti-bot session behind that IP, and serves the lane's requests. KEDA
      # scales each 0<->N on its proxy's pending count (keda below).
      #   direct   — the cluster's datacenter IP (Cloudflare/DataDome block it):
      #              the default pool, idle at 0 replicas (nobody submits
      #              proxy=direct today).
      #   tailscale — the residential exit (rsp-asp). `sites: [fbref]` routes fbref
      #              here: the backend assigns a proxy-less fbref request to this pool
      #              (least-pending), so its Cloudflare fetch egresses the residential
      #              IP — the SAME routing the retired static fbref lane used.
      #              flaresolverr forwards PROXY_URL into the solve → that hop uses
      #              solver.proxyEgressPorts. REQUIRES the tailscale-proxy-00 egress
      #              pod Ready (kubectl -n tailscale get pods). Add residential exits
      #              (each sites: [fbref]) to fan fbref out onto more IPs.
      pools:
        - name: direct
        - name: tailscale
          url: "http://tailscale-proxy-00.tailscale.svc.cluster.local:8888"
          sites: [fbref]
      # Extra egress port for any pool that dials the Tailscale proxy directly
      # from the engine pod (the fbref hop goes via solver.proxyEgressPorts).
      proxyEgressPorts: [8888]
    # Scale each request pool 0<->N on its proxy's pending-request count (idle
    # namespace = backend only). KEDA operator installed via infra-keda
    # (infrastructure/controllers/base/keda).
    keda:
      enabled: true
    adminUi:
      service:
        # Publish the admin UI on the tailnet via the Tailscale operator —
        # authed + reachable off-LAN, never internet-exposed. Inert until the
        # operator is installed (infrastructure/controllers/staging/tailscale-operator).
        # Reach at https://scraper-admin-ui.<your-tailnet>.ts.net
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: scraper-admin-ui
