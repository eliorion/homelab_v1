# Chart owned by the asp repo (k8s/charts/scraper) — values here are environment
# overrides ONLY, never image tags (the chart's values.yaml owns those). README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scraper
  namespace: flux-system
spec:
  targetNamespace: scraper
  interval: 1m
  # Must exceed the engine pools' Camoufox warm-up gated readiness
  # (initialDelay 90s + minReadySeconds 30), or a slow warm-up rolls back.
  timeout: 10m
  chart:
    spec:
      chart: k8s/charts/scraper
      # Chart.yaml version is a changelog signal only — upgrade on git revision.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: scraper
        # Required: kustomization.yaml puts this release in ns `scraper`.
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      # retries is REQUIRED: helm-controller performs no remediation at the
      # default retries: 0 — strategy alone is a no-op.
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
  test:
    enable: true
    ignoreFailures: false
  driftDetection:
    mode: enabled
  values:
    global:
      # Private GHCR images; the Secret is mirrored into the ns by reflector.
      imagePullSecrets:
        - name: ghcr-pull-secret
    # ONE solver per pool: a session's cf_clearance is bound to one egress IP, so
    # a shared instance cannot serve several proxies. No `replicas` knob — each
    # solver is KEDA-scaled 0<->1 alongside its pool.
    solver:
      enabled: true
      proxyEgressPorts: [8888] # let FlareSolverr reach the Tailscale egress proxy
    engine:
      # Request-driven warm pools (ROLE=server), one per egress IP, KEDA-scaled
      # 0<->1 and capped at one pod: one pool = one proxy = one IP = one
      # fingerprint. Scale throughput by adding POOLS, never replicas.
      #
      # `residential: true` is the ROUTING KEY — a proxy-less request goes to the
      # LEAST-PENDING residential pool (else 'direct'). Pool `c` is deliberately
      # NOT tagged: tag it only once its exit is confirmed to be a DISTINCT,
      # non-datacenter IP (README.md), because mislabelling a datacenter exit
      # residential puts EVERY site's traffic on an IP anti-bot vendors distrust.
      # The `tailscale` pool REQUIRES the tailscale-proxy-00 egress pod Ready.
      pools:
        - name: direct
          residential: true
        - name: tailscale
          residential: true
          url: "http://tailscale-proxy-00.tailscale.svc.cluster.local:8888"
        - name: c
          url: "http://tailscale-proxy-scrape-c.tailscale.svc.cluster.local:8888"
      # Extra egress port for any pool that dials the Tailscale proxy directly
      # from the engine pod (the Cloudflare hop goes via solver.proxyEgressPorts).
      proxyEgressPorts: [8888]
    poolctl:
      # Live pools this cluster will run a solver for, on top of the three chart
      # pools. Each solver requests 2560Mi / limits 6Gi across three nodes, and
      # POST /v1/pools is unauthenticated. Chart default is 4.
      maxSolvers: 2
    # NOTE: no `keda:` block. KEDA is a HARD REQUIREMENT of the chart — no enable
    # flag, no fixed-replica mode. The operator comes from infra-keda
    # (infrastructure/controllers/base/keda); without it this release fails to
    # apply its ScaledObjects rather than running everything unscaled.
    adminUi:
      service:
        # Publish the admin UI on the tailnet (Tailscale operator), never
        # internet-exposed.
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: scraper-admin-ui
