# Chart owned by the asp repo (k8s/charts/scraper) — values here are environment
# overrides ONLY, never image tags (the chart's values.yaml owns those). README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scraper
  namespace: flux-system
spec:
  targetNamespace: scraper
  interval: 1m
  # Must exceed the engine pools' Camoufox warm-up gated readiness
  # (initialDelay 90s + minReadySeconds 30), or a slow warm-up rolls back.
  timeout: 10m
  chart:
    spec:
      chart: k8s/charts/scraper
      # Chart.yaml version is a changelog signal only — upgrade on git revision.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: scraper
        # Required: kustomization.yaml puts this release in ns `scraper`.
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      # retries is REQUIRED: helm-controller performs no remediation at the
      # default retries: 0 — strategy alone is a no-op.
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
  test:
    enable: true
    ignoreFailures: false
  driftDetection:
    mode: enabled
  values:
    global:
      # Private GHCR images; the Secret is mirrored into the ns by reflector.
      imagePullSecrets:
        - name: ghcr-pull-secret
    # ONE solver per pool: a session's cf_clearance is bound to one egress IP, so
    # a shared instance cannot serve several proxies. No `replicas` knob — each
    # solver is KEDA-scaled 0<->1 alongside its pool.
    solver:
      enabled: true
      proxyEgressPorts: [8888] # let FlareSolverr reach the Tailscale egress proxy
    engine:
      # Request-driven warm pools (ROLE=server), one per egress IP, KEDA-scaled
      # 0<->1 and capped at one pod: one pool = one proxy = one IP = one
      # fingerprint. Scale throughput by adding POOLS, never replicas.
      #
      # `residential: true` is the ROUTING KEY — a proxy-less request goes to the
      # LEAST-PENDING residential pool (else 'direct'). Pool `c` is deliberately
      # NOT tagged: tag it only once its exit is confirmed to be a DISTINCT,
      # non-datacenter IP (README.md), because mislabelling a datacenter exit
      # residential puts EVERY site's traffic on an IP anti-bot vendors distrust.
      # The `tailscale` pool REQUIRES the tailscale-proxy-00 egress pod Ready.
      pools:
        - name: direct
          residential: true
        - name: tailscale
          residential: true
          url: "http://tailscale-proxy-00.tailscale.svc.cluster.local:8888"
        - name: c
          url: "http://tailscale-proxy-scrape-c.tailscale.svc.cluster.local:8888"
      # Extra egress port for any pool that dials the Tailscale proxy directly
      # from the engine pod (the Cloudflare hop goes via solver.proxyEgressPorts).
      proxyEgressPorts: [8888]
    # NOTE: no `keda:` block. KEDA is a HARD REQUIREMENT of the chart — no enable
    # flag, no fixed-replica mode. The operator comes from infra-keda
    # (infrastructure/controllers/base/keda); without it this release fails to
    # apply its ScaledObjects rather than running everything unscaled.
    adminUi:
      service:
        # Publish the admin UI on the tailnet (Tailscale operator), never
        # internet-exposed.
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: scraper-admin-ui
    # The LLM tool surface. Reachable on the tailnet, where the DEVICE is already
    # authenticated — same posture as admin-ui above.
    #
    # TO PUBLISH IT ON THE INTERNET (claude.ai, ChatGPT connectors — they connect
    # from the provider's cloud, so the tailnet is invisible to them) THREE THINGS
    # CHANGE, and they must change TOGETHER:
    #   1. auth.enabled: false -> true.       Everything else it needs is already
    #                                         filled in below.
    #   2. Add the Cloudflare tunnel route    scraper-mcp.eliorion.fr ->
    #      in the Zero Trust dashboard        http://scraper-mcp.scraper.svc.cluster.local:8080
    #      (routes are dashboard-only; there  and record it in
    #      is no CRD and nothing reconciles   infrastructure/services/staging/cloudflare/README.md
    #      the drift)                         in the same sitting.
    #   3. NO Access application in front     — it would break the client's own
    #                                         OAuth discovery.
    # Flipping 1 without 2 is safe (the surface just demands tokens nobody can
    # reach); doing 2 without 1 publishes an unauthenticated surface that can
    # spend residential bandwidth on any URL a caller names. Never do 2 first.
    mcp:
      enabled: true
      service:
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: scraper-mcp
      auth:
        # THE SWITCH. See the note above before flipping it.
        enabled: false
        # No trailing slash: `iss` is compared as an exact string, so one breaks
        # every token.
        issuerUrl: https://staging-keycloak.eliorion.fr/realms/mcp
        # This server's identifier AND the audience every token must carry. It is
        # what stops a token minted for fbref-mcp — same realm, same user, same
        # browser flow — from being replayed here.
        resourceUrl: https://scraper-mcp.eliorion.fr/mcp
        # Stamped by the audience mapper on the scrape:tools DEFAULT client scope
        # (infrastructure/services/base/keycloak/realm/realm-mcp.yaml). Keycloak 26
        # has no RFC 8707, so a DCR client that requests nothing still gets it.
        requiredScopes:
          - scrape:tools
      # allowedHosts is matched EXACTLY. The in-cluster names are listed alongside
      # the public one because the helm test hook POSTs to http://scraper-mcp:8080
      # and the e2e drives a port-forward — a hostname-only allowlist turns both
      # into HTTP 421, which fails the release and rolls it back.
      allowedHosts:
        - scraper-mcp.eliorion.fr
        - scraper-mcp:8080
        - scraper-mcp.scraper.svc.cluster.local:8080
        - localhost:*
      originAllowlist:
        - https://claude.ai
        - https://chatgpt.com
