# Chart owned by the asp repo (k8s/charts/fbref) — values here are environment
# overrides ONLY, never image tags (the chart's values.yaml owns those). README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fbref
  namespace: flux-system
spec:
  targetNamespace: fbref
  interval: 30m
  chart:
    spec:
      chart: k8s/charts/fbref
      sourceRef:
        kind: GitRepository
        name: fbref
      interval: 12h
      # Upgrade on every commit to the chart path — that is how the CI tag-bump
      # commit rolls out without touching this repo.
      reconcileStrategy: Revision
  install:
    # Belt-and-braces: the fbref ns is normally created by the databases tier.
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  test:
    enable: true
  values:
    global:
      # Private GHCR image; the Secret is mirrored into the ns by reflector.
      imagePullSecrets:
        - name: ghcr-pull-secret
    adminUi:
      service:
        # Publish the admin UI on the tailnet (Tailscale operator), never
        # internet-exposed.
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: fbref-admin-ui
    engine:
      # One process drives both sources (chart default is "fbref" alone).
      sites: "fbref,transfermarkt"
      # Small on purpose: transfermarkt shares the SAME residential pools the
      # other sites already draw from.
      maxInFlightOverrides:
        transfermarkt: 10
    mcp:
      # The one PUBLIC surface in this stack (Cloudflare tunnel →
      # https://fbref-mcp.eliorion.fr/mcp, no Ingress object).
      auth:
        # Without this the tunnel route publishes an unauthenticated reader of
        # the whole fbref database. The server exits non-zero if the two URLs
        # below are not both set.
        enabled: true
        # Compared to the token's `iss` by EXACT string — a trailing slash
        # breaks every token.
        issuerUrl: https://staging-keycloak.eliorion.fr/realms/mcp
        # Must match the `aud` stamped by the mapper on the mcp:tools DEFAULT
        # client scope (infrastructure/services/base/keycloak/realm/realm-mcp.yaml).
        resourceUrl: https://fbref-mcp.eliorion.fr/mcp
        requiredScopes:
          - mcp:tools
      # DNS-rebinding protection. Both lists must be set together or the server
      # refuses to start. The in-cluster entries are NOT optional: Host is
      # matched exactly and the chart's helm test hook POSTs to
      # http://fbref-mcp:8080/mcp — without them every upgrade fails on HTTP 421.
      allowedHosts:
        - fbref-mcp.eliorion.fr
        - fbref-mcp:8080
        - fbref-mcp.fbref.svc.cluster.local:8080
        - localhost:*
      # Browser origins for the hosted connectors. A MISSING Origin is always
      # allowed (that is what keeps CLI clients working).
      originAllowlist:
        - https://claude.ai
        - https://chatgpt.com
