apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quackback-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: quackback-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: quackback/quackback-secrets
