apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-db
  namespace: glpi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glpi-db
  template:
    metadata:
      labels:
        app: glpi-db
    spec:

      containers:
        - name: glpi-db
          image: library/mariadb:11.8
          ports:
            - containerPort: 3306
          envFrom:
          - configMapRef:
              name: glpi-db-configmap
          - secretRef:
              name: glpi-db-secret


          volumeMounts:
            - name: glpi-db-data
              mountPath: /var/lib/mysql

      volumes:
        - name: glpi-db-data
          persistentVolumeClaim:
            claimName: glpi-db-data-pvc

        - name: glpi-db-secret
          secret:
            secretName: glpi-db-secret
