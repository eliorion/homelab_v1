# The Icecast port on the tailnet, so an off-site relay can pull the stream.
#
# Deliberately a SEPARATE Service from `azuracast`, carrying only :8000: the
# main Service also has :80 (the admin console), and `tailscale.com/expose` is
# an L3 forward that would publish every port to the whole tailnet.
apiVersion: v1
kind: Service
metadata:
  name: azuracast-stream
  namespace: azuracast
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: azuracast-stream
spec:
  type: ClusterIP
  selector:
    app: azuracast
  ports:
    - name: icecast
      port: 8000
      targetPort: icecast
