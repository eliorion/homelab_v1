# No pod-security labels: Talos enforces `baseline`, which the all-in-one image
# satisfies. It runs supervisord as root (nginx, php-fpm, MariaDB, Redis,
# Icecast, Liquidsoap in one container) — allowed under baseline, flagged by the
# `restricted` warn/audit level. Do not add `enforce: restricted` here; the pod
# will not start.
apiVersion: v1
kind: Namespace
metadata:
  name: azuracast
