# One PVC per volume the upstream docker-compose declares. A Deployment, not a
# StatefulSet, owns them — that is what keeps them resizable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azuracast-db
  namespace: azuracast
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Station media, playlists and recordings.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azuracast-stations
  namespace: azuracast
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# /var/azuracast/storage — one mount for all of upstream's sub-volumes
# (uploads, geoip, sftpgo, acme, shoutcast2, stereo_tool, rsas).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azuracast-storage
  namespace: azuracast
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azuracast-backups
  namespace: azuracast
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
