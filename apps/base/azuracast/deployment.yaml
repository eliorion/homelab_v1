apiVersion: apps/v1
kind: Deployment
metadata:
  name: azuracast
  namespace: azuracast
spec:
  replicas: 1
  strategy:
    # RWO Longhorn volumes: RollingUpdate deadlocks. Do not change.
    type: Recreate
  selector:
    matchLabels:
      app: azuracast
  template:
    metadata:
      labels:
        app: azuracast
    spec:
      securityContext:
        # Must match the image's azuracast user (uid/gid 1000): a fresh PVC
        # mounts root:root 755 and the schema migration aborts without this.
        fsGroup: 1000
        # Skip the recursive chown when the volume root already matches.
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: azuracast
          # Pinned; Renovate bumps it. Do NOT pin below 0.23.6 —
          # CVE-2026-42606, admin account takeover via X-Forwarded-Host, and
          # this instance is reachable from the internet through the tunnel.
          image: ghcr.io/azuracast/azuracast:0.23.8
          # Do NOT add a container securityContext: supervisord starts as root
          # and drops privileges per-process itself. runAsNonRoot or a
          # capability drop stops it booting.
          ports:
            - name: http
              containerPort: 80
            - name: icecast
              containerPort: 8000
          env:
            - name: APPLICATION_ENV
              value: production
            # Required, not optional: without one of the four
            # MARIADB_*ROOT_PASSWORD options the first-boot init aborts, and
            # every process supervisord gates behind MariaDB stays down.
            - name: MYSQL_RANDOM_ROOT_PASSWORD
              value: "yes"
          # Covers the whole supervisord stack, not just a web app.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          # 10 min, do not lower: first boot initialises MariaDB and runs the
          # schema migrations, and a tighter window kills the pod mid-migration.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: db
              mountPath: /var/lib/mysql
            - name: stations
              mountPath: /var/azuracast/stations
            - name: storage
              mountPath: /var/azuracast/storage
            - name: backups
              mountPath: /var/azuracast/backups
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: azuracast-db
        - name: stations
          persistentVolumeClaim:
            claimName: azuracast-stations
        - name: storage
          persistentVolumeClaim:
            claimName: azuracast-storage
        - name: backups
          persistentVolumeClaim:
            claimName: azuracast-backups
