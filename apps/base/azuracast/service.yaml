apiVersion: v1
kind: Service
metadata:
  name: azuracast
  namespace: azuracast
spec:
  type: ClusterIP
  selector:
    app: azuracast
  ports:
    # cloudflared targets this port for mve-azuracast.eliorion.fr.
    - name: http
      port: 80
      targetPort: http
    # First auto-assigned station mount (AUTO_ASSIGN_PORT_MIN). Extra stations
    # get ports 8005, 8010, … and need their own entries here.
    - name: icecast
      port: 8000
      targetPort: icecast
