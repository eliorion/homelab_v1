apiVersion: apps/v1
kind: Deployment
metadata:
  name: quackback
  namespace: quackback
spec:
  replicas: 1
  # The old pod stops before the new one starts: an upgrade's migrations never run under a server
  # of the previous version. (Not Recreate: the live object holds rollingUpdate defaults, and the
  # server-side apply then refuses the switch.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: quackback
  template:
    metadata:
      labels:
        app: quackback
    spec:
      securityContext:
        # The image's `quackback` user: runAsNonRoot cannot verify a NAMED user.
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: quackback
          image: ghcr.io/quackbackio/quackback:0.14.1@sha256:a2d85f5f4506bf4a6de2af424f26b00f8f1e9582f8c5e975c4fb6a1f0417ad93
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: quackback-db-app, key: uri}}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: quackback-secrets, key: secret-key}}
            # s3-quackback is reflected from flux-system (SeaweedFS bucket identity).
            - name: S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-quackback, key: QUACKBACK_S3_ACCESS_KEY}}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-quackback, key: QUACKBACK_S3_SECRET_KEY}}
          envFrom:
            - configMapRef:
                name: quackback-config
          # The entrypoint runs every migration before the server, in ONE transaction: a kill midway
          # rolls them all back and starts over, so the first start after an upgrade gets 15 min.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # BUN_INSTALL_CACHE_DIR, the image's one writable directory
            - name: cache
              mountPath: /app/.cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
