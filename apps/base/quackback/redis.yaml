apiVersion: apps/v1
kind: Deployment
metadata:
  name: quackback-redis
  namespace: quackback
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quackback-redis
  template:
    metadata:
      labels:
        app: quackback-redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          # Cache and job state only: nothing on disk (Quackback's data is in quackback-db).
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: quackback-redis
  namespace: quackback
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app: quackback-redis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quackback-redis
  namespace: quackback
spec:
  podSelector:
    matchLabels:
      app: quackback-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: quackback
      ports:
        - protocol: TCP
          port: 6379
