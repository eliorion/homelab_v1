# The Paperclip board, published on the tailnet and nowhere else.
#
# PRECONDITION: HTTPS Certificates enabled in the Tailscale admin console
# (DNS → HTTPS Certificates). Without it the proxy comes up with no certificate
# and the UI is unreachable.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app: paperclip
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: paperclip
      port:
        number: 3100
  tls:
    # Device name — PAPERCLIP_PUBLIC_URL in the staging ConfigMap must match.
    - hosts:
        - paperclip
