apiVersion: v1
kind: Service
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app: paperclip
  # NO tailscale.com/expose annotation: the tailnet device comes from
  # ingress-tailscale.yaml, and two mechanisms contend for the same hostname.
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: http
  selector:
    app: paperclip
