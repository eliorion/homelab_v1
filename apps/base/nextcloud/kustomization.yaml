apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The `nextcloud` namespace and the nextcloud-db CNPG cluster ship from the
# databases tier.
resources:
  - storage.yaml
  - valkey.yaml
  - deployment.yaml
  - service.yaml

# Generated, NOT a plain ConfigMap resource: the content hash is part of the
# name, so editing the hook renames the ConfigMap and rolls the Deployment.
# A static ConfigMap updates the mounted file but restarts nothing, which means
# a hook edit silently does not take effect until the pod happens to restart.
configMapGenerator:
  - name: nextcloud-oidc-hook
    files:
      - oidc-hook.sh
