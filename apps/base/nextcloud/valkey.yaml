apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-valkey
  namespace: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-valkey
  template:
    metadata:
      labels:
        app: nextcloud-valkey
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          # renovate: datasource=docker depName=valkey/valkey
          image: valkey/valkey:9.1.1-alpine
          # No maxmemory-policy: eviction would silently drop Nextcloud's file
          # LOCK keys, not just cache entries. Persistence off — cache is disposable.
          command:
            - valkey-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-valkey
  namespace: nextcloud
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
  selector:
    app: nextcloud-valkey
