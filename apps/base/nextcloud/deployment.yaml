apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1
  # RWO volume: RollingUpdate deadlocks — the old pod must release it first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      securityContext:
        # www-data (33) owns the volume; the entrypoint itself still needs root.
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nextcloud
          # renovate: datasource=docker depName=nextcloud
          # Never skip a major on upgrade — Nextcloud refuses n -> n+2.
          image: nextcloud:34.0.2-apache
          ports:
            - name: http
              containerPort: 80
          env:
            # Postgres connection from the CNPG-generated nextcloud-db-app Secret.
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db-app
                  key: host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db-app
                  key: password
            - name: REDIS_HOST
              value: nextcloud-valkey
            - name: REDIS_HOST_PORT
              value: "6379"
            # Read by the before-starting hook. The Secret is authored in the
            # `identity` namespace next to the realm file and mirrored here by
            # reflector — do not create a second copy.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-oidc-client
                  key: client-secret
          envFrom:
            # NEXTCLOUD_ADMIN_USER / NEXTCLOUD_ADMIN_PASSWORD — read ONLY during
            # the first-boot install; editing them later changes nothing.
            - secretRef:
                name: nextcloud-admin
            - configMapRef:
                name: nextcloud-config
          # 60 x 10s: first boot unpacks the source tree and runs occ maintenance:install.
          startupProbe:
            httpGet:
              path: /status.php
              port: http
              # Kubelet would otherwise send the pod IP as Host and Nextcloud
              # answers "untrusted domain"; `localhost` is in NEXTCLOUD_TRUSTED_DOMAINS.
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              # The entrypoint chowns the volume as root and apache setuids to
              # www-data on port 80. Dropping any of these six kills the container.
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            # Replaces only this one hook subdirectory, not the whole tree.
            - name: oidc-hook
              mountPath: /docker-entrypoint-hooks.d/before-starting
        # Background jobs, every 5 min. Same pod, not a CronJob: the PVC is RWO
        # and a CronJob pod scheduled elsewhere could not mount it.
        - name: cron
          # renovate: datasource=docker depName=nextcloud
          image: nextcloud:34.0.2-apache
          # Bypasses the image ENTRYPOINT on purpose — running it here would
          # race the main container's installer.
          command: ["/cron.sh"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - SETGID
                - SETUID
                - DAC_OVERRIDE
          volumeMounts:
            - name: data
              mountPath: /var/www/html
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data-pvc
        - name: oidc-hook
          configMap:
            name: nextcloud-oidc-hook
            # The entrypoint only runs hook scripts that are executable.
            defaultMode: 0755
