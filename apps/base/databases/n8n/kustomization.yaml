apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# n8n runs in its OWN `n8n` namespace with its own CNPG cluster (n8n-db).
# The namespace ships here (databases tier) because that tier reconciles first —
# apps/base/n8n then lands into an existing ns.
resources:
  - namespace.yaml
  - database.yaml
