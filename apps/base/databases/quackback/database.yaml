apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: quackback-db
  namespace: quackback
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie

  postgresql:
    parameters:
      max_connections: "50"

  bootstrap:
    initdb:
      database: quackback
      owner: app
      # As the superuser: `app` cannot create these, and Quackback refuses to start without them.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_trgm

  storage:
    # 5Gi filled with WAL the archiver could not ship (Garage metadata disks full on nodes b and c
    # since 2026-11-11, so every Garage-backed WAL archive fails); a full volume keeps Postgres down,
    # and a down Postgres cannot archive the backlog once Garage is back. Same fix as advisor-db #347.
    size: 10Gi
