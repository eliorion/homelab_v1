apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: asp-db
spec:
  instances: 2
  # Field is imageName (not image); ghcr.io/cloudnative-pg/cloudnative-pg is the
  # operator image and must never be used here.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie

  postgresql:
    # Synchronous replication. number must stay < instances.
    synchronous:
      method: any
      number: 1
      # preferred: falls back to async when the replica is unavailable.
      dataDurability: preferred
    parameters:
      max_connections: "200"
      effective_cache_size: "768MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      # Enable logical replication for CDC
      wal_level: logical

  bootstrap:
    initdb:
      database: automarket
      owner: app
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: asp-db-init
            key: init.sql

  # createrole is required: Flyway V6/V8 run CREATE ROLE as `app`. Removing it
  # breaks every migration run (see README).
  managed:
    roles:
      - name: app
        ensure: present
        login: true
        createrole: true

  storage:
    size: 20Gi
