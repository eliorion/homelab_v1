apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fider-db
  namespace: fider
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie

  postgresql:
    parameters:
      max_connections: "50"

  bootstrap:
    initdb:
      database: fider
      owner: app

  storage:
    size: 5Gi
