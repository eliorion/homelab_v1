# ONE document only: the dev-platform e2e reads this file through the e2e-db-templates
# ConfigMap (infrastructure/services/dev/dev-platform/virtual) with a single-document YAML
# load, so a second object here fails every fbref e2e run. Other objects go in their own file.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fbref-db
  namespace: fbref
spec:
  instances: 2
  # NOTE: field is imageName (not image); ghcr.io/cloudnative-pg/cloudnative-pg
  # is the operator image and must never be used here.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie

  postgresql:
    synchronous:
      method: any
      number: 1
      # `required` here would block writes whenever the replica is unavailable.
      dataDurability: preferred
    # Loaded at start (a change here is a rolling restart: replica first, then a switchover
    # of the primary, about a minute during which the Scout webapp, which reads the replica
    # only, answers "Data unavailable"). The 2026-10-28 Scout latency study had to reproduce
    # every slow statement by hand: nothing recorded which ones were slow in production.
    shared_preload_libraries:
      - pg_stat_statements
      - auto_explain
    parameters:
      max_connections: "100"
      effective_cache_size: "512MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      # Observability (asp docs: the study's section 5). The view itself needs
      # CREATE EXTENSION in `fbref`, which the Database object below does as superuser:
      # the extension is not trusted, so a Flyway V-file running as `app` cannot.
      pg_stat_statements.max: "5000"
      pg_stat_statements.track: "top"
      # The plans of the real slow statements, sampled: per-node timing stays off (it is
      # the expensive part), buffers on (cold vs warm is the question).
      auto_explain.log_min_duration: "500ms"
      auto_explain.log_analyze: "on"
      auto_explain.log_timing: "off"
      auto_explain.log_buffers: "on"
      auto_explain.sample_rate: "0.2"
      # I/O wait apart from CPU in plans and in pg_stat_statements; cheap on a TSC clock
      # (pg_test_timing on the node if in doubt).
      track_io_timing: "on"
      log_min_duration_statement: "1s"
      log_lock_waits: "on"
      # The background writer could not keep up with the replica's cache churn: user
      # queries wrote a dirty page for almost every page they read (pg_stat_io, 10-28).
      # Reloaded live, no restart. Verify with pg_stat_io: writes by client backends fall.
      bgwriter_lru_maxpages: "1000"
      bgwriter_lru_multiplier: "4.0"
      bgwriter_delay: "100ms"
      # Do NOT lower toward the 30s default: the analytics readers on
      # `fbref-db-ro` then get "canceling statement due to conflict with
      # recovery". hot_standby_feedback=on is not the alternative — see README.
      max_standby_streaming_delay: "300s"
      # Checkpoint and compression settings are a pair: see README "WAL volume".
      wal_compression: "lz4"
      max_wal_size: "16GB"
      checkpoint_timeout: "30min"

  bootstrap:
    initdb:
      database: fbref
      owner: app
      # Schema is owned by Flyway (fbref-db-migrations Job). The one exception is a role
      # that CNPG declares below AND a migration alters: asp fbref V31 runs
      # `ALTER ROLE scout_ro SET ...` as `app`, and since PostgreSQL 16 only an ADMIN of a
      # role may change its settings. On a FRESH cluster CNPG creates the managed role
      # scout_ro before Flyway runs, as the superuser, so `app` is not its admin and V31
      # failed ("permission denied to alter role" — the dev-platform fresh lane,
      # 2026-09-26). Created here first, as superuser, with `app` as its admin; CNPG then
      # only adds the login. Runs at bootstrap only: an existing cluster is unaffected.
      postInitSQL:
        - CREATE ROLE scout_ro NOLOGIN
        - GRANT scout_ro TO app WITH ADMIN TRUE, INHERIT FALSE, SET FALSE

  # Read-only roles: Flyway creates them NOLOGIN, CNPG flips them to LOGIN with
  # the password from the basic-auth Secret in the staging overlay.
  managed:
    roles:
      - name: grafana_ro
        ensure: present
        login: true
        passwordSecret:
          name: fbref-grafana-ro
      - name: mcp_ro
        ensure: present
        login: true
        passwordSecret:
          name: fbref-mcp-ro
      # asp repo fbref V31: the scout webapp's reader (SELECT on the `scout` schema only,
      # read-only + 5s statement timeout set on the role itself).
      - name: scout_ro
        ensure: present
        login: true
        passwordSecret:
          name: fbref-scout-ro
      # asp repo fbref V60: the ML data lake's reader (SELECT on every schema, nothing else). The
      # mlops-pipelines run pods (namespace mlops) use it on fbref-db-ro to extract snapshots (asp docs/25).
      - name: ml_ro
        ensure: present
        login: true
        # The extract reads `workers` chunks at once, one connection each (asp docs/27 P3): a cap so
        # a large extract can never take the replica's connection slots from the apps.
        connectionLimit: 10
        # ONE reader on every domain database (asp docs/27 D10): Secret ml-ro is born in mlops
        # (OpenBao kv/mlops/ml-ro) and reflected here.
        passwordSecret:
          name: ml-ro
      # asp repo fbref V59: the pipelines' publisher (reads tm.* and the canonical scout models,
      # writes model.* only), for the publish step of asp docs/25 phase 5.
      - name: model_rw
        ensure: present
        login: true
        passwordSecret:
          name: fbref-model-rw
      # Flyway V3 creates the worker-control/nocodb roles while connected as
      # app — needs CREATEROLE.
      - name: app
        ensure: present
        login: true
        createrole: true
        # Keeps the bootstrap grant above: CNPG revokes any membership of a managed role
        # that its inRoles does not list, and this one is what lets V31 alter scout_ro.
        inRoles:
          - scout_ro

  storage:
    size: 10Gi
