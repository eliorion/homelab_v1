apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fbref-db
  namespace: fbref
spec:
  instances: 2
  # NOTE: field is imageName (not image); ghcr.io/cloudnative-pg/cloudnative-pg
  # is the operator image and must never be used here.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie

  postgresql:
    synchronous:
      method: any
      number: 1
      # `required` here would block writes whenever the replica is unavailable.
      dataDurability: preferred
    parameters:
      max_connections: "100"
      effective_cache_size: "512MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      # Do NOT lower toward the 30s default: the analytics readers on
      # `fbref-db-ro` then get "canceling statement due to conflict with
      # recovery". hot_standby_feedback=on is not the alternative — see README.
      max_standby_streaming_delay: "300s"

  bootstrap:
    initdb:
      database: fbref
      owner: app
      # Schema is owned by Flyway (fbref-db-migrations Job). The one exception is a role
      # that CNPG declares below AND a migration alters: asp fbref V31 runs
      # `ALTER ROLE scout_ro SET ...` as `app`, and since PostgreSQL 16 only an ADMIN of a
      # role may change its settings. On a FRESH cluster CNPG creates the managed role
      # scout_ro before Flyway runs, as the superuser, so `app` is not its admin and V31
      # failed ("permission denied to alter role" — the dev-platform fresh lane,
      # 2026-09-26). Created here first, as superuser, with `app` as its admin; CNPG then
      # only adds the login. Runs at bootstrap only: an existing cluster is unaffected.
      postInitSQL:
        - CREATE ROLE scout_ro NOLOGIN
        - GRANT scout_ro TO app WITH ADMIN TRUE, INHERIT FALSE, SET FALSE

  # Read-only roles: Flyway creates them NOLOGIN, CNPG flips them to LOGIN with
  # the password from the basic-auth Secret in the staging overlay.
  managed:
    roles:
      - name: grafana_ro
        ensure: present
        login: true
        passwordSecret:
          name: fbref-grafana-ro
      - name: mcp_ro
        ensure: present
        login: true
        passwordSecret:
          name: fbref-mcp-ro
      # asp repo fbref V31: the scout webapp's reader (SELECT on the `scout` schema only,
      # read-only + 5s statement timeout set on the role itself).
      - name: scout_ro
        ensure: present
        login: true
        passwordSecret:
          name: fbref-scout-ro
      # Flyway V3 creates the worker-control/nocodb roles while connected as
      # app — needs CREATEROLE.
      - name: app
        ensure: present
        login: true
        createrole: true
        # Keeps the bootstrap grant above: CNPG revokes any membership of a managed role
        # that its inRoles does not list, and this one is what lets V31 alter scout_ro.
        inRoles:
          - scout_ro

  storage:
    size: 10Gi
