apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: svg-render
  namespace: n8n
  labels:
    app: svg-render
spec:
  # Selects svg-render ONLY — the n8n pod stays unrestricted on purpose.
  podSelector:
    matchLabels:
      app: svg-render
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: n8n
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS only. No 443 rule: the renderer cannot fetch remote fonts or images.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
