apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
  labels:
    # The ServiceMonitor in monitoring/configs/staging/n8n-metrics selects on
    # SERVICE labels, not on spec.selector below — without this it matches
    # nothing and the N8nDown alert never has a series to evaluate.
    app: n8n
  # Deliberately NO tailscale.com/expose annotations: the tailnet device comes
  # from ingress-tailscale.yaml (HTTPS via MagicDNS). Both mechanisms at once
  # would register two devices contending for the same hostname.
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5678
      targetPort: http
  selector:
    app: n8n
