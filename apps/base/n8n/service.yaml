apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
  labels:
    # The ServiceMonitor in monitoring/configs/staging/n8n-metrics selects on
    # SERVICE labels, not on spec.selector below.
    app: n8n
  # NO tailscale.com/expose annotation: the tailnet device comes from
  # ingress-tailscale.yaml, and two mechanisms contend for the same hostname.
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5678
      targetPort: http
  selector:
    app: n8n
