# The n8n UI, published on the tailnet and nowhere else.
#
# PRECONDITION: HTTPS Certificates enabled in the Tailscale admin console
# (DNS → HTTPS Certificates). Without it the proxy comes up with no certificate
# and the UI is unreachable.
#
# The Service must carry NO tailscale.com/expose annotation: both mechanisms at
# once would register two tailnet devices contending for the same hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: n8n
      port:
        number: 5678
  tls:
    # Device name — N8N_HOST and WEBHOOK_URL in the staging ConfigMap must match.
    - hosts:
        - n8n
