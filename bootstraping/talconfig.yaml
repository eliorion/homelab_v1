---
# DO NOT regenerate talsecret.sops.yaml -- a new PKI is a dead cluster.
clusterName: Homelab_staging
talosVersion: v1.13.4
kubernetesVersion: v1.36.1
endpoint: https://192.168.1.100:6443

allowSchedulingOnControlPlanes: true

additionalMachineCertSans:
  - 192.168.1.100
additionalApiServerCertSans:
  - 192.168.1.100

clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12

# Talos installs no CNI; Cilium comes from Flux.
cniConfig:
  name: none

nodes:
  - hostname: staging-controlplane-1   # AMD box
    ipAddress: 192.168.1.101
    controlPlane: true
    installDisk: /dev/nvme0n1
    talosImageURL: factory.talos.dev/installer/11928acc918f7c25902bba02422dd200004f11d29f18ab9410d4863e7c3047e7
    # These must NOT become cluster-wide patches: the sata selector below would
    # match node-2's and node-3's install disks.
    # Adding a kubelet extraMounts bind for /var/mnt/* here re-triggers
    # siderolabs/talos#13069 -- Talos already propagates /var/mnt to kubelet.
    patches:
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-sata-640
        provisioning:
          diskSelector:
            match: disk.transport == 'sata' && disk.rotational && !system_disk
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      # by-path, not WWID: both dock bays report naa.5000000000000001, so a
      # WWID or size selector cannot tell the two disks apart. LUN 0 is the
      # 1.0TB, LUN 1 the 500GB. Moving the dock breaks these on purpose.
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-usb-1000
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-path/pci-0000:04:00.4-usb-0:2:1.0-scsi-0:0:0:0' in disk.symlinks"
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-usb-500
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-path/pci-0000:04:00.4-usb-0:2:1.0-scsi-0:0:0:1' in disk.symlinks"
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      # LINSTOR's LVM-thin pool. Raw volumes are provisioned BEFORE EPHEMERAL,
      # which is what lets the two share the disk. Inert until EPHEMERAL is
      # wiped -- Talos only grows volumes, it never shrinks them in place.
      - |-
        apiVersion: v1alpha1
        kind: RawVolumeConfig
        name: linstor
        provisioning:
          diskSelector:
            match: system_disk
          minSize: 240GB
          maxSize: 240GB
      # 240 + 240 + ~2GB of system partitions must fit the 500GB NVMe.
      - |-
        apiVersion: v1alpha1
        kind: VolumeConfig
        name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 240GB
      # Longhorn reads this pair ONLY when it first registers the node, so it
      # is a rebuild path, not a live one. Malformed JSON = node with no disk.
      # The /var/lib/longhorn entry must stay listed or a rebuilt node loses it.
      # hdd-sata-640 is deliberately NOT listed any more: it belongs to
      # SeaweedFS now, and a Postgres replica must never land on a 20-IOPS
      # spindle. Remove this whole patch once Longhorn is uninstalled.
      - |-
        machine:
          nodeLabels:
            node.longhorn.io/create-default-disk: config
          nodeAnnotations:
            node.longhorn.io/default-disks-config: '[{"path":"/var/lib/longhorn","allowScheduling":true,"storageReserved":74633213952,"tags":[]}]'
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.101/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

  - hostname: staging-controlplane-2   # Intel box
    ipAddress: 192.168.1.102
    controlPlane: true
    installDisk: /dev/sda
    talosImageURL: factory.talos.dev/installer/b86969a5f5abcc3e3be770b80c8cbf963af64f5d6d1000a2a88366943b272671
    patches:
      # by-path, not WWID: both dock bays report the same WWID. LUN 0 is the
      # 2.0TB, LUN 1 the 320GB. The 250GB disk on pci-0000:00:1d.0 is excluded
      # by construction -- its bridge fakes cache flushes (documentations/16)
      # and it must never hold data.
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-usb-2000
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-path/pci-0000:00:14.0-usb-0:6:1.0-scsi-0:0:0:0' in disk.symlinks"
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-usb-320
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-path/pci-0000:00:14.0-usb-0:6:1.0-scsi-0:0:0:1' in disk.symlinks"
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      # Inert until EPHEMERAL is wiped; see node-1.
      - |-
        apiVersion: v1alpha1
        kind: RawVolumeConfig
        name: linstor
        provisioning:
          diskSelector:
            match: system_disk
          minSize: 730GB
          maxSize: 730GB
      - |-
        apiVersion: v1alpha1
        kind: VolumeConfig
        name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 250GB
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.102/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

  - hostname: staging-controlplane-3   # Intel box
    ipAddress: 192.168.1.103
    controlPlane: true
    installDisk: /dev/sda
    talosImageURL: factory.talos.dev/installer/b86969a5f5abcc3e3be770b80c8cbf963af64f5d6d1000a2a88366943b272671
    patches:
      # Unformatted partition, published at /dev/disk/by-partlabel/r-fastpool.
      # Was a Ceph OSD; becomes LINSTOR's ssd pool on this node, which is why
      # node-3 needs no EPHEMERAL wipe. Keep the name: renaming it recreates
      # the partition and evacuating the pool first is the only safe order.
      - |-
        apiVersion: v1alpha1
        kind: RawVolumeConfig
        name: fastpool
        provisioning:
          diskSelector:
            match: system_disk
          minSize: 250GB
          maxSize: 250GB
      # Carries /var/lib/longhorn AND the container images. Must clear Longhorn's
      # 478GB scheduled plus 163GB of images, or the partition fills: Longhorn
      # schedules against provisioned size and reserves nothing here today.
      # 250 + 740 + ~2GB of system partitions must fit the 997GB disk.
      # Shrinking this needs an EPHEMERAL wipe; Talos never shrinks in place.
      - |-
        apiVersion: v1alpha1
        kind: VolumeConfig
        name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 740GB
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.103/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

# Shared machine-level settings talhelper has no first-class field for.
patches:
  - |-
    machine:
      # The factory schematic ships the DRBD modules; nothing loads them
      # without this block -- piraeus-operator#692, "you won't get any volumes
      # created". usermode_helper=disabled is required because Talos has no
      # systemd for DRBD to hand off to, and dm-thin-pool is
      # CONFIG_DM_THIN_PROVISIONING=m, which LVM_THIN storage pools need.
      kernel:
        modules:
          - name: drbd
            parameters:
              - usermode_helper=disabled
          - name: drbd_transport_tcp
          - name: dm-thin-pool
      kubelet:
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
        extraArgs:
          rotate-server-certificates: true
        extraMounts:
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options:
              - bind
              - rshared
              - rw
      install:
        wipe: false
        grubUseUKICmdline: true
      features:
        diskQuotaSupport: true
        kubePrism:
          enabled: true
          port: 7445
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: true
        # Removing this block breaks the etcd-backup CronJob.
        kubernetesTalosAPIAccess:
          enabled: true
          allowedRoles:
            - os:etcd:backup
          allowedKubernetesNamespaces:
            - etcd-backup
      nodeLabels:
        node.kubernetes.io/exclude-from-external-load-balancers: ""
  # PodSecurity admissionControl + auditPolicy come from talhelper defaults --
  # re-adding them here duplicates the kube-system exemption.
  - |-
    cluster:
      # Cilium replaces kube-proxy -- do not deploy it.
      proxy:
        disabled: true
      discovery:
        enabled: true
        registries:
          kubernetes:
            disabled: true
          service: {}
      extraManifests:
        - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
        - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        # Cilium 1.19 requires the gateway-api v1.4.1 standard channel.
        - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.4.1/config/crd/experimental/gateway.networking.k8s.io_tlsroutes.yaml
