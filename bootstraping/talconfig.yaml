---
# DO NOT regenerate talsecret.sops.yaml -- a new PKI is a dead cluster.
clusterName: Homelab_staging
talosVersion: v1.13.4
kubernetesVersion: v1.36.1
endpoint: https://192.168.1.100:6443

allowSchedulingOnControlPlanes: true

additionalMachineCertSans:
  - 192.168.1.100
additionalApiServerCertSans:
  - 192.168.1.100

clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12

# Talos installs no CNI; Cilium comes from Flux.
cniConfig:
  name: none

nodes:
  - hostname: staging-controlplane-1   # AMD box
    ipAddress: 192.168.1.101
    controlPlane: true
    installDisk: /dev/nvme0n1
    talosImageURL: factory.talos.dev/installer/65cf8364cd0de4cf7b851dc7067a2db83d0ba04f11d8635c6cd3334be6ffb825
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.101/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

  - hostname: staging-controlplane-2   # Intel box
    ipAddress: 192.168.1.102
    controlPlane: true
    installDisk: /dev/sda
    talosImageURL: factory.talos.dev/installer/36cd6536eaec8ba802be2d38974108359069cedba8857302f69792b26b87c010
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.102/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

  - hostname: staging-controlplane-3   # Intel box
    ipAddress: 192.168.1.103
    controlPlane: true
    installDisk: /dev/sda
    talosImageURL: factory.talos.dev/installer/36cd6536eaec8ba802be2d38974108359069cedba8857302f69792b26b87c010
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.103/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

# Shared machine-level settings talhelper has no first-class field for.
patches:
  - |-
    machine:
      kubelet:
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
        extraArgs:
          rotate-server-certificates: true
        extraConfig:
          # Image GC must reclaim BEFORE Longhorn stops scheduling, not after.
          #
          # The kubelet defaults are high=85 / low=80, and on this cluster that
          # ordering is inverted against the storage layer. Longhorn's
          # storage-minimal-available-percentage is 25, so a disk goes
          # UNSCHEDULABLE at 25% free. Measured on node 1 (463.4 GiB, shared
          # /var, so imagefs == nodefs) on 2026-08-12:
          #
          #   115.8 GiB free   Longhorn marks the disk unschedulable
          #    69.5 GiB free   kubelet image GC finally runs (85% used)
          #    46.3 GiB free   kubelet starts evicting pods (nodefs 10%)
          #
          # i.e. storage breaks with 46 GiB still to go before the kubelet
          # deletes a single image -- while 86.8 GiB of container images sit on
          # that node doing nothing. This is a CI cluster; images are the churn.
          #
          # 70/60 moves the GC trigger to 139.0 GiB free on node 1, ahead of
          # Longhorn's floor. Both numbers were checked against every node
          # before being chosen:
          #
          #   node     used    images   non-image (the floor GC cannot go below)
          #   node 1   52.8%   86.8Gi   34.1%
          #   node 2   55.7%   70.6Gi   48.1%
          #   node 3   34.0%  143.1Gi   18.6%
          #
          # Every node is already below 60%, so this triggers NO garbage
          # collection on apply -- it arms a valve, it does not fire one. And
          # low=60 is reachable by deleting images alone on all three, which
          # matters: an unreachable low threshold makes the kubelet retry GC
          # every pass forever.
          #
          # Deliberately NOT set: imageMaximumGCAge. That deletes images by age
          # regardless of pressure, which is a proactive policy rather than a
          # correction to this ordering bug. It is the next lever if growth
          # resumes -- re-pulls come from the in-cluster Nexus proxy, so it is
          # cheap here -- but it is a separate decision from this one.
          imageGCHighThresholdPercent: 70
          imageGCLowThresholdPercent: 60
        extraMounts:
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options:
              - bind
              - rshared
              - rw
      install:
        wipe: false
        grubUseUKICmdline: true
      features:
        diskQuotaSupport: true
        kubePrism:
          enabled: true
          port: 7445
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: true
        # Removing this block breaks the etcd-backup CronJob.
        kubernetesTalosAPIAccess:
          enabled: true
          allowedRoles:
            - os:etcd:backup
          allowedKubernetesNamespaces:
            - etcd-backup
      nodeLabels:
        node.kubernetes.io/exclude-from-external-load-balancers: ""
  # PodSecurity admissionControl + auditPolicy come from talhelper defaults --
  # re-adding them here duplicates the kube-system exemption.
  - |-
    cluster:
      etcd:
        extraArgs:
          # Expose etcd's own metrics so this cluster can SEE its storage layer.
          #
          # It could not. On 2026-08-12 the apiserver logged `etcdserver: no
          # leader` at 15:40, 15:43, 18:29 and 18:48, which produced 256 apiserver
          # 504s, 500s on unrelated resources (postgresql.cnpg.io/clusters 193,
          # leases 38) and killed the leader-election lease of every
          # controller-runtime operator on the cluster -- plugin-barman-cloud has
          # 109 restarts, source-controller 11, cainjector 6. Nothing alerted,
          # because there is no etcd target at all: etcd listens on 127.0.0.1 with
          # client-cert auth, so `kubeEtcd` in kube-prometheus-stack scraped
          # nothing and was switched off. Every etcd-side number that would
          # explain a leader loss -- wal_fsync, backend_commit, leader_changes,
          # heartbeat sends failed -- was simply unavailable.
          #
          # 2381 is etcd's dedicated metrics listener. It serves ONLY /metrics and
          # /health: no key material, no read or write path to the keyspace, and
          # no client-cert requirement, which is why binding it plaintext is the
          # documented way to do this. It is reachable on the node's LAN address
          # -- acceptable here (private VLAN, and the etcd CLIENT port keeps its
          # mTLS on 2379) but it IS a new listening port on every control plane,
          # so it is called out rather than buried.
          #
          # Nothing scrapes this until kubeEtcd is re-enabled in the monitoring
          # chart. THAT CHANGE MUST LAND AFTER THIS ONE, or KubeEtcdDown fires
          # against a port that is not open yet.
          listen-metrics-urls: http://0.0.0.0:2381
      # Cilium replaces kube-proxy -- do not deploy it.
      proxy:
        disabled: true
      discovery:
        enabled: true
        registries:
          kubernetes:
            disabled: true
          service: {}
      extraManifests:
        - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
        - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        # Cilium 1.19 requires the gateway-api v1.4.1 standard channel.
        - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.4.1/config/crd/experimental/gateway.networking.k8s.io_tlsroutes.yaml
