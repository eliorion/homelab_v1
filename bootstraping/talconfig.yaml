---
# DO NOT regenerate talsecret.sops.yaml -- a new PKI is a dead cluster.
clusterName: Homelab_staging
talosVersion: v1.13.4
kubernetesVersion: v1.36.1
endpoint: https://192.168.1.100:6443

allowSchedulingOnControlPlanes: true

additionalMachineCertSans:
  - 192.168.1.100
additionalApiServerCertSans:
  - 192.168.1.100

clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12

# Talos installs no CNI; Cilium comes from Flux.
cniConfig:
  name: none

nodes:
  - hostname: staging-controlplane-1   # AMD box
    ipAddress: 192.168.1.101
    controlPlane: true
    installDisk: /dev/nvme0n1
    talosImageURL: factory.talos.dev/installer/54a5f422871af4c35624f58a6fea87b3c58d7859fd6754bde6732348f5a6a7ec
    # These must NOT become cluster-wide patches: the sata selector below would
    # match node-2's and node-3's install disks.
    # Adding a kubelet extraMounts bind for /var/mnt/* here re-triggers
    # siderolabs/talos#13069 -- Talos already propagates /var/mnt to kubelet.
    patches:
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-sata-640
        provisioning:
          diskSelector:
            match: disk.transport == 'sata' && disk.rotational && !system_disk
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      # by-path, not WWID: both dock bays report naa.5000000000000001, so a
      # WWID or size selector cannot tell the two disks apart. LUN 0 is the
      # 1.0TB, LUN 1 the 500GB. Moving the dock breaks these on purpose.
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-usb-1000
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-path/pci-0000:04:00.4-usb-0:2:1.0-scsi-0:0:0:0' in disk.symlinks"
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-usb-500
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-path/pci-0000:04:00.4-usb-0:2:1.0-scsi-0:0:0:1' in disk.symlinks"
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      # LINSTOR's LVM-thin pool. Raw volumes are provisioned BEFORE EPHEMERAL,
      # which is what lets the two share the disk. Inert until EPHEMERAL is
      # wiped -- Talos only grows volumes, it never shrinks them in place.
      - |-
        apiVersion: v1alpha1
        kind: RawVolumeConfig
        name: linstor
        provisioning:
          diskSelector:
            match: system_disk
          minSize: 240GB
          maxSize: 240GB
      # 240 + 240 + ~2GB of system partitions must fit the 500GB NVMe.
      - |-
        apiVersion: v1alpha1
        kind: VolumeConfig
        name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 240GB
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.101/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

  - hostname: staging-controlplane-2   # Intel box
    ipAddress: 192.168.1.102
    controlPlane: true
    installDisk: /dev/sda
    talosImageURL: factory.talos.dev/installer/98559b2575b328fe44684928c8faf3e592391568fe12ee6fb1bed2a8154e2789
    patches:
      # by-path, not WWID: both dock bays report the same WWID. LUN 0 is the
      # 2.0TB, LUN 1 the 320GB. The 250GB disk on pci-0000:00:1d.0 is excluded
      # by construction -- its bridge fakes cache flushes (documentations/16)
      # and it must never hold data.
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-usb-2000
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-path/pci-0000:00:14.0-usb-0:6:1.0-scsi-0:0:0:0' in disk.symlinks"
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-usb-320
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-path/pci-0000:00:14.0-usb-0:6:1.0-scsi-0:0:0:1' in disk.symlinks"
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      # Inert until EPHEMERAL is wiped; see node-1.
      - |-
        apiVersion: v1alpha1
        kind: RawVolumeConfig
        name: linstor
        provisioning:
          diskSelector:
            match: system_disk
          minSize: 745GB
          maxSize: 745GB
      - |-
        apiVersion: v1alpha1
        kind: VolumeConfig
        name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 250GB
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.102/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

  - hostname: staging-controlplane-3   # Intel box
    ipAddress: 192.168.1.103
    controlPlane: true
    installDisk: /dev/sda
    talosImageURL: factory.talos.dev/installer/98559b2575b328fe44684928c8faf3e592391568fe12ee6fb1bed2a8154e2789
    patches:
      # Same r-linstor label as node-1 and node-2, so a single
      # LinstorSatelliteConfiguration covers all three nodes. Was Ceph's
      # r-fastpool: Talos refused `wipe disk sda7 --drop-partition` with
      # "block device is in use" (siderolabs/talos#12263) even with no mount,
      # no holder and no dm device -- the CLI exposes no override for a
      # partition of the system disk. The EPHEMERAL wipe and reboot removed it.
      - |-
        apiVersion: v1alpha1
        kind: RawVolumeConfig
        name: linstor
        provisioning:
          diskSelector:
            match: system_disk
          minSize: 745GB
          maxSize: 745GB
      # 250 + 745 + ~2.3GB of system partitions must fit the 1000GB disk.
      # Longhorn is gone, so EPHEMERAL only carries the image store and system.
      - |-
        apiVersion: v1alpha1
        kind: VolumeConfig
        name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          maxSize: 250GB
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.103/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

# Shared machine-level settings talhelper has no first-class field for.
patches:
  - |-
    machine:
      # The factory schematic ships the DRBD modules; nothing loads them
      # without this block -- piraeus-operator#692, "you won't get any volumes
      # created". usermode_helper=disabled is required because Talos has no
      # systemd for DRBD to hand off to, and dm-thin-pool is
      # CONFIG_DM_THIN_PROVISIONING=m, which LVM_THIN storage pools need.
      kernel:
        modules:
          - name: drbd
            parameters:
              - usermode_helper=disabled
          - name: drbd_transport_tcp
          - name: dm-thin-pool
      # gVisor (runsc) needs unprivileged user namespaces; Talos sets 0 (KSPP).
      # Removing this breaks every runtimeClassName: gvisor pod at sandbox start.
      sysctls:
        user.max_user_namespaces: "11255"
      kubelet:
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
        extraArgs:
          rotate-server-certificates: true
        extraConfig:
          # A partial evictionHard zeroes the signals it omits: keep all five.
          evictionHard:
            memory.available: 1Gi
            nodefs.available: 10%
            nodefs.inodesFree: 5%
            imagefs.available: 15%
            imagefs.inodesFree: 5%
          evictionSoft:
            memory.available: 2Gi
          evictionSoftGracePeriod:
            memory.available: 30s
          evictionMaxPodGracePeriod: 60
          kubeReserved:
            memory: 1Gi
      install:
        wipe: false
        grubUseUKICmdline: true
      features:
        diskQuotaSupport: true
        kubePrism:
          enabled: true
          port: 7445
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: true
        # Removing this block breaks the etcd-backup CronJob.
        kubernetesTalosAPIAccess:
          enabled: true
          allowedRoles:
            - os:etcd:backup
          allowedKubernetesNamespaces:
            - etcd-backup
      nodeLabels:
        node.kubernetes.io/exclude-from-external-load-balancers: ""
  # Harbor proxy-cache mirrors. See infrastructure/services/base/harbor/README.md.
  # registry-tls must verify against the system trust store, or containerd rejects every pull on every node.
  # Standalone documents, NOT machine.registries.mirrors: there overridePath also strips /v2 from the fallback.
  # Never add skipFallback (Harbor runs inside this cluster: cold-start deadlock) and never a '*' mirror.
  - |-
    apiVersion: v1alpha1
    kind: RegistryMirrorConfig
    name: docker.io
    endpoints:
      - url: https://registry.eliorion.fr/v2/dockerhub-proxy
        overridePath: true
      - url: https://registry-1.docker.io
  - |-
    apiVersion: v1alpha1
    kind: RegistryMirrorConfig
    name: ghcr.io
    endpoints:
      # ghcr-public, NOT ghcr-proxy: ghcr-proxy is private and the nodes hold no Harbor credentials.
      - url: https://registry.eliorion.fr/v2/ghcr-public
        overridePath: true
      - url: https://ghcr.io
  # PodSecurity admissionControl + auditPolicy come from talhelper defaults --
  # re-adding them here duplicates the kube-system exemption.
  - |-
    cluster:
      # Never give the apiserver a memory limit.
      apiServer:
        resources:
          requests:
            cpu: 200m
            memory: 2Gi
      # Cilium replaces kube-proxy -- do not deploy it.
      proxy:
        disabled: true
      discovery:
        enabled: true
        registries:
          kubernetes:
            disabled: true
          service: {}
      extraManifests:
        - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
        - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        # Cilium 1.19 requires the gateway-api v1.4.1 standard channel.
        - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.4.1/config/crd/experimental/gateway.networking.k8s.io_tlsroutes.yaml
  # Control-plane metrics for kube-prometheus-stack (monitoring/controllers). etcd's
  # listener is plaintext and unauthenticated: see monitoring/controllers/base/kube-prometheus-stack/README.md.
  - |-
    cluster:
      controllerManager:
        extraArgs:
          bind-address: 0.0.0.0
      scheduler:
        extraArgs:
          bind-address: 0.0.0.0
      etcd:
        extraArgs:
          listen-metrics-urls: http://0.0.0.0:2381
          # election-timeout must stay >= 5x heartbeat-interval. Takes effect only on reboot.
          heartbeat-interval: "500"
          election-timeout: "5000"
