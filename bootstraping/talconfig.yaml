---
# DO NOT regenerate talsecret.sops.yaml -- a new PKI is a dead cluster.
clusterName: Homelab_staging
talosVersion: v1.13.4
kubernetesVersion: v1.36.1
endpoint: https://192.168.1.100:6443

allowSchedulingOnControlPlanes: true

additionalMachineCertSans:
  - 192.168.1.100
additionalApiServerCertSans:
  - 192.168.1.100

clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12

# Talos installs no CNI; Cilium comes from Flux.
cniConfig:
  name: none

nodes:
  - hostname: staging-controlplane-1   # AMD box
    ipAddress: 192.168.1.101
    controlPlane: true
    installDisk: /dev/nvme0n1
    talosImageURL: factory.talos.dev/installer/65cf8364cd0de4cf7b851dc7067a2db83d0ba04f11d8635c6cd3334be6ffb825
    # These must NOT become cluster-wide patches: the sata selector below would
    # match node-2's and node-3's install disks.
    # Adding a kubelet extraMounts bind for /var/mnt/* here re-triggers
    # siderolabs/talos#13069 -- Talos already propagates /var/mnt to kubelet.
    patches:
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: hdd-sata-640
        provisioning:
          diskSelector:
            match: disk.transport == 'sata' && disk.rotational && !system_disk
          minSize: 100GB
          grow: true
        filesystem:
          type: xfs
      # No UserVolumeConfig for the USB disks: they are raw block devices for
      # Rook/Ceph. Giving them a filesystem here takes them away from Ceph.
      # Longhorn reads this pair ONLY when it first registers the node, so it
      # is a rebuild path, not a live one. Malformed JSON = node with no disk.
      # The /var/lib/longhorn entry must stay listed or a rebuilt node loses it.
      - |-
        machine:
          nodeLabels:
            node.longhorn.io/create-default-disk: config
          nodeAnnotations:
            node.longhorn.io/default-disks-config: '[{"path":"/var/lib/longhorn","allowScheduling":true,"storageReserved":74633213952,"tags":[]},{"path":"/var/mnt/hdd-sata-640","allowScheduling":true,"storageReserved":96020254310,"tags":[]}]'
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.101/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

  - hostname: staging-controlplane-2   # Intel box
    ipAddress: 192.168.1.102
    controlPlane: true
    installDisk: /dev/sda
    talosImageURL: factory.talos.dev/installer/36cd6536eaec8ba802be2d38974108359069cedba8857302f69792b26b87c010
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.102/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

  - hostname: staging-controlplane-3   # Intel box
    ipAddress: 192.168.1.103
    controlPlane: true
    installDisk: /dev/sda
    talosImageURL: factory.talos.dev/installer/36cd6536eaec8ba802be2d38974108359069cedba8857302f69792b26b87c010
    nameservers:
      - 192.168.1.1
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.103/24
        vip:
          ip: 192.168.1.100
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
          - network: 100.64.0.0/10
            gateway: 192.168.1.200

# Shared machine-level settings talhelper has no first-class field for.
patches:
  - |-
    machine:
      kubelet:
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
        extraArgs:
          rotate-server-certificates: true
        extraMounts:
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options:
              - bind
              - rshared
              - rw
      install:
        wipe: false
        grubUseUKICmdline: true
      features:
        diskQuotaSupport: true
        kubePrism:
          enabled: true
          port: 7445
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: true
        # Removing this block breaks the etcd-backup CronJob.
        kubernetesTalosAPIAccess:
          enabled: true
          allowedRoles:
            - os:etcd:backup
          allowedKubernetesNamespaces:
            - etcd-backup
      nodeLabels:
        node.kubernetes.io/exclude-from-external-load-balancers: ""
  # PodSecurity admissionControl + auditPolicy come from talhelper defaults --
  # re-adding them here duplicates the kube-system exemption.
  - |-
    cluster:
      # Cilium replaces kube-proxy -- do not deploy it.
      proxy:
        disabled: true
      discovery:
        enabled: true
        registries:
          kubernetes:
            disabled: true
          service: {}
      extraManifests:
        - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
        - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        # Cilium 1.19 requires the gateway-api v1.4.1 standard channel.
        - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.4.1/config/crd/experimental/gateway.networking.k8s.io_tlsroutes.yaml
