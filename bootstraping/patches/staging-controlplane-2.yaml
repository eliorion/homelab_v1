# Intel box.
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: staging-controlplane-2
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.1.1
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: link.type == 1
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.1.100
link: ethSel0
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
addresses:
  - address: 192.168.1.102/24
routes:
  - gateway: 192.168.1.1
  - destination: 100.64.0.0/10
    gateway: 192.168.1.200
---
# by-path, not WWID: both dock bays report the same WWID. LUN 0 is the 2.0TB,
# LUN 1 the 320GB. The 250GB disk on pci-0000:00:1d.0 must never hold data:
# its bridge fakes cache flushes (documentations/16).
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd-usb-2000
provisioning:
  diskSelector:
    match: "'/dev/disk/by-path/pci-0000:00:14.0-usb-0:6:1.0-scsi-0:0:0:0' in disk.symlinks"
  minSize: 100GB
  grow: true
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd-usb-320
provisioning:
  diskSelector:
    match: "'/dev/disk/by-path/pci-0000:00:14.0-usb-0:6:1.0-scsi-0:0:0:1' in disk.symlinks"
  minSize: 100GB
  grow: true
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: linstor
provisioning:
  diskSelector:
    match: system_disk
  minSize: 745GB
  maxSize: 745GB
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 250GB
