# AMD box. These volume documents must NOT become shared: the sata selector would
# match node-2's and node-3's install disks.
# Adding a kubelet extraMounts bind for /var/mnt/* re-triggers siderolabs/talos#13069.
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: staging-controlplane-1
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.1.1
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: link.type == 1
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.1.100
link: ethSel0
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
addresses:
  - address: 192.168.1.101/24
routes:
  - gateway: 192.168.1.1
  - destination: 100.64.0.0/10
    gateway: 192.168.1.200
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd-sata-640
provisioning:
  diskSelector:
    match: disk.transport == 'sata' && disk.rotational && !system_disk
  minSize: 100GB
  grow: true
filesystem:
  type: xfs
---
# by-path, not WWID: both dock bays report naa.5000000000000001. LUN 0 is the
# 1.0TB, LUN 1 the 500GB. Moving the dock breaks these on purpose.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd-usb-1000
provisioning:
  diskSelector:
    match: "'/dev/disk/by-path/pci-0000:04:00.4-usb-0:2:1.0-scsi-0:0:0:0' in disk.symlinks"
  minSize: 100GB
  grow: true
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd-usb-500
provisioning:
  diskSelector:
    match: "'/dev/disk/by-path/pci-0000:04:00.4-usb-0:2:1.0-scsi-0:0:0:1' in disk.symlinks"
  minSize: 100GB
  grow: true
filesystem:
  type: xfs
---
# LINSTOR's LVM-thin pool. Raw volumes are provisioned BEFORE EPHEMERAL.
apiVersion: v1alpha1
kind: RawVolumeConfig
name: linstor
provisioning:
  diskSelector:
    match: system_disk
  minSize: 240GB
  maxSize: 240GB
---
# 240 + 240 + ~2GB of system partitions must fit the 500GB NVMe.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 240GB
